<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOOM 2226 · Media Inspector</title><style>body{font:14px system-ui;background:#071015;color:#dce8ed;margin:0}header{position:sticky;top:0;background:#071015;padding:16px;border-bottom:1px solid #24414e}input,select{background:#10212a;color:inherit;padding:8px;margin:4px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:16px}.card{border:1px solid #355463;padding:8px}.card img{width:100%;height:155px;object-fit:cover}a{color:#9dd7e5}pre{white-space:pre-wrap;overflow-wrap:anywhere}main{padding:16px}</style><header><h1>LOOM 2226 · Media + Canon Inspector</h1><p id="status">Loading approved snapshot…</p><input id="search" placeholder="Search records"><select id="cel"><option value="">All celestial objects</option></select><select id="type"><option value="">All object types</option></select><p>Read-only derived media snapshot. SQL row inspection and CIVSTATE are not published.</p></header><div id="gallery" class="grid"></div><main id="details"></main><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let records=[];function draw(){let q=$('search').value.toLowerCase(),cel=$('cel').value,type=$('type').value,rows=records.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!cel||x.celestial_object===cel)&&(!type||x.object_type===type));$('status').textContent=rows.length+' approved current assets';$('gallery').innerHTML=rows.map(x=>'<article class="card"><a target="_blank" rel="noopener" href="'+encodeURI(x.original)+'"><img loading="lazy" src="'+encodeURI(x.thumbnail)+'" alt="'+esc(x.name)+'"></a><h3>'+esc(x.name)+'</h3><p>'+esc(x.object_type)+' · '+esc(x.celestial_object)+'</p><button data-id="'+esc(x.asset_id)+'">Inspect</button></article>').join('');document.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{let x=records.find(r=>r.asset_id===b.dataset.id);$('details').innerHTML='<h2>'+esc(x.name)+'</h2><p>'+esc((x.ancestry||[]).map(a=>a.name).join(' → '))+'</p><pre>'+esc(JSON.stringify(x,null,2))+'</pre>';$('details').scrollIntoView()})}fetch('catalog.json').then(r=>{if(!r.ok)throw Error('catalog.json HTTP '+r.status);return r.json()}).then(j=>{if(j.status!=='APPROVED_FOR_PUBLICATION')throw Error('Catalogue not approved for publication');records=j.assets||[];for(let [id,key] of [['cel','celestial_object'],['type','object_type']])for(let v of [...new Set(records.map(r=>r[key]).filter(Boolean))].sort()){let o=document.createElement('option');o.value=o.textContent=v;$(id).append(o)}draw()}).catch(e=>$('status').textContent='Inspector not deployed: '+e.message);['search','cel','type'].forEach(id=>$(id).addEventListener('input',draw));</script></html>
