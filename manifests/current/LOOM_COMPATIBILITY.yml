platform_and_vendor_gaps:
  python_runtime_version:
    state: NOT_PINNED_BY_CURRENT_RELEASE_MANIFEST
    impact: >-
      Record as a compatibility gap; do not infer incompatibility. Pin/test when a
      future production release requires interpreter-level reproducibility.
  threejs_version:
    state: NOT_RECORDED_IN_CURRENT_WAYFARER_MANIFEST
    impact: >-
      Known viewer dependency gap. Does not change authoritative geometry; resolve
      before treating a future 3D viewer bundle as a fully reproducible release.
  github_distribution:
    provider: GitHub
    role: repository_and_release_asset_host
    content_authority: false
    credentials: DEVICE_LOCAL_NOT_COMMITTED

compatibility_rules:
  current_runtime_requires_exact_artifact_hashes: true
  current_navigator_requires_civstate_schema: 1.2-runtime
  current_navigator_requires_civstate_exact_sha256: true
  mutable_local_campaign_state_preserved_on_update: true
  media_payload_may_be_release_asset_not_git_blob: true
  generated_wayfarer_json_is_source_authority: false
  runtime_or_3d_finding_may_rewrite_canon_automatically: false
  release_manifest_change_requires_compatibility_review: true
  upstream_authority_change_requires_downstream_classification: true

compatibility_state_values:
