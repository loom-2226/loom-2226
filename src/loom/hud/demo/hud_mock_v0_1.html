<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="loom-hud-build" content="hud-v0.4-synthvision"><title>LOOM HUD v0.4 — SYNTHETIC VISION MOCK</title><style>:root{color-scheme:dark;--line:#7fd7d0;--muted:#8ea2aa;--warn:#f0c36a;--text:#d8f5f1;--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020405;color:var(--text);font-family:ui-monospace,monospace}body{overflow:hidden}.hud{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}.top{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 9px;border-bottom:1px solid #244;background:#020708}.brand{font-size:11px}.sub{font-size:8px;color:var(--warn)}.tabs,.modes,.frames{display:flex;border:1px solid #355}.tabs button,.modes button,.frames button{background:#071014;color:var(--muted);border:0;border-right:1px solid #355;padding:5px 8px;font:inherit;font-size:9px}.tabs button.active,.modes button.active,.frames button.active{color:var(--text);background:#123036}.stage{position:relative;overflow:hidden;touch-action:none}.scene,.glass{position:absolute;inset:0;width:100%;height:100%;display:block}.glass{pointer-events:none}.readout{position:absolute;left:10px;top:10px;background:rgba(2,8,10,.74);border-left:2px solid var(--line);padding:6px 8px;font-size:10px}.badge{position:absolute;right:10px;top:10px;color:var(--line);font-size:9px}.footer{display:grid;grid-template-columns:1fr auto;padding:4px 8px calc(4px + var(--safe));border-top:1px solid #244;background:#03090b;font-size:8px;color:var(--muted)}.warn{color:var(--warn)}.obj{fill:var(--text);font-size:13px}.meta{fill:var(--muted);font-size:9px}.ret{stroke:var(--line);fill:none;stroke-width:1.5}.planet{fill:#61717d;stroke:#c9d3d8;stroke-width:1}.traj{stroke:#557b86;fill:none;stroke-width:1}.cmd{stroke:var(--warn);fill:none;stroke-width:2}.edge{fill:var(--warn)}.star{fill:#b8c1c5;opacity:.7}@media(orientation:portrait){.top{grid-template-columns:1fr auto;grid-template-areas:'b t' 'm m' 'f f'}.brandwrap{grid-area:b}.tabs{grid-area:t}.modes{grid-area:m}.frames{grid-area:f;overflow-x:auto}.tabs button,.modes button,.frames button{padding:4px 6px;font-size:8px}}@media(orientation:landscape){.top{grid-template-columns:1fr auto auto auto}.readout{top:12px}}</style></head><body><div class="hud" id="root"><div class="top"><div class="brandwrap"><div class="brand">LOOM / FORWARD SYNTHETIC VISION</div><div class="sub">BUILD hud-v0.4-synthvision • MOCK / QUALIFICATION_ONLY</div></div><div class="tabs"><button class="active">PILOT</button><button>TACTICAL</button><button disabled>NAV</button></div><div class="modes" id="modes"><button data-mode="optical">OPTICAL</button><button data-mode="tactical">TACTICAL</button><button class="active" data-mode="hybrid">HYBRID</button></div><div class="frames" id="frames"><button class="active" data-frame="INERTIAL">INERTIAL</button><button data-frame="VELOCITY">VELOCITY</button><button data-frame="HILL_LVLH">HILL</button><button data-frame="BODY">BODY</button><button data-frame="TARGET">TARGET</button></div></div><div class="stage" id="stage"><svg class="scene" id="scene"></svg><svg class="glass" id="glass"></svg><div class="readout"><b>NEPTUNE / MOCK</b><br>BEARING <span id="bearing">+17.00°</span> • ELEV <span id="elev">0.00°</span><br>RANGE 1,000,000 km • CLOSURE 0.00 km/s</div><div class="badge" id="badge">HYBRID • INERTIAL</div></div><div class="footer"><span>world → camera projection only • no canonical physics in browser</span><span class="warn">MOCK • NO NAV AUTHORITY</span></div></div><script>(()=>{'use strict';const NS='http://www.w3.org/2000/svg',scene=document.getElementById('scene'),glass=document.getElementById('glass'),stage=document.getElementById('stage'),badge=document.getElementById('badge');let mode='hybrid',frame='INERTIAL';const D=1e9,A=17*Math.PI/180;const objects=[{id:'NEPTUNE_MOCK',label:'NEPTUNE',type:'planet',p:[D*Math.cos(A),D*Math.sin(A),0],radius:24622000,priority:100},{id:'SHIP_02_MOCK',label:'CONTACT 02',type:'ship',p:[420000,110000,30000],radius:30,priority:80},{id:'STATION_MOCK',label:'STATION',type:'station',p:[80000000,-18000000,9000000],radius:500,priority:60}];const trajectory=[[0,0,0],[150000,25000,0],[300000,65000,5000],[500000,120000,12000]],cmd=[1,0.18,0.05];function e(n,a={}){const x=document.createElementNS(NS,n);for(const[k,v]of Object.entries(a))x.setAttribute(k,String(v));return x}function clear(n){while(n.firstChild)n.removeChild(n.firstChild)}function project(p,w,h,fovy=60){const [f,r,u]=p,b=Math.atan2(r,f),el=Math.atan2(u,Math.hypot(f,r)),aspect=w/h,ty=Math.tan(fovy*Math.PI/360),tx=ty*aspect,nx=(r/f)/tx,ny=(u/f)/ty;return{x:(nx+1)*w/2,y:(1-ny)*h/2,b:b*180/Math.PI,el:el*180/Math.PI,on:f>0&&Math.abs(nx)<=1&&Math.abs(ny)<=1,infront:f>0,nx,ny}}function edge(q,w,h){const cx=w/2,cy=h/2,dx=(q.x-cx)||Math.sign(q.b)||1,dy=(q.y-cy)||-Math.sign(q.el)||0,s=Math.max(Math.abs(dx)/(cx-18),Math.abs(dy)/(cy-18),1e-9);return[cx+dx/s,cy+dy/s]}function draw(){const r=stage.getBoundingClientRect(),w=Math.max(1,r.width),h=Math.max(1,r.height),vb=`0 0 ${w} ${h}`;scene.setAttribute('viewBox',vb);glass.setAttribute('viewBox',vb);clear(scene);clear(glass);for(let i=0;i<80;i++){const x=(i*137.3)%w,y=(i*i*41.7)%h,rr=(i%5===0)?1.2:.7;scene.append(e('circle',{cx:x,cy:y,r:rr,class:'star'}))}const pts=trajectory.map(p=>project(p.map((v,i)=>v-(i?0:0)),w,h)).filter(q=>q.infront).map(q=>`${q.x},${q.y}`).join(' ');if(pts)scene.append(e('polyline',{points:pts,class:'traj'}));const cq=project([250000,cmd[1]*250000,cmd[2]*250000],w,h);glass.append(e('line',{x1:w/2,y1:h/2,x2:cq.x,y2:cq.y,class:'cmd'}));for(const o of objects){const q=project(o.p,w,h),range=Math.hypot(...o.p),ang=2*Math.atan2(o.radius,range)*180/Math.PI,px=ang/(60/h);const physicallyResolvable=px>=1.2;if(q.on){if(o.type==='planet'&&physicallyResolvable&&(mode==='optical'||mode==='hybrid'))scene.append(e('circle',{cx:q.x,cy:q.y,r:Math.max(2,px/2),class:'planet'}));if(mode!=='optical'||physicallyResolvable){const g=e('g');g.append(e('rect',{x:q.x-18,y:q.y-18,width:36,height:36,class:'ret'}));const t=e('text',{x:q.x+25,y:q.y-3,class:'obj'});t.textContent=o.label;g.append(t);const m=e('text',{x:q.x+25,y:q.y+12,class:'meta'});m.textContent=`${q.b>=0?'+':''}${q.b.toFixed(2)}° • MOCK`;g.append(m);glass.append(g)}}else if(mode!=='optical'){const [x,y]=edge(q,w,h);glass.append(e('circle',{cx:x,cy:y,r:5,class:'edge'}))}}glass.append(e('circle',{cx:w/2,cy:h/2,r:6,class:'ret'}));glass.append(e('line',{x1:w/2-30,y1:h/2,x2:w/2+30,y2:h/2,class:'ret'}));glass.append(e('line',{x1:w/2,y1:h/2-30,x2:w/2,y2:h/2+30,class:'ret'}));const n=project(objects[0].p,w,h);document.getElementById('bearing').textContent=`${n.b>=0?'+':''}${n.b.toFixed(2)}°`;document.getElementById('elev').textContent=`${n.el>=0?'+':''}${n.el.toFixed(2)}°`;badge.textContent=`${mode.toUpperCase()} • ${frame}`}
document.getElementById('modes').onclick=ev=>{const b=ev.target.closest('button[data-mode]');if(!b)return;mode=b.dataset.mode;[...ev.currentTarget.children].forEach(x=>x.classList.toggle('active',x===b));draw()};document.getElementById('frames').onclick=ev=>{const b=ev.target.closest('button[data-frame]');if(!b)return;frame=b.dataset.frame;[...ev.currentTarget.children].forEach(x=>x.classList.toggle('active',x===b));badge.textContent=`${mode.toUpperCase()} • ${frame}`};window.addEventListener('resize',()=>requestAnimationFrame(draw));window.addEventListener('orientationchange',()=>requestAnimationFrame(draw));draw()})();</script></body></html>
