<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="loom-hud-build" content="hud-v0.7-earth-moon-jpl"><title>LOOM HUD v0.7 — Earth Moon JPL Qualification</title><style>:root{color-scheme:dark;--line:#7fd7d0;--muted:#8ea2aa;--warn:#f0c36a;--text:#d8f5f1}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020405;color:var(--text);font-family:ui-monospace,monospace}body{overflow:hidden}.hud{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}.top{padding:7px 10px;border-bottom:1px solid #244;background:#020708}.title{font-size:12px}.sub{font-size:8px;color:var(--warn)}.stage{position:relative;overflow:hidden}.scene,.glass{position:absolute;inset:0;width:100%;height:100%}.readout{position:absolute;left:10px;top:10px;background:rgba(2,8,10,.76);border-left:2px solid var(--line);padding:6px 8px;font-size:10px}.badge{position:absolute;right:10px;top:10px;color:var(--line);font-size:9px;text-align:right;max-width:42%}.footer{padding:6px 8px 10px;border-top:1px solid #244;background:#03090b}.controls{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:9px}.controls input{width:100%}.earth{fill:#355b86;stroke:#a8c4dd;stroke-width:1}.moon{fill:#aeb4bb;stroke:#eee;stroke-width:1}.ret{stroke:var(--line);fill:none;stroke-width:1.4}.edge{fill:var(--warn)}.star{fill:#aaa;opacity:.55}.label{fill:var(--text);font-size:12px}.meta{fill:var(--muted);font-size:8px}.orbit{fill:none;stroke:#3c6870;stroke-width:1}.center{stroke:var(--line);fill:none;stroke-width:1.2}@media(orientation:portrait){.title{font-size:11px}.readout{font-size:9px;max-width:72%}.badge{font-size:7px}}</style></head><body><div class="hud"><div class="top"><div class="title">LOOM / EARTH–MOON FORWARD SYNTHETIC VISION</div><div class="sub">BUILD hud-v0.7-earth-moon-jpl • QUALIFICATION_ONLY • EXTERNAL JPL + HERMITE WHEN CACHE PRESENT</div></div><div class="stage" id="stage"><svg id="scene" class="scene"></svg><svg id="glass" class="glass"></svg><div class="readout" id="readout">LOADING EARTH–MOON STATE…</div><div class="badge" id="badge">2026<br>EARTH-CENTERED J2000/ECLIPTIC</div></div><div class="footer"><div class="controls"><button id="play">PLAY</button><input id="sample" type="range" min="0" max="1" value="0"><span id="timeLabel">T+0h</span></div></div></div><script>(()=>{'use strict';const NS='http://www.w3.org/2000/svg',stage=document.getElementById('stage'),scene=document.getElementById('scene'),glass=document.getElementById('glass'),readout=document.getElementById('readout'),slider=document.getElementById('sample'),timeLabel=document.getElementById('timeLabel'),play=document.getElementById('play');let data=null,timer=null;function E(n,a={}){const x=document.createElementNS(NS,n);for(const[k,v]of Object.entries(a))x.setAttribute(k,String(v));return x}function clear(x){while(x.firstChild)x.removeChild(x.firstChild)}function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}function cam(v){const b=data.camera_basis;return[dot(v,b.forward),dot(v,b.right),dot(v,b.up)]}function project(v,w,h){const[f,r,u]=cam(v),fovy=60*Math.PI/180,ty=Math.tan(fovy/2),tx=ty*(w/h),safeF=Math.abs(f)<1e-12?1e-12:f,nx=(r/safeF)/tx,ny=(u/safeF)/ty;return{x:(nx+1)*w/2,y:(1-ny)*h/2,b:Math.atan2(r,f)*180/Math.PI,e:Math.atan2(u,Math.hypot(f,r))*180/Math.PI,on:f>0&&Math.abs(nx)<=1&&Math.abs(ny)<=1,nx,ny,f}}function edge(q,w,h){const cx=w/2,cy=h/2,dx=(q.x-cx)||1,dy=(q.y-cy)||0,s=Math.max(Math.abs(dx)/(cx-18),Math.abs(dy)/(cy-18),1e-9);return[cx+dx/s,cy+dy/s]}function obj(v,label,klass,radius,w,h){const q=project(v,w,h);if(q.on){scene.append(E('circle',{cx:q.x,cy:q.y,r:radius,class:klass}));glass.append(E('rect',{x:q.x-16,y:q.y-16,width:32,height:32,class:'ret'}));const lx=Math.max(8,Math.min(q.x+22,w-105)),ly=Math.max(16,Math.min(q.y-2,h-25));const t=E('text',{x:lx,y:ly,class:'label'});t.textContent=label;glass.append(t);const m=E('text',{x:lx,y:ly+11,class:'meta'});m.textContent=`${q.b>=0?'+':''}${q.b.toFixed(2)}°`;glass.append(m)}else{const[x,y]=edge(q,w,h);glass.append(E('circle',{cx:x,cy:y,r:5,class:'edge'}))}return q}function draw(){if(!data)return;const r=stage.getBoundingClientRect(),w=Math.max(1,r.width),h=Math.max(1,r.height),vb=`0 0 ${w} ${h}`;scene.setAttribute('viewBox',vb);glass.setAttribute('viewBox',vb);clear(scene);clear(glass);for(let i=0;i<70;i++)scene.append(E('circle',{cx:(i*137.3)%w,cy:(i*i*41.7)%h,r:i%6?0.7:1.2,class:'star'}));const idx=Math.max(0,Math.min(data.samples.length-1,Number(slider.value))),s=data.samples[idx];const stride=Math.max(1,Math.floor(data.samples.length/720));const orbitPts=data.samples.filter((_,i)=>i%stride===0||i===data.samples.length-1).map(x=>project(x.moon_relative_to_observer_km,w,h)).filter(x=>x.f>0&&Number.isFinite(x.x)&&Number.isFinite(x.y)).map(x=>`${x.x},${x.y}`).join(' ');if(orbitPts)scene.append(E('polyline',{points:orbitPts,class:'orbit'}));const mq=obj(s.moon_relative_to_observer_km,'MOON','moon',8,w,h);obj(s.earth_relative_to_observer_km,'EARTH','earth',12,w,h);glass.append(E('circle',{cx:w/2,cy:h/2,r:5,class:'center'}));glass.append(E('line',{x1:w/2-26,y1:h/2,x2:w/2+26,y2:h/2,class:'center'}));glass.append(E('line',{x1:w/2,y1:h/2-26,x2:w/2,y2:h/2+26,class:'center'}));const range=Math.hypot(...s.moon_relative_to_observer_km),rv=s.moon_relative_velocity_km_s,los=s.moon_relative_to_observer_km,closure=-(los[0]*rv[0]+los[1]*rv[1]+los[2]*rv[2])/range;readout.innerHTML=`<b>MOON / ${s.state_source}</b><br>${s.epoch_utc}<br>BEARING ${mq.b>=0?'+':''}${mq.b.toFixed(2)}° • ELEV ${mq.e>=0?'+':''}${mq.e.toFixed(2)}°<br>RANGE ${range.toFixed(0)} km • CLOSURE ${closure.toFixed(3)} km/s<br>OBSERVER: FROZEN INERTIAL MIDPOINT @ T0`;timeLabel.textContent=`T+${Number(s.elapsed_hours).toFixed(2)}h`;document.getElementById('badge').innerHTML=`2026<br>${data.frame}<br>${data.source.mode}<br>${data.samples.length} DISPLAY STATES`}
slider.oninput=draw;play.onclick=()=>{if(timer){clearInterval(timer);timer=null;play.textContent='PLAY';return}play.textContent='PAUSE';timer=setInterval(()=>{let n=Number(slider.value)+1;if(n>Number(slider.max))n=0;slider.value=n;draw()},50)};window.addEventListener('resize',()=>requestAnimationFrame(draw));window.addEventListener('orientationchange',()=>requestAnimationFrame(draw));fetch('/earth-moon-qualification.json?epoch=2026-09-10T00:00:00Z&days=30',{cache:'no-store'}).then(r=>r.json().then(j=>{if(!r.ok)throw new Error(j.reason||'qualification unavailable');return j})).then(j=>{data=j;slider.max=j.samples.length-1;slider.step=1;draw()}).catch(err=>{readout.textContent='UNAVAILABLE: '+err.message});})();</script></body></html>
