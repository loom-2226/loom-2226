boundaries:
  main_is_authoritative_for:
    - upstream_awareness_of_research_projects
    - project_to_runtime_engineering_linkage
    - promotion_intake_and_upstream_disposition
    - shared_asset_provenance_and_consumer_linkage
  research_lab_remains_authoritative_for:
    - project_internal_research_artifacts
    - project_methods_and_experiments
    - project_evidence_and_reviews
    - current_research_working_files
  research_outputs_self_promote: false
  research_location_implies_canon: false
  research_location_implies_runtime_authority: false
  duplicate_live_research_trees_in_main: false

