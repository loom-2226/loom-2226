shared_assets:
  - id: WAYFARER_DETERMINISTIC_GEOMETRY
    authority_repository: loom-2226/loom-2226
    authority_chain:
      - canon/current/LOOM_2226_CANON_II_Engineering_Ships_Operations_v2.4.md
      - canon/current/LOOM_2226_CANON_II_Wayfarer_Schematic_Amendment_v2.4a.md
      - geometry/wayfarer_geometry_seed.sql
      - src/wayfarer_geometry.py
      - generated_geometry_json_derivative
    derivatives:
      - HUD / Three.js presentation geometry
      - Computational Shipyard / Blender geometry
      - semantic GLB interchange derivatives
    known_consumer_branch_families:
      - feature/hud-wayfarer-attitude-envelope-v0.1-2026-09-11
      - feature/hud-local-flight-contract-shell-v0.1-2026-09-09
      - workstream/wayfarer-3d
      - research/computational-shipyard-wayfarer-vertical-slice-2026-09-08
      - research/physical-design-synthesis-wayfarer-s1-2026-09-08
      - research/physical-design-synthesis-wayfarer-s2-2026-09-08
    verified_branch_heads_at_capture:
      hud_wayfarer_attitude: 8b1637e3e6ff7ebb718aa3dfb7b3310be3b6ac2f
      computational_shipyard_vertical_slice: dc129ebb5999641c85138c3f263ec78b7e3495c5
    active_e1_integration:
      pr: 182
      branch: engineering/e1-committed-component-geometry-envelope-2026-09-15
      head_at_registry_capture: 08898889ea6ebc322e39205446204cd46118dc2e
      purpose: consume existing deterministic geometry as conservative committed component envelope
    change_control:
      rule: changes_to_shared_geometry_must_record_affected_consumers_and_backpropagation_requirements
      required_trace:
        - changed_authority_or_input_file
        - reason_for_change
        - exact_commit_or_pr
        - affected_HUD_consumers
        - affected_Shipyard_or_GLB_consumers
        - affected_E1_or_other_engineering_consumers
        - whether_regeneration_is_required
        - whether_requalification_is_required
        - whether_research_fixtures_or_benchmarks_are_stale
      glb_is_authority: false
      generated_json_is_authority: false

cross_repo_change_protocol:
  when_main_changes_shared_asset:
    - record_change_in_main_PR
    - identify_all_registered_consumers
    - regenerate_derivatives_if_required
    - mark_research_lab_fixtures_or_findings_stale_if_input_semantics_changed
    - preserve_old_commit_as_provenance
  when_lab_research_proposes_runtime_change:
    - produce_governed_handoff_or_disposition
    - cite_exact_lab_commit_and_artifacts
    - open_separate_main_PR
    - qualify_under_main_runtime_or_engineering_process
    - record_promotion_or_rejection_in_this_registry_or_successor
  when_resuming_old_branch:
    - begin_from_registered_authority_chain
    - compare_branch_inputs_against_current_main
    - do_not_assume_old_generated_GLBS_or_JSON_are_current

known_open_records_at_capture:
  - repository: loom-2226/loom-2226
    pr: 182
    purpose: E1 committed Wayfarer component geometry envelope
  - repository: loom-2226/loom-research-lab
