version: '1.2'
status: STEP11_ENFORCEMENT_AUTHORIZED_PENDING_MAIN_PROTECTION
gate_name: loom-gate
owner_agent: WALTER
historical_fixture_matrix: governance/validation/STEP9_HISTORICAL_FIXTURE_MATRIX_2026-09-07.yml
historical_validation_report: governance/validation/STEP9_HISTORICAL_VALIDATION_REPORT_2026-09-07.md
main_protection_policy: governance/current/LOOM_MAIN_PROTECTION_POLICY.yml

purpose: >-
  Single always-running deterministic governance status. Step 9 classified which
  findings are safe hard-gate candidates and which remain advisory. Kevin's explicit
  Step-11 authorization activates deterministic enforcement; GitHub main-protection
  administration is still pending owner activation.

modes:
  current: ENFORCE
  allowed: [OBSERVE, ENFORCE]
  observe_behavior: report_candidate_blocks_and_watches_but_exit_success
  enforce_behavior: fail_on_candidate_blocks

finding_levels: [PASS, WATCH, CANDIDATE_BLOCK, BLOCK]

rules:
  LG001_CHANGE_CLASS:
    description: Governance-era substantive PR declares one recognizable primary LOOM change class.
    current_level: CANDIDATE_BLOCK
    step9_disposition: HARD_READY
    deterministic: true
    grandfathering: PRE_GOVERNANCE_HISTORY_NOT_RETROACTIVELY_NONCOMPLIANT

  LG002_FROZEN_PR19_SHA:
    description: Frozen PR #19 branch remains at registered preregistered SHA.
    current_level: CANDIDATE_BLOCK
    step9_disposition: HARD_READY
    deterministic: true
    exception_allowed: false

  LG003_FROZEN_PR16_SHA:
    description: PR #16 preregistered/on-hold branch remains at registered SHA until formally superseded.
    current_level: CANDIDATE_BLOCK
    step9_disposition: HARD_READY
    deterministic: true
    exception_allowed: false

  LG004_CANON_CLASS:
    description: Non-R100 current-canon content/authority mutation requires class:canon.
    current_level: CANDIDATE_BLOCK
    step9_disposition: HARD_READY
    deterministic: true
    classifier: NON_R100_CURRENT_CANON_CHANGE

  LG005_CANON_CCR_ID:
    description: Non-R100 current-canon content/authority mutation requires exact registered CCR-YYYY-NNNN identifier.
    current_level: CANDIDATE_BLOCK
    step9_disposition: HARD_READY
    deterministic: true

  LG006_CANON_CCR_APPROVAL:
    description: Cited CCR has durable record and APPROVED_FOR_IMPLEMENTATION before canon implementation.
    current_level: CANDIDATE_BLOCK
    step9_disposition: HARD_READY
    deterministic: true

  LG007_CONTROL_FILE_PARSE:
    description: Required governance/dependency/compatibility/agent/CCR machine files parse.
    current_level: CANDIDATE_BLOCK
    step9_disposition: HARD_READY
    deterministic: true

  LG008_RELEASE_COMPATIBILITY_COUPLING:
    description: Release-manifest change receives explicit compatibility disposition or compatibility-manifest update.
    current_level: WATCH
    step9_disposition: ADVISORY_REWORKED
    deterministic: true
    reason: FILE_COCHANGE_ONLY_RULE_PRODUCED_LEGITIMATE_FALSE_POSITIVE_RISK

  LG009_DOWNSTREAM_IMPACT_DECLARATION:
    description: Load-bearing changes receive downstream dependency/impact classification.
    current_level: WATCH
    step9_disposition: ADVISORY_PENDING_STRUCTURED_METADATA
    deterministic: partly
    reason: PRE_GOVERNANCE_FREE_TEXT_IS_SEMANTICALLY_GOOD_BUT_NOT_RELIABLY_MACHINE_CLASSIFIABLE

  LG010_MIXED_CANON_ENGINEERING:
    description: Canon plus engineering/geometry in one PR receives explicit sequencing review.
    current_level: WATCH
    step9_disposition: ADVISORY
    deterministic: true

  LG011_RESEARCH_CANON_MIX:
    description: Research plus current canon in one PR receives explicit promotion-separation rationale.
    current_level: WATCH
    step9_disposition: ADVISORY
    deterministic: true

  LG012_DATA_MIGRATION_RECOVERY:
    description: SQLite/schema/migration change receives migration/compatibility/recovery review.
    current_level: WATCH
    step9_disposition: ADVISORY_PENDING_PATH_MODEL
    deterministic: partly
    reason: SQLITE_PATH_ALONE_CANNOT_DISTINGUISH_BYTES_SCHEMA_METADATA_DERIVED_OR_LOCAL_STATE

  LG013_VENDOR_DEPENDENCY_ASSURANCE:
    description: Dependency-definition change receives vendor/dependency/license/lock-in assurance review.
    current_level: WATCH
    step9_disposition: ADVISORY
    deterministic: partly

  LG014_AGENT_REGISTRY_PARSE:
    description: Autonomous-agent registry parses and ACTIVE count matches ACTIVE entries.
    current_level: CANDIDATE_BLOCK
    step9_disposition: HARD_READY
    deterministic: true

  LG015_AGENT_CREATION_GATE:
    description: ACTIVE agent has approved durable creation review; active-count increase requires class:governance.
    current_level: CANDIDATE_BLOCK
    step9_disposition: HARD_READY_DETERMINISTIC_SUBSET
    deterministic: partly
    hard_subset:
      - registry_entry_present
      - active_count_consistent
      - creation_review_status_APPROVED
      - creation_review_file_present
      - active_count_increase_requires_class_governance
    advisory_subset:
      - distinct_objective_justification
      - independence_need
      - whether_existing_module_is_sufficient

  LG016_PERSONA_AUTHORITY_SEPARATION:
    description: Persona binding is never source of technical permissions or evidentiary weight.
    current_level: WATCH
    step9_disposition: ADVISORY
    deterministic: partly

  LG017_RELEASE_JSON_PARSE:
    description: Current release manifest parses as JSON when present.
    current_level: CANDIDATE_BLOCK
    step9_disposition: HARD_READY
    deterministic: true

  LG018_CANON_LIFECYCLE_AUTHORITY:
    description: Exact R100 current-canon lifecycle movement receives explicit governance/canon authority-lifecycle rationale.
    current_level: WATCH
    step9_disposition: ADVISORY_PENDING_STRUCTURED_BASELINE_MARKER
    deterministic: partly
    note: R100_BYTE_PRESERVING_MOVE_IS_NOT_CANON_CONTENT_MUTATION

