    - LG009
    - LG010
    - LG011
    - LG012
    - LG013
    - LG016
    - LG018

step11_activation:
  step9_historical_validation_complete: true
  governance_baseline_merged_to_main: true
  explicit_owner_enforcement_approval: true
  approval_source: USER_GO_STEP11_2026_09_07
  deterministic_enforcement_enabled_in_policy: true
  main_protection_admin_activation: PENDING_OWNER_ACTION
  required_check_not_yet_enforced_by_github: true

llm_policy:
  loom_gate_uses_llm_for_hard_result: false
  llm_may_add_separate_advisory_findings_later: true
  llm_advisory_may_change_deterministic_result: false

required_check:
  context_name: loom-gate
  target_branch: main
  required_after_owner_admin_activation: true
  up_to_date_branch_requirement: false
