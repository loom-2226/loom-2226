hard_gate_activation_requirements:
  - step9_historical_validation_complete
  - current_loom_gate_live_run_clean
  - governance_baseline_merged_to_main
  - explicit_owner_enforcement_approval
  - main_protection_step_reached

llm_policy:
  loom_gate_uses_llm_for_hard_result: false
  llm_may_add_separate_advisory_findings_later: true
  llm_advisory_may_change_deterministic_result: false

required_check_future:
  context_name: loom-gate
  make_required_on_main_only_after:
    - governance_baseline_merged
    - explicit_enforcement_approval
    - Step11_main_protection_activation
