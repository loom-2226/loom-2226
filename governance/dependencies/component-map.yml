impact_defaults:
  CANON_REGISTRY:
    downstream_default: REVIEW_REQUIRED
  CANON:
    downstream_default: REVIEW_REQUIRED
  ENGINEERING:
    downstream_default: REVIEW_REQUIRED
  ENGINEERING_DATA:
    downstream_default: REVALIDATION_REQUIRED
  RUNTIME:
    downstream_default: REVALIDATION_REQUIRED
  DATA:
    downstream_default: REVALIDATION_REQUIRED
  DATA_ASSET:
    downstream_default: REVALIDATION_REQUIRED
  DEPLOYMENT:
    downstream_default: REVALIDATION_REQUIRED
  RELEASE_MANIFEST:
