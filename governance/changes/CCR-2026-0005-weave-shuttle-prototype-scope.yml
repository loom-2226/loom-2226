  evidentiary_status: MIXED_EXPLAINED
  summary: >-
    kT design decision to adopt the Weave prototype (W2 gravity-cancelling
    cushion plus zero-expansion Weave shift translation, ~8 t Builder relational
    module) as the Wayfarer shuttle direction. Revision 2: the host hull is the
    'Tic Tac' capsule (12.8 m x 3.8 m, no wings or fans, floats on its own hull,
    torch and parachutes as field-off fallback), replacing the 13.02 m lifting body. Lane simulations (ideal-fluid transport, sensor
    ray tracing, water-bowl response) and closure engineering inform the design
    but do NOT demonstrate a physical conservation closure. Prototype operation
    is an in-universe experimental premise.
proposal:
  reason: >-
    Admit the Weave shuttle as a scoped, experimental, uncertified application
    of the existing METRIC regime without changing how certified Metric vessels,
    the Wayfarer Metric card, TORCH or LOOM work.
  claims_added:
    - '§3 scoped exception: an ~8 t Builder relational module is admitted as a prototype near-body installation, not a Metric plant variant.'
    - '§3/§3.2: Builder module active-material composition UNKNOWN. No assumed equivalence to human Mc-299m. Any human flight-grade Mc actually installed must be accounted against §3.1.'
    - '§5/§9 scoped exception: a separate prototype near-body operating card applies; no long-baseline capability and no 0.268c card are granted.'
    - '§6 scoped exception: status EXPERIMENTAL, UNCERTIFIED; near-body use is a test-campaign activity, not certified Metric operation.'
    - '§18A scoped exception: prototype sidesteps are test-article behaviour, not tactical doctrine; any tactical use requires a later separate CCR.'
    - '§7.1b prototype clause (option A): for the Weave prototype the exchange partner is UNKNOWN. Energy, linear momentum and angular momentum are conserved in full; §7.3 binds without exception. Prototype operation is an in-universe experimental premise, not a demonstrated physical conservation closure. No free momentum, no free-work cycles.'
  claims_modified: []
  claims_retired: []
  affected_governing_sources:
    - canon/current/LOOM_2226_CANON_II_Engineering_Ships_Operations_v2.5.md
  proposed_authority_relationship:
    type: SCOPED_GOVERNING_AMENDMENT
    parent_source: canon/current/LOOM_2226_CANON_II_Engineering_Ships_Operations_v2.5.md
    scope: >-
      Weave shuttle prototype only: scoped exceptions to §3, §5/§9, §6 and
      §18A, plus a prototype exchange-partner clause beside §7.1b. §7.1b's Sun
      declaration remains verbatim for certified Solar System Metric transit.
      §2, §7.3, §21 and all existing Wayfarer Metric operating rules are
      preserved unchanged.
  explicit_non_scope:
    - No closure law, exchange mechanism, coupling law or energy source is asserted.
    - No change to certified Metric, the Wayfarer Metric card, ENERGY-B (CCR-2026-0003), TORCH or LOOM.
    - No tactical doctrine, no FTL, no long-baseline Weave capability.
    - No reopening of kT-selected design choices (Tic Tac hull, ~8 t module, unknown-partner statement).
    - No Wayfarer docking collar: the revision-1 collar proposal is withdrawn. The Tic Tac fits the v2.5a bay at 12.8 m with F7-F11 unchanged.
    - Shuttle hull geometry, mass booking and the W3 field-off exception are engineering matters for the Wayfarer engineering change, not canon text.
    - Filing authorizes no canon implementation, geometry, GLB or canon_glb.json change.
