    parent_source: canon/current/LOOM_2226_CANON_I_World_History_Frontier_v2.4.md
    scope: Earth post-2100 demography, personhood census, labor and economic state through 2226
  explicit_non_scope:
    - No change to WPP authority through 2100.
    - No off-Earth demographic or economic model rerun.
    - No migration model or expanded economic country qualification.
