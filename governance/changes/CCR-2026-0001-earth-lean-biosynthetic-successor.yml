proposal:
  reason: >-
    Replace the endpoint-only Earth demographic bridge and the v4 post-2100
    economic trajectory with one causally coupled, qualified successor while
    preserving prior authorities as superseded provenance.
  claims_added:
    - WPP 2024 remains authoritative through 2100.
    - MED_CENTRAL x SYNTH_CENTRAL is the selected modeled Earth successor for 2101-2226.
    - Earth biological population at 2226 is 7163281708.265873.
    - Earth recognized synthetic-person population at 2226 is 9672505.78986048.
    - Earth total recognized-person population at 2226 is 7172954214.055734.
    - Biological humans, recognized synthetic persons and non-person machine-task capacity are distinct categories.
    - Existing off-Earth census values remain unchanged pending separate Solar modeling.
  claims_modified:
    - The current selected Earth demographic authority after 2100.
    - The current selected 80-economy Earth economic trajectory after 2100.
    - Exact Solar population totals that are arithmetic sums of the new Earth values and unchanged off-Earth residuals.
  claims_retired:
    - EARTH_2226_CANON_CONSTRAINED_COUNTRY_ALLOCATION as current selected 2226 Earth authority.
    - Earth v4 as current selected economic authority for 2101-2226.
    - The prior exact Earth and arithmetic Solar census totals where they conflict with the selected successor.
  affected_governing_sources:
