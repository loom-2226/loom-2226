name: spatial-sql-inventory
on:
  push:
    branches:
      - feature/earth-luna-spatial-infrastructure-v0.1-2026-09-12
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect tracked WORLD SQLite
        shell: python
        run: |
          import json, sqlite3, pathlib, re
          db = pathlib.Path('data/LOOM_2226.sqlite3')
          c = sqlite3.connect(db)
          c.row_factory = sqlite3.Row
          tables = [r['name'] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name")]
          rows = c.execute("SELECT entity_id,name,entity_class,parent_entity_id FROM entities ORDER BY name").fetchall()
          terms = re.compile(r'(station|spaceport|port|yard|depot|orbital|orbit|terminal|dock|habitat|luna|lunar|moon|launch|gateway|cloudport)', re.I)
          matches = [dict(r) for r in rows if terms.search(' '.join(str(r[k] or '') for k in r.keys()))]
          classes = {}
          for r in rows: classes[r['entity_class']] = classes.get(r['entity_class'],0)+1
          likely = {}
          for t in tables:
              cols=[r['name'] for r in c.execute(f'PRAGMA table_info("{t}")')]
              low={x.lower() for x in cols}
              if low & {'latitude_deg','longitude_deg','lat_deg','lon_deg','facility_class','facility_type','orbit_class','semi_major_axis_km','altitude_km','elevation_m'} or any(k in x.lower() for x in cols for k in ('facility','station','port','orbit','latitude','longitude')):
                  try:
                      sample=[dict(r) for r in c.execute(f'SELECT * FROM "{t}" LIMIT 100')]
                  except Exception as e:
                      sample=[{'error':str(e)}]
                  likely[t]={'columns':cols,'sample':sample}
          report={
              'database':'data/LOOM_2226.sqlite3',
              'tables':tables,
              'entity_columns':[r['name'] for r in c.execute('PRAGMA table_info(entities)')],
              'entity_class_counts':classes,
              'matched_entities':matches,
              'likely_infrastructure_tables':likely,
          }
          pathlib.Path('spatial_sql_inventory.json').write_text(json.dumps(report,indent=2,default=str)+'\n',encoding='utf-8')
          c.close()
      - uses: actions/upload-artifact@v4
        with:
          name: spatial-sql-inventory
          path: spatial_sql_inventory.json
