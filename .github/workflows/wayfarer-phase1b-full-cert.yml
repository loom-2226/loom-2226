name: Wayfarer Phase1b G1-G12 plus D9 full certification
on:
  push:
    branches: [main]
    paths:
      - governance/changes/CCR-2026-0004-wayfarer-phase1b-v25.yml
  pull_request:
    paths:
      - wayfarer/results/out/D9_BREP_CLASH_REPORT.json
      - .github/workflows/wayfarer-phase1b-full-cert.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  full-current-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-run complete G1-G12 and D9 on current branch, no gate bypass
        run: |
          python -u wayfarer/lab/certify.py 2>&1 | tee phase1b-full-cert.log
      - name: Truthful machine conclusion (CLI exit zero alone means nothing)
        shell: bash
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('wayfarer')
          rep=json.loads((root/'results/out/certification_report.json').read_text())
          d9=json.loads((root/'results/out/D9_BREP_CLASH_REPORT.json').read_text())
          sha=hashlib.sha256((root/'results/out/wayfarer_v05_geometry.json').read_bytes()).hexdigest()
          assert rep['geometry_sha256']==d9['geometry_sha256']==sha, 'report evidence must be from current source'
          assert sha=='88ce19fc8bc4c487b1ad96e2edb1bed17f36188a445070af238afdffada181c1', 'approved geometry changed'
          assert len(rep['summary'])==13 and 'D9' in rep['summary']
          print('GEOMETRY',sha,flush=True)
          print('CERTIFIED',rep['certified'],flush=True)
          for k,v in rep['summary'].items():print(k,v,flush=True)
          assert rep['certified'] is True, 'NO MERGE: full cert gates not all PASS'
          assert d9.get('pass') is True and d9.get('D8_primary_shape_unchanged') is True
          PY
      - name: Tag certified main as canon-v2.5 after CCR implementation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          c=Path("governance/changes/CCR-2026-0004-wayfarer-phase1b-v25.yml").read_text()
          assert "\nstatus: IMPLEMENTED\n" in c, "CCR must be implemented"
          assert "merged_commit: f592b9fd9a2c57029c57bc4f360fe59edf6df009" in c
          print("CCR_IMPLEMENTED_AND_MERGE_LINKED")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          if git show-ref --verify --quiet refs/tags/canon-v2.5; then
            test "$(git rev-list -n 1 refs/tags/canon-v2.5)" = "$GITHUB_SHA"
            echo "CANON_V25_TAG_ALREADY_AT_CERTIFIED_SHA=$GITHUB_SHA"
          else
            git tag -a canon-v2.5 -m "LOOM Canon v2.5: CCR-2026-0004 implemented, Wayfarer source certified" "$GITHUB_SHA"
            git push origin refs/tags/canon-v2.5
            echo "CANON_V25_TAG_CREATED_AT_CERTIFIED_SHA=$GITHUB_SHA"
          fi
      - name: Preserve every full-cert gate and primary-integrity failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayfarer-phase1b-full-cert-evidence
          path: |
            wayfarer/results/out/certification_report.json
            wayfarer/results/out/CERTIFICATION_REPORT_v0.5.md
            wayfarer/results/out/D9_BREP_CLASH_REPORT.json
            wayfarer/results/out/wayfarer_v05_card.json
            wayfarer/lab/command/l1_i4_results.json
            wayfarer/lab/habitat/hab_overlay_results.json
            wayfarer/render/out/manifest.json
            phase1b-full-cert.log
          if-no-files-found: warn
