name: LOOM Gate

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  loom-gate:
    name: loom-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: WALTER deterministic governance inspection
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -u

          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)"
          watches=0
          candidate_blocks=0

          watch() {
            watches=$((watches + 1))
            echo "::warning::WATCH $1"
            printf -- '- WATCH: %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          }

          candidate_block() {
            candidate_blocks=$((candidate_blocks + 1))
            echo "::warning::CANDIDATE_BLOCK $1"
            printf -- '- CANDIDATE_BLOCK: %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          }

          gate_mode="OBSERVE"
          if [[ -f governance/current/LOOM_GATE_POLICY.yml ]]; then
            parsed_mode="$(ruby -ryaml -e 'x=YAML.safe_load(File.read(ARGV[0]), aliases: true); puts x.dig("modes","current")' governance/current/LOOM_GATE_POLICY.yml 2>/dev/null || true)"
            [[ -n "$parsed_mode" ]] && gate_mode="$parsed_mode"
          fi

          {
            echo "## WALTER / loom-gate"
            echo
            echo "**Mode:** \`$gate_mode\`"
            echo "**Head:** \`$HEAD_REF\`"
            echo "**Base SHA:** \`$BASE_SHA\`"
            echo "**Head SHA:** \`$HEAD_SHA\`"
            echo
            if [[ "$gate_mode" == "OBSERVE" ]]; then
              echo "Candidate hard gates are reported but cannot fail the PR until historical validation and explicit enforcement approval."
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # LG001 — primary change class
          if [[ -z "${PR_BODY:-}" ]] || ! grep -Eq 'class:(research|canon|engineering|runtime|data|asset-media|governance)' <<<"$PR_BODY"; then
            watch "LG001: no recognizable LOOM primary change class found in the PR body. Grandfathered PRs may legitimately predate the template."
          fi

          # LG002 / LG003 — frozen/preregistered branch identities
          if [[ "$HEAD_REF" == "research/relational-foundations-deterministic-curvature" && "$HEAD_SHA" != "314efe50875630ba4be720b4097a2ca14075e620" ]]; then
            candidate_block "LG002: frozen PR #19 moved away from preregistered SHA 314efe50875630ba4be720b4097a2ca14075e620."
          fi
          if [[ "$HEAD_REF" == "research/relational-foundations-matter-induced-prereg" && "$HEAD_SHA" != "b60086d906f63211206502f23458be490902c2df" ]]; then
            candidate_block "LG003: PR #16 preregistered/on-hold branch moved away from recorded SHA b60086d906f63211206502f23458be490902c2df."
          fi

          # LG004 / LG005 / LG006 — canon airlock
          if grep -q '^canon/current/' <<<"$changed"; then
            if ! grep -q 'class:canon' <<<"${PR_BODY:-}"; then
              candidate_block "LG004: current canon changed without class:canon."
            fi

            ccr_ids="$(grep -Eo 'CCR-[0-9]{4}-[0-9]{4}' <<<"${PR_BODY:-}" | sort -u || true)"
            if [[ -z "$ccr_ids" ]]; then
              candidate_block "LG005: current canon changed without an exact CCR-YYYY-NNNN identifier."
            elif [[ ! -f governance/changes/CCR_REGISTRY.yml ]]; then
              candidate_block "LG005: current canon changed but CCR_REGISTRY.yml is unavailable."
            else
              while IFS= read -r ccr_id; do
                [[ -z "$ccr_id" ]] && continue
                entry="$(ruby -ryaml -e '
                  registry = YAML.safe_load(File.read(ARGV[0]), aliases: true)
                  id = ARGV[1]
                  record = Array(registry["records"]).find { |x| x["id"] == id }
                  exit 2 unless record
                  puts [record["path"], record["status"]].join("|")
                ' governance/changes/CCR_REGISTRY.yml "$ccr_id" 2>/dev/null || true)"

                if [[ -z "$entry" ]]; then
                  candidate_block "LG005: canon PR cites unregistered $ccr_id."
                  continue
                fi

                record_path="${entry%%|*}"
                record_status="${entry#*|}"
                [[ -f "$record_path" ]] || candidate_block "LG006: registered $ccr_id durable record is missing: $record_path."
                [[ "$record_status" == "APPROVED_FOR_IMPLEMENTATION" ]] || candidate_block "LG006: $ccr_id status is $record_status; canon implementation requires APPROVED_FOR_IMPLEMENTATION."
              done <<< "$ccr_ids"
            fi
          fi

          # LG010 / LG011 — mixed authority review
          if grep -Eq '^(geometry/|engineering/)' <<<"$changed" && grep -q '^canon/current/' <<<"$changed"; then
            watch "LG010: canon and engineering/geometry changed in one PR; explicit sequencing review is required."
          fi
          if grep -q '^research/' <<<"$changed" && grep -q '^canon/current/' <<<"$changed"; then
            watch "LG011: research and current canon changed together; verify explicit promotion separation."
          fi

          # LG012 — data migration/recovery declaration
          if grep -Eq '^(data/.*\.sqlite3|data/.*migration|data/.*schema)' <<<"$changed"; then
            if ! grep -Eqi 'schema|migration|compatib|rollback|recovery' <<<"${PR_BODY:-}"; then
              watch "LG012: SQLite/schema/migration path changed without migration/compatibility/recovery language."
            fi
          fi

          # LG013 — vendor/dependency assurance
          if grep -Eq '(^|/)(requirements[^/]*\.txt|pyproject\.toml|poetry\.lock|Pipfile|package-lock\.json|package\.json)$' <<<"$changed"; then
            if ! grep -Eqi 'vendor|dependency|license|lock-in|provider|package' <<<"${PR_BODY:-}"; then
              watch "LG013: dependency definition changed without vendor/dependency assurance language."
            fi
          fi

          # LG009 — downstream impact declaration on load-bearing changes
          if grep -Eq '^(canon/current/|engineering/current/|src/|data/|geometry/|deploy/|manifests/release_manifest\.json)' <<<"$changed"; then
            if ! grep -Eqi 'UNCHANGED_COMPATIBLE|REVIEW_REQUIRED|REVALIDATION_REQUIRED|MIGRATION_REQUIRED|BLOCKED_PENDING_UPSTREAM|SUPERSEDED|downstream|dependency impact|dependencies' <<<"${PR_BODY:-}"; then
              watch "LG009: load-bearing component changed without downstream dependency/impact classification."
            fi
          fi

          # LG008 — release / compatibility coupling
          if grep -q '^manifests/release_manifest\.json$' <<<"$changed" && ! grep -q '^manifests/current/LOOM_COMPATIBILITY\.yml$' <<<"$changed"; then
            watch "LG008: release manifest changed without matching LOOM compatibility-manifest review/update."
          fi

          # LG007 / LG017 — machine-control parse integrity
          yaml_controls=(
            governance/current/LOOM_GATE_POLICY.yml
            governance/current/LOOM_AUTHORITY_MODEL.yml
            governance/current/LOOM_CURRENT_WORKSTATE.yml
            governance/current/LOOM_SESSION_BOOTSTRAP.yml
            governance/dependencies/component-map.yml
            manifests/current/LOOM_COMPATIBILITY.yml
            governance/changes/CCR_REGISTRY.yml
            governance/changes/CCR_SCHEMA_v1.0.yml
            governance/changes/CCR_TEMPLATE_v1.0.yml
            governance/agents/AGENT_REGISTRY.yml
          )
          for control in "${yaml_controls[@]}"; do
            if [[ ! -f "$control" ]]; then
              candidate_block "LG007: required control file missing: $control."
            elif ! ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV[0]), aliases: true)' "$control"; then
              candidate_block "LG007: required control file is invalid YAML: $control."
            fi
          done

          if [[ -f manifests/release_manifest.json ]] && ! python -c 'import json; json.load(open("manifests/release_manifest.json", encoding="utf-8"))'; then
            candidate_block "LG017: current release manifest is invalid JSON."
          fi

          # CCR durable-record consistency
          shopt -s nullglob
          for ccr_file in governance/changes/CCR-[0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]-*.yml; do
            ccr_id="$(basename "$ccr_file" | grep -Eo '^CCR-[0-9]{4}-[0-9]{4}' || true)"
            yaml_id="$(ruby -ryaml -e 'x=YAML.safe_load(File.read(ARGV[0]), aliases: true); puts x["id"]' "$ccr_file" 2>/dev/null || true)"
            [[ -n "$ccr_id" && "$yaml_id" == "$ccr_id" ]] || candidate_block "LG007: CCR filename/record ID mismatch: $ccr_file declares ${yaml_id:-<missing>}."
            if [[ -f governance/changes/CCR_REGISTRY.yml ]] && ! ruby -ryaml -e '
              registry=YAML.safe_load(File.read(ARGV[0]), aliases: true)
              id=ARGV[1]
              exit(Array(registry["records"]).any? { |x| x["id"] == id } ? 0 : 1)
            ' governance/changes/CCR_REGISTRY.yml "$ccr_id"; then
              candidate_block "LG007: CCR record exists but is not indexed: $ccr_id."
            fi
          done
          shopt -u nullglob

          # LG014 / LG015 / LG016 — autonomous-agent integrity
          if [[ -f governance/agents/AGENT_REGISTRY.yml ]]; then
            registry_check="$(ruby -ryaml -e '
              x=YAML.safe_load(File.read(ARGV[0]), aliases: true)
              declared=x.dig("count","active_autonomous_agents").to_i
              agents=x["agents"] || {}
              active=agents.count { |_k,v| v["status"].to_s.start_with?("ACTIVE") }
              bad_persona=agents.any? do |_k,v|
                v.dig("persona_binding","bound") == true && v.dig("persona_binding","technical_permissions_derived_from_persona") != false
              end
              puts [declared,active,bad_persona ? 1 : 0].join("|")
            ' governance/agents/AGENT_REGISTRY.yml 2>/dev/null || true)"
            if [[ -z "$registry_check" ]]; then
              candidate_block "LG014: autonomous-agent registry could not be evaluated."
            else
              declared_agents="${registry_check%%|*}"
              rest="${registry_check#*|}"
              active_agents="${rest%%|*}"
              bad_persona="${rest##*|}"
              [[ "$declared_agents" == "$active_agents" ]] || candidate_block "LG014: declared active-agent count ($declared_agents) does not match ACTIVE registry entries ($active_agents)."
              [[ "$bad_persona" == "0" ]] || watch "LG016: a persona-bound agent appears to derive technical permissions from persona."
            fi
          fi

          if grep -q '^governance/agents/AGENT_REGISTRY.yml$' <<<"$changed"; then
            base_active="$(git show "$BASE_SHA:governance/agents/AGENT_REGISTRY.yml" 2>/dev/null | ruby -ryaml -e 'x=YAML.safe_load(STDIN.read, aliases: true); puts((x.dig("count","active_autonomous_agents") || 0).to_i)' 2>/dev/null || echo 0)"
            head_active="$(ruby -ryaml -e 'x=YAML.safe_load(File.read(ARGV[0]), aliases: true); puts((x.dig("count","active_autonomous_agents") || 0).to_i)' governance/agents/AGENT_REGISTRY.yml 2>/dev/null || echo 0)"
            if [[ "$head_active" =~ ^[0-9]+$ && "$base_active" =~ ^[0-9]+$ && "$head_active" -gt "$base_active" ]]; then
              if ! grep -Eqi 'agent creation gate|agent creation review|new autonomous agent' <<<"${PR_BODY:-}"; then
                watch "LG015: active autonomous-agent count increased without explicit Agent Creation Gate review language."
              fi
              if ! grep -q 'class:governance' <<<"${PR_BODY:-}"; then
                candidate_block "LG015: activating a new autonomous agent requires class:governance."
              fi
            fi
          fi

          {
            echo
            echo "### Result"
            echo
            echo "WATCH findings: **$watches**"
            echo "Candidate hard-gate findings: **$candidate_blocks**"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$gate_mode" == "ENFORCE" && "$candidate_blocks" -gt 0 ]]; then
            echo "**Result: BLOCK**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [[ "$candidate_blocks" -gt 0 ]]; then
            echo "**Result: CANDIDATE_BLOCK (observe mode — not enforced)**" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$watches" -gt 0 ]]; then
            echo "**Result: WATCH**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Result: PASS**" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "Walter completes the circuit and lies down somewhere inconvenient." >> "$GITHUB_STEP_SUMMARY"
          fi

          exit 0
