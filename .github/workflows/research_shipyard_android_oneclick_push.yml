name: LOOM Research Shipyard Android One-Click Push Validation

on:
  push:
    branches:
      - research/computational-shipyard-android-oneclick-v0.1-2026-09-08

jobs:
  validate-final-head:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile production Python
        run: python -m compileall -q src deploy
      - name: Run full unit regression
        run: python -m unittest discover -s tests -v
      - name: Verify Shipyard overlay manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.')
          m=json.loads((root/'manifests/shipyard_overlay_manifest.json').read_text())
          assert m['source_ref'] == 'research/computational-shipyard-android-oneclick-v0.1-2026-09-08'
          for row in m['artifacts']:
              data=(root/row['path']).read_bytes()
              actual=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert actual == row['git_blob_sha1'], (row['path'], actual, row['git_blob_sha1'])
          canonical=json.loads((root/'manifests/release_manifest.json').read_text())
          assert canonical['source_ref'] == 'integration/runtime-devops-convergence-2026-09-06'
          print('SHIPYARD_OVERLAY_VALID', len(m['artifacts']))
          PY
