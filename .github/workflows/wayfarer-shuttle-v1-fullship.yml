name: Wayfarer shuttle v1 real solid six-state integration
on:
  pull_request:
    paths:
      - wayfarer/lab/shuttle/shuttle_v1_fullship_integrate_20261110.py
      - wayfarer/lab/shuttle/shuttle_v1_full_docked_G8.py
      - wayfarer/config/courier_option_c_ledger_20261110.json
      - .github/workflows/wayfarer-shuttle-v1-fullship.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wayfarer-shuttle-v1-fullship-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  integrate:
    if: github.event_name == 'pull_request' && github.head_ref != 'engineering/wayfarer-exterior-detail-f3-20261110' && github.head_ref != 'engineering/wayfarer-hotfin-folded-stack-v255-20261110' && github.head_ref != 'engineering/wayfarer-v256-rcs-spine-laser-20261110' && github.head_ref != 'engineering/wayfarer-hull-etch-finish-review-20261111' && github.head_ref != 'engineering/wayfarer-v258-graphite-hotstate-coils-20261111' && github.head_ref != 'engineering/wayfarer-v259-finish-coverage-clean-coils-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin certified source and OCC version
        run: |
          set -euo pipefail
          python -m pip install build123d==0.13.0
          echo '88ce19fc8bc4c487b1ad96e2edb1bed17f36188a445070af238afdffada181c1  wayfarer/results/out/wayfarer_v05_geometry.json' | sha256sum -c -
          cp wayfarer/lab/packing_phase1b/frozen_research_3p8_forward.step.gz \
             wayfarer/lab/packing_phase1b/current_g3_3p8_forward.step.gz
          python - <<'PY'
          import json
          from pathlib import Path
          lab=Path('wayfarer/lab/packing_phase1b')
          frozen=json.loads((lab/'frozen_research_3p8_forward.json').read_text())
          released=json.loads(Path('wayfarer/render/out/wayfarer_parts_v253_88ce19fc_report.json').read_text())
          assert frozen['candidate_pass'] and released['drawing_revision']=='canon-v2.5.3'
          assert released['single_focused_shelter_G6']['candidate_changed_BRep_g_cm2']>=53.29035
          frozen['G6']=released['single_focused_shelter_G6']
          (lab/'current_g3_rebuild_report.json').write_text(json.dumps(frozen)+'\n')
          print('IMMUTABLE_V253_CERTIFIED_STEP_REUSED')
          PY
      - name: Actual OCC G8 on nozzle ring and every DOCKED source viewer part
        run: |
          set -euo pipefail
          python -u wayfarer/lab/shuttle/shuttle_v1_docked_G8_gate.py
          python -u wayfarer/lab/shuttle/shuttle_v1_full_docked_G8.py
      - name: Integrate six poses and check D9, containment, extras and hierarchy
        run: |
          set -euo pipefail
          python -u wayfarer/lab/shuttle/shuttle_v1_fullship_integrate_20261110.py | tee shuttle-six-state.log
      - name: Verify all six replacement GLBs and ledger invariants before retirement
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,struct
          from pathlib import Path
          root=Path('wayfarer/render/out')
          r=json.loads((root/'wayfarer_shuttle_hold_fullship_88ce19fc_report.json').read_text())
          l=json.loads(Path('wayfarer/config/courier_option_c_ledger_20261110.json').read_text())
          assert r['status']=='FULL_SHUTTLE_HOLD_3X2_D9_CONTAINMENT_EXTRAS_HIERARCHY_PASS'
          assert r['all_six_state_D9_and_containment']=='PASS'
          assert r['shuttle_true_solids_count']==41
          assert r['source_dry_t']==868.1922552640087 and r['original_source_shuttle_t']==30.732248081255836
          assert r['ECON_dv_km_s']==707.845 and r['dry_mass_change_t']==0
          assert r['no_extra_reserve_geometry'] and r['withdrawn_bay_483_not_drawn']
          assert r['courier_retained_t']==5 and abs(r['courier_returned_to_reserve_t']-14.450370894400045)<1e-8
          assert abs(sum(l['retained_hardware_split_t'].values())-5)<1e-9
          assert r['spare_panes_unchanged'] and r['no_hull_cuts']
          assert set(r['six_states'])=={'stowed','metric_hard','torch'}
          for mode,group in r['six_states'].items():
            assert set(group)=={'stowed','closed'}
            for pose,record in group.items():
              assert record['category_d_count']==0 and record['boolean_errors']==0
              assert record['pressure_containment_pass']
              p=Path('wayfarer')/record['glb'];raw=p.read_bytes()
              assert len(raw)>10000 and hashlib.sha256(raw).hexdigest()==record['gltf_extras']['raw_glb_sha256']
              assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,8)[0]==len(raw)
              n,k=struct.unpack_from('<II',raw,12);assert k==0x4e4f534a
              nodes=json.loads(raw[20:20+n])['nodes']
              meshes=[x for x in nodes if 'mesh' in x]
              assert all('extras' in x for x in nodes)
              assert len(meshes)==record['part_count']
              assert sum(x['name'].startswith('dry:shuttle_v1/') for x in meshes)==41
              assert sum(x['name'].startswith('dry:crown_spare_') for x in meshes)==7
              assert not any(x['name'].startswith(('dry:bay_shell_', 'dry:bay_door_', 'dry:courier_systems')) for x in meshes)
              assert all(x['extras']['node_mass_rebooking_t']==0 for x in meshes)
              for mesh in meshes:
                e=mesh['extras']
                for field in ('zone','deck','material','print_group','mass'):
                  assert field in e and e[field] is not None,(mesh['name'],field)
                assert isinstance(e['mass'],(int,float)) and e['mass']>=0
                assert e['mass_basis']=='source_booking_reference_nonadditive'
                assert e['print_group']==e['semantic_system']+'/'+e['semantic_subsystem']
              assert record['semantic_hierarchy']['hierarchy_valid']
              print('VERIFIED_SIX_STATE',mode,pose,record['part_count'])
          print('ALL_SIX_SHUTTLE_D9_CONTAINMENT_LEDGER_HIERARCHY_PASS')
          PY
      - name: Remove withdrawn #483 and full_radiator_states only after all six PASS, commit and push
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch \
            wayfarer/render/out/wayfarer_radiators_step1_88ce19fc_* \
            wayfarer/render/out/wayfarer_I4_in_out_88ce19fc.glb
          git rm -f --ignore-unmatch \
            wayfarer/render/out/wayfarer_bay_fullship_88ce19fc_*.glb \
            wayfarer/render/out/wayfarer_bay_fullship_88ce19fc_report.json \
            wayfarer/render/out/wayfarer_bay_fullship_88ce19fc_bay_components.step \
            wayfarer/render/out/wayfarer_drone_bay_fit_20261110.json \
            wayfarer/render/out/wayfarer_full_radiator_states_88ce19fc_*.glb \
            wayfarer/render/out/wayfarer_full_radiator_states_88ce19fc_report.json
          git rm -f --ignore-unmatch \
            wayfarer/lab/bay_fit_v255.py wayfarer/lab/bay_integrate_v255.py \
            .github/workflows/wayfarer-bay-fit.yml \
            .github/workflows/wayfarer-bay-integrate.yml \
            .github/workflows/wayfarer-bay-verify.yml
          git add -- wayfarer/render/out/wayfarer_shuttle_hold_fullship_88ce19fc_*.glb \
                     wayfarer/render/out/wayfarer_shuttle_hold_fullship_88ce19fc_report.json
          test "$(git ls-files --cached 'wayfarer/render/out/wayfarer_shuttle_hold_fullship_88ce19fc_*.glb' | wc -l)" -eq 6
          test "$(git ls-files --cached 'wayfarer/render/out/wayfarer_bay_fullship_88ce19fc_*' | wc -l)" -eq 0
          test "$(git ls-files --cached 'wayfarer/render/out/wayfarer_full_radiator_states_88ce19fc_*' | wc -l)" -eq 0
          test "$(git ls-files --cached 'wayfarer/render/out/wayfarer_radiators_step1_88ce19fc_*' | wc -l)" -eq 0
          test "$(git ls-files --cached 'wayfarer/render/out/wayfarer_I4_in_out_88ce19fc.glb' | wc -l)" -eq 0
          git commit -m 'class:engineering: six verified docked-shuttle GLBs with extras/hierarchy, retire superseded exports'
          git restore --worktree -- .
          git fetch origin "${{ github.head_ref }}"
          git rebase "origin/${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"
