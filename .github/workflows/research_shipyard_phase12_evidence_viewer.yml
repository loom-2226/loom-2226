name: LOOM Research Shipyard Phase 12 Evidence Viewer

on:
  pull_request:
    branches:
      - research/computational-shipyard-phase11-remass-feed-physics-bounds-v0.1-2026-09-09
    paths:
      - 'src/shipyard_evidence_viewer.py'
      - 'manifests/shipyard_overlay_manifest.json'
      - 'tests/test_wayfarer_phase12_evidence_viewer.py'
      - '.github/workflows/research_shipyard_phase12_evidence_viewer.yml'

jobs:
  validate-phase12:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile viewer
        run: python -m py_compile src/shipyard_evidence_viewer.py
      - name: Run Phase-12 focused tests
        run: python tests/test_wayfarer_phase12_evidence_viewer.py
      - name: Verify Shipyard overlay manifest digests
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          manifest = json.loads((root/'manifests/shipyard_overlay_manifest.json').read_text())
          assert manifest['source_ref'] == 'research/computational-shipyard-phase12-evidence-viewer-v0.1-2026-09-09'
          for row in manifest['artifacts']:
              data = (root/row['path']).read_bytes()
              actual = hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert actual == row['git_blob_sha1'], (row['path'], actual, row['git_blob_sha1'])
          print('OVERLAY_ARTIFACTS', len(manifest['artifacts']))
          PY
