name: LOOM Phase 5 GIS Flight Planning

on:
  push:
    branches:
      - feature/gis-navigator-convergence
    paths:
      - 'src/loom/gis/**'
      - 'src/loom/navigation/**'
      - 'src/loom_gis.py'
      - 'tests/test_gis_phase5_flight_planning.py'
      - 'tools/phase5_gis_flight_planning_qualify.py'
      - 'tools/phase2_gate_a_qualify.py'
      - 'docs/architecture/LOOM_2226_GIS_Phase5_Flight_Planning_v1.0.md'
      - '.github/workflows/phase5-gis-flight-planning.yml'
  workflow_dispatch:

jobs:
  frozen-flight-planning:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Navigator provider dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Compile Phase 5 Python
        run: python -m py_compile src/loom_gis.py src/loom/gis/*.py src/loom/navigation/*.py
      - name: Syntax-check Phase 5 browser planner
        run: node --check src/loom/gis/flight_planning.js
      - name: Run Phase 5 unit tests
        run: python -m unittest tests.test_gis_phase5_flight_planning -v
      - name: Download frozen Pixel pre-clean runtime archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.1.0-runtime-baseline --pattern 'LOOM_2226_Pixel_PreClean_Runtime_Archive_2026-09-03.zip' --dir frozen
      - name: Extract frozen runtime
        run: |
          mkdir -p frozen/runtime
          unzip -q frozen/LOOM_2226_Pixel_PreClean_Runtime_Archive_2026-09-03.zip -d frozen/runtime
      - name: Qualify real GIS planning against frozen Navigator
        env:
          LOOM_HOME: ${{ github.workspace }}/frozen/runtime/LOOM_TEST
        run: python tools/phase5_gis_flight_planning_qualify.py frozen/runtime
      - name: Prepare coherent HTTP smoke runtime
        run: |
          cp -a frozen/runtime/LOOM_TEST frozen/phase5_http_runtime
          python - <<'PY'
          from pathlib import Path
          import json, sys
          sys.path.insert(0, 'tools')
          from phase2_gate_a_qualify import history_records, newest_completed_flight
          root=Path('frozen/phase5_http_runtime')
          rows=history_records(root/'LOOM_CAMPAIGN_HISTORY.jsonl.gz')
          commit,_=newest_completed_flight(rows)
          state=dict(commit['details']['replay']['departure_state_snapshot'])
          (root/'LOOM_STATE_V1.json').write_text(json.dumps(state,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('HTTP SMOKE STATE',state.get('state_id'),state.get('epoch_utc'),state.get('location_token'))
          assert state.get('location_token')=='CERES'
          PY
      - name: Select locked frozen CIVSTATE
        run: |
          CIVSTATE="$(python - <<'PY'
          from pathlib import Path
          import hashlib, sys
          expected='9ef530bdc1b8d867fe217a8c6d3a05e3926b0b09b0d66a91ce090b3e52fae560'
          root=Path('frozen/phase5_http_runtime')
          for p in root.rglob('LOOM_2226_CIVSTATE.sqlite3'):
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              print(f'CANDIDATE {got} {p}', file=sys.stderr)
              if got==expected:
                  print(p)
                  break
          PY
          )"
          test -n "$CIVSTATE"
          echo "CIVSTATE=$CIVSTATE" >> "$GITHUB_ENV"
      - name: Hash campaign state before HTTP smoke
        run: |
          STATE=frozen/phase5_http_runtime/LOOM_STATE_V1.json
          test -f "$STATE"
          sha256sum "$STATE" | awk '{print $1}' > phase5_state_before.sha
          cat phase5_state_before.sha
      - name: Start converged GIS with Phase 5 planning
        env:
          LOOM_HOME: ${{ github.workspace }}/frozen/phase5_http_runtime
        run: |
          python src/loom_gis.py \
            --nav-runtime-root frozen/phase5_http_runtime \
            --nav-planning-offline \
            --demo \
            --civ-db "$CIVSTATE" \
            --no-browser \
            --host 127.0.0.1 \
            --port 8767 > phase5_server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          python - <<'PY'
          import time, urllib.request
          url='http://127.0.0.1:8767/healthz'
          last=None
          for _ in range(120):
              try:
                  with urllib.request.urlopen(url, timeout=1) as r:
                      if r.status == 200:
                          print('PHASE5 GIS SERVER READY')
                          raise SystemExit(0)
              except Exception as exc:
                  last=exc; time.sleep(.25)
          raise SystemExit(f'GIS server did not become ready: {last}')
          PY
      - name: Exercise live planning HTTP workflow
        run: |
          python - <<'PY'
          import json, urllib.request
          base='http://127.0.0.1:8767'
          def get(path):
              with urllib.request.urlopen(base+path, timeout=10) as r: return json.load(r)
          def post(path, body):
              data=json.dumps(body).encode()
              req=urllib.request.Request(base+path,data=data,headers={'Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req, timeout=60) as r: return json.load(r)
          state=get('/flight-planning.json')
          assert state['contract']=='LOOM_GIS_FLIGHT_PLANNING_V1', state
          assert state['origin']=='CERES', state
          destination='MARS'
          discovered=post('/flight-planning/discover',{'destination':destination,'priority':'BALANCED'})
          assert discovered['candidates'], discovered
          selectable=[c for c in discovered['candidates'] if c['summary'].get('selectable')]
          assert selectable, discovered
          rid=selectable[0]['route_id']
          preview=post('/flight-planning/preview',{'route_id':rid})
          assert preview['preview_route_id']==rid
          nav=get('/navigation-overlay.json')
          assert nav['contract']=='LOOM_GIS_NAVIGATION_OVERLAY_V1'
          assert nav['active_route']['origin']=='CERES' and nav['active_route']['destination']=='MARS'
          committed=post('/flight-planning/commit',{'route_id':rid})
          assert committed['committed_route_id']==rid
          cancelled=post('/flight-planning/cancel',{})
          assert cancelled['preview_route_id'] is None and cancelled['committed_route_id'] is None
          nav2=get('/navigation-overlay.json')
          assert nav2['active_route'] is None, nav2
          with urllib.request.urlopen(base+'/app.js', timeout=10) as r: js=r.read().decode()
          assert 'LOOM_PHASE5_FLIGHT_PLANNING' in js and '/flight-planning/discover' in js
          print('LIVE PHASE5 HTTP DISCOVER PASS CERES -> MARS',len(discovered['candidates']))
          print('LIVE PHASE5 HTTP PREVIEW PASS',rid)
          print('LIVE PHASE5 HTTP COMMIT/CANCEL PASS')
          print('LIVE PHASE5 APP.JS PASS')
          PY
      - name: Verify campaign state unchanged
        run: |
          STATE=frozen/phase5_http_runtime/LOOM_STATE_V1.json
          sha256sum "$STATE" | awk '{print $1}' > phase5_state_after.sha
          diff -u phase5_state_before.sha phase5_state_after.sha
          echo "LIVE PHASE5 CAMPAIGN MUTATION NONE"
      - name: Stop converged GIS server
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then kill "$SERVER_PID" 2>/dev/null || true; fi
          cat phase5_server.log 2>/dev/null || true
