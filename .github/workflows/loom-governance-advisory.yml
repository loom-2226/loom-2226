name: LOOM Governance Advisory

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  walter-advisory:
    name: "WALTER / #LOOMSAFE advisory"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Inspect authority, freeze and scope signals
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -u

          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)"
          warnings=0

          warn() {
            warnings=$((warnings + 1))
            echo "::warning::$1"
            printf -- '- WATCH: %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          }

          {
            echo "## WALTER / #LOOMSAFE advisory"
            echo
            echo "This check is **advisory only** during governance adoption. It never fails the PR."
            echo
            echo "**Head:** \`$HEAD_REF\`"
            echo "**Base SHA:** \`$BASE_SHA\`"
            echo "**Head SHA:** \`$HEAD_SHA\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -z "${PR_BODY:-}" ]] || ! grep -Eq 'class:(research|canon|engineering|runtime|data|asset-media|governance)' <<<"$PR_BODY"; then
            warn "No recognizable LOOM primary change class found in the PR body. Existing grandfathered PRs may legitimately predate the template."
          fi

          if grep -q '^canon/current/' <<<"$changed"; then
            if ! grep -q 'class:canon' <<<"${PR_BODY:-}"; then
              warn "Current canon changed without a declared class:canon signal. Canon promotion requires explicit authority/change control."
            fi
            if ! grep -Eqi 'CCR|Canon Change Request' <<<"${PR_BODY:-}"; then
              warn "Current canon changed but no CCR reference was detected in the PR body."
            fi
          fi

          if [[ "$HEAD_REF" == "research/relational-foundations-deterministic-curvature" && "$HEAD_SHA" != "314efe50875630ba4be720b4097a2ca14075e620" ]]; then
            warn "Frozen PR #19 branch moved away from its preregistered SHA 314efe50875630ba4be720b4097a2ca14075e620."
          fi

          if [[ "$HEAD_REF" == "research/relational-foundations-matter-induced-prereg" && "$HEAD_SHA" != "b60086d906f63211206502f23458be490902c2df" ]]; then
            warn "PR #16 preregistered/on-hold branch moved away from its recorded SHA b60086d906f63211206502f23458be490902c2df."
          fi

          if grep -Eq '^(deploy/|manifests/release_manifest\.json|manifests/current/)' <<<"$changed"; then
            if ! grep -Eqi 'rollback|recovery|compatib|release' <<<"${PR_BODY:-}"; then
              warn "Deployment/release material changed without an obvious recovery/compatibility statement in the PR body."
            fi
          fi

          if grep -Eq '^(data/.*\.sqlite3|data/.*migration|data/.*schema)' <<<"$changed"; then
            if ! grep -Eqi 'schema|migration|compatib|rollback|recovery' <<<"${PR_BODY:-}"; then
              warn "SQLite/data/schema-related paths changed without an obvious migration/compatibility/recovery statement."
            fi
          fi

          if grep -Eq '^(geometry/|engineering/)' <<<"$changed" && grep -q '^canon/current/' <<<"$changed"; then
            warn "Canon and engineering/geometry changed in the same PR. Mixed-authority promotion needs explicit sequencing and dependency review."
          fi

          if grep -Eq '(^|/)(requirements[^/]*\.txt|pyproject\.toml|poetry\.lock|Pipfile|package-lock\.json|package\.json)$' <<<"$changed"; then
            if ! grep -Eqi 'vendor|dependency|license|lock-in|provider|package' <<<"${PR_BODY:-}"; then
              warn "Dependency definition changed without an obvious vendor/dependency assurance note."
            fi
          fi

          if grep -Eq '^(research/)' <<<"$changed" && grep -q '^canon/current/' <<<"$changed"; then
            warn "Research and current canon changed together. Research findings may propose canon changes but may not silently promote themselves."
          fi

          {
            echo
            if [[ "$warnings" -eq 0 ]]; then
              echo "**Result: PASS (advisory)**"
              echo
              echo "Walter loses interest and resumes ordinary supervision."
            else
              echo "**Result: WATCH — $warnings advisory finding(s)**"
              echo
              echo "No merge block is applied at this stage. Review the findings against current governance."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0
