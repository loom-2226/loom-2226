name: Wayfarer F3 exterior detail six-state BRep/GLB
on:
  push:
    branches: [main]
    paths:
      - wayfarer/lab/pbr_finish_v257.py
      - wayfarer/lab/nozzle_band_faces_v259.py
  pull_request:
    paths:
      - wayfarer/lab/exterior_detail_f3_20261110.py
      - wayfarer/lab/hull_etch_finish_20261111.py
      - wayfarer/lab/pbr_finish_v257.py
      - wayfarer/lab/nozzle_band_faces_v258.py
      - wayfarer/lab/nozzle_band_faces_v259.py
      - wayfarer/config/kt_decisions.json
      - wayfarer/lab/shuttle/shuttle_v1_fullship_integrate_20261110.py
      - wayfarer/lab/shuttle/shuttle_v1_full_docked_G8.py
      - wayfarer/config/courier_option_c_ledger_20261110.json
      - .github/workflows/wayfarer-exterior-detail-f3.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wayfarer-exterior-detail-f3-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  integrate:
    if: github.event_name == 'pull_request' && github.head_ref != 'engineering/wayfarer-hotfin-folded-stack-v255-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin certified source and OCC version
        run: |
          set -euo pipefail
          python -m pip install build123d==0.13.0 matplotlib==3.10.7
          python -m py_compile wayfarer/lab/exterior_detail_f3_20261110.py wayfarer/lab/hull_etch_finish_20261111.py wayfarer/lab/pbr_finish_v257.py wayfarer/lab/nozzle_band_faces_v258.py wayfarer/lab/nozzle_band_faces_v259.py wayfarer/lab/shuttle/shuttle_v1_full_docked_G8.py
          echo '88ce19fc8bc4c487b1ad96e2edb1bed17f36188a445070af238afdffada181c1  wayfarer/results/out/wayfarer_v05_geometry.json' | sha256sum -c -
          cp wayfarer/lab/packing_phase1b/frozen_research_3p8_forward.step.gz \
             wayfarer/lab/packing_phase1b/current_g3_3p8_forward.step.gz
          python - <<'PY'
          import json
          from pathlib import Path
          lab=Path('wayfarer/lab/packing_phase1b')
          frozen=json.loads((lab/'frozen_research_3p8_forward.json').read_text())
          assert frozen['candidate_pass']
          g6=frozen['G6']
          assert g6['candidate_changed_BRep_g_cm2']>=53.29035
          # Preserve exactly the three released v2.5.3 G6 fit fields
          # required by crown_geom_v253; the superseded report GLB
          # bundle is deleted, not regenerated or rebooked.
          g6.update(g6_runs_for_v253=1,
              kT_v253_min_53p39_with_0p1_tolerance_pass=True,
              v253_band_fit={'fitted_volume_m3':4.896996543367485})
          (lab/'current_g3_rebuild_report.json').write_text(json.dumps(frozen)+'\n')
          print('IMMUTABLE_V253_CERTIFIED_STEP_REUSED')
          PY
      - name: Preflight exact nozzle-area conservation on the released v2.5.9 GLB
        run: |
          python - <<'PY'
          import json,struct,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('wayfarer/lab').resolve()))
          from nozzle_band_faces_v259 import split_nozzle_rings
          raw=Path('wayfarer/render/out/wayfarer_exterior_detail_88ce19fc_stowed_closed.glb').read_bytes()
          n,k=struct.unpack_from('<II',raw,12)
          assert k==0x4e4f534a
          obj=json.loads(raw[20:20+n])
          node=next(x for x in obj['nodes'] if x.get('name')=='dry:nozzle')
          _,band=split_nozzle_rings(obj,raw[20+n:],node,len(obj['materials']),[47.2,48.5,49.8,51.1,52.4])
          assert band['relative_area_error']<=1e-6 and band['surface_area_conservation']
          print('NOZZLE_V2510_PREFLIGHT_PASS',band)
          PY
      - name: Actual OCC G8 on nozzle ring and every DOCKED source viewer part
        run: |
          set -euo pipefail
          python -u wayfarer/lab/shuttle/shuttle_v1_docked_G8_gate.py
          python -u wayfarer/lab/shuttle/shuttle_v1_full_docked_G8.py
      - name: kT v2.5.11 dark interiors and graphite fixtures, six-state D9, containment and F3
        run: |
          set -euo pipefail
          python -u wayfarer/lab/exterior_detail_f3_20261110.py | tee f3-exterior.log
      - name: Verify six CANON_FINISH PBR GLBs, source-direction RCS, etch, D9, containment
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,struct
          from pathlib import Path
          root=Path('wayfarer/render/out')
          prefix='wayfarer_exterior_detail_88ce19fc'
          r=json.loads((root/(prefix+'_report.json')).read_text())
          # The #488 release is superseded and must not be resurrected.
          assert not list(root.glob('wayfarer_shuttle_hold_fullship_88ce19fc*'))
          assert r['status']=='F3_EXTERIOR_DETAIL_SIX_STATE_D9_CONTAINMENT_PASS'
          assert r['all_six_state_D9_and_containment']=='PASS'
          assert r['source_dry_t']==868.1922552640087
          assert r['dry_mass_change_t']==0 and r['ECON_dv_km_s']==707.845
          assert r['spare_panes_unchanged'] and not r['no_hull_cuts']
          assert r['shuttle_hull_spine_groove_cut']
          d=r['exterior_detail']
          assert d['RCS_F1_approved'] and d['shuttle_spine_groove']
          assert d['no_pressure_vessel_cuts'] and d['no_crown_change']
          assert not d['no_hull_protrusion']
          assert d['laser_terminals_source_station_m']==33.3
          q=d['RCS_pitch_yaw_authority_quick_screen']
          assert q['aft_station_m']==34.15 and q['nominal_ratio']>=1
          assert q['degraded_ratio']>=2.076 and q['nominal_ratio']>=2.336
          assert q['source_states_evaluated']==7 and q['source_direction_screen']
          assert q['radial_bells_per_cluster']==1 and q['tangential_bells_per_cluster']==2
          assert q['zero_net_lateral_force'] and q['prior_v256_screen_did_not_use_source_directions']
          assert d['PBR_finish_gate'].startswith('CANON_FINISH')
          assert d['hull_surface_seam_scheme']=='hull_seam_scheme_2026_11_09'
          assert d['hull_seam_width_m']==.05 and d['thin_shell_actual_blind_mark_m']==.006
          assert d['strake_1300K_glow_state']=='strakes Metric 2m and Torch 4m'
          assert d['graphite_srgb_2026_11_11_v258']=='#3A3D42'
          assert d['hot_state_diffuse_linear_rgb']==[.02,.02,.02]
          assert d['nozzle_coil_band_width_m']==.15
          assert d['pressure_vessel_visible_finish']=='CANON_FINISH/interior_pressure_structure'
          assert d['service_shield_band_finish']=='CANON_FINISH/shadow_shield'
          assert d['bay_corner_finish']=='CANON_FINISH/external_fixtures'
          assert d['all_rendered_nodes_require_CANON_FINISH']
          assert d['pale_accent_linear_rgb_scale']==.6
          assert d['nozzle_coil_band_depth_m']==.03
          assert d['no_new_source_mass'] and d['no_performance_claims']
          assert d['print_minimum_modelled_feature_m']==.1
          fix=d['metadata_only_fixes']
          assert fix['docking_camera_material']=='sensor'
          assert fix['hold_door_display_share_t']==1.0
          assert fix['hold_hardware_and_door_interface_allowance_t']==2.0
          assert fix['courier_parent_booking_unchanged_t']==19.450370894400045
          assert fix['no_rebooking']
          png=root/(prefix+'_F3_before_after.png')
          assert png.read_bytes()[:4]==bytes([137,80,78,71]) and png.stat().st_size>5000
          assert set(r['six_states'])==set(d['modes'])=={'stowed','metric_hard','torch'}
          for mode,poses in r['six_states'].items():
            assert set(poses)=={'stowed','closed'}
            e=d['modes'][mode]
            assert e['edited_nodes']==(45 if mode=='torch' else 49)
            assert not e['all_detail_subtractions'] and not e['source_envelope_violations']
            assert e['F1_approved_rcs_additions']==8
            assert e['source_mass_rebooking_t']==0
            et=e['hull_and_torch_surface_etch']
            assert et['approved_seam_scheme']=='hull_seam_scheme_2026_11_09'
            assert et['ring_width_m']==.05 and et['thin_wall_actual_OCC_depth_m']==.006
            assert et['no_pressure_boundary_perforation'] and et['source_mass_rebooking_t']==0
            assert et['legacy_22p5_degree_skin_grid_removed']
            nozzle=et['parts']['dry:nozzle']
            assert nozzle['ring_band_station_m']==[47.2,48.5,49.8,51.1,52.4]
            assert nozzle['band_width_m']==.15 and nozzle['band_depth_m']==.03
            for body in ('dry:armor','dry:skin_service','dry:skin_midship',
                         'dry:skin_aft','dry:tank_shell_out','dry:tank_shell_in'):
                assert body in et['parts']
                assert et['parts'][body]['source_mass_rebooking_t']==0
            folds=[v['folded_stack'] for v in e['parts'].values()
                   if v['role']=='folded_fin']
            assert len(folds)==(0 if mode=='torch' else 4)
            assert all(v==dict(pleats=14,folded_pleat_length_m=2,
                               tangential_stack_thickness_m=.6,radial_root_m=4.75,
                               radial_outer_m=6.75,x_range_m=[34.3,53.3],
                               visible_edge_engravings=14) for v in folds)
            assert all(
                (v['F1_approved_housing_and_nozzles'] and
                 v['bell_count']==4 and v['radial_bells']==1 and v['tangential_bells']==2 and
                 len(v['transverse_bell_axes'])==3 and
                 v['axial_bells']==1 and v['axial_cant_deg']==10 and
                 v['print_bell_diameter_1_100_mm']>=2 and
                 v['source_mass_rebooking_t']==0 and
                 not v['same_source_envelope'] and v['external_added_m3']>0)
                if v['role']=='rcs' else
                (v['same_source_envelope'] and v['external_added_m3']<1e-8
                 and v['engraved_m3']>0)
                for v in e['parts'].values())
            assert all(v['booked_mass_t']>0 for v in e['parts'].values())
            assert sorted(v['station_m'] for v in e['parts'].values()
                          if v['role']=='rcs')==[3.0]*4+[34.15]*4
            assert len([v for v in e['parts'].values()
                        if v['role']=='laser_terminal' and v['source_station_m']==33.3])==2
            for pose,st in poses.items():
              assert st['category_d_count']==0 and st['boolean_errors']==0
              assert st['pressure_containment_pass'] and st['semantic_hierarchy']['hierarchy_valid']
              raw=(Path('wayfarer')/st['glb']).read_bytes()
              assert raw[:4]==b'glTF' and hashlib.sha256(raw).hexdigest()==st['gltf_extras']['raw_glb_sha256']
              n,k=struct.unpack_from('<II',raw,12)
              assert k==0x4e4f534a
              data=json.loads(raw[20:20+n])
              meshes=[v for v in data['nodes'] if 'mesh' in v]
              km=json.loads(Path('wayfarer/config/kt_decisions.json').read_text())['canon_finish_2026_11_11']
              import math
              def transfer(v):
                  v=int(v,16)/255
                  return ((v+.055)/1.055)**2.4 if v>.04045 else v/12.92
              color=lambda h:[transfer(h[i:i+2]) for i in (1,3,5)]
              assert len(km['rows'])==24
              for role,row in km['rows'].items():
                  assert row['status']=='CANON_FINISH'
                  assert all(0<=v<=1 for v in color(row['base_srgb_hex']))
              for mat in data['materials']:
                  name=mat.get('name','')
                  if not name.startswith('CANON_FINISH/'):continue
                  role=name.split('/')[1]
                  if role=='source_palette_preserved':
                      raise AssertionError('INVALID_SOURCE_PALETTE_FINISH '+name)
                  assert role in km['rows']
                  hot=any(v>0 for v in mat.get('emissiveFactor',[0,0,0]))
                  expected=([.02,.02,.02] if hot else
                      [v*float(km['rows'][role].get('linear_base_scale',1.))
                       for v in color(km['rows'][role]['base_srgb_hex'])])
                  assert all(abs(a-b)<1e-7 for a,b in zip(
                      mat['pbrMetallicRoughness']['baseColorFactor'][:3],expected)),name
              nozzle_node=next(v for v in meshes if v['name']=='dry:nozzle')
              band_index=nozzle_node['extras']['nozzle_coil_band_material_index']
              assert data['materials'][band_index]['name']=='CANON_FINISH/nozzle_coil_bands'
              band_prims=[p for p in data['meshes'][nozzle_node['mesh']]['primitives']
                          if p['material']==band_index]
              assert len(band_prims)>=1
              assert nozzle_node['extras']['nozzle_coil_band_triangles_per_station']==st['gltf_extras']['nozzle_coil_band_faces']['face_triangles_per_station']
              assert st['gltf_extras']['canon_finish']=='CANON_FINISH'
              assert st['gltf_extras']['exterior_pbr_meshes']>30
              assert st['gltf_extras']['exterior_pbr_variants']>=15
              assert st['gltf_extras']['srgb_to_linear_declared_roles']==24
              assert st['gltf_extras']['verified_linear_pbr_materials']>=16
              graphite=st['gltf_extras']['graphite_linear_base_rgb']
              assert all(abs(x-y)<.001 for x,y in zip(graphite,[.0423,.0470,.0545]))
              assert st['gltf_extras']['thermal_glow_diffuse_base_linear_rgb']==[.02,.02,.02]
              band=st['gltf_extras']['nozzle_coil_band_faces']
              assert band['stations_x_m']==[47.2,48.5,49.8,51.1,52.4]
              assert band['width_m']==.15 and band['depth_m']==.03
              assert len(band['face_triangles_per_station'])==5
              assert all(x>0 for x in band['face_triangles_per_station'])
              assert band['surface_area_conservation'] and band['band_edges_split_exactly']
              assert band['paint_by_triangle_centroid'] is False
              assert band['source_triangles_total']>0
              assert band['relative_area_error']<=1e-6
              assert len(band['boundary_edge_vertices'])==10
              assert all(x>0 for x in band['boundary_edge_vertices'])
              assert band['nozzle_geometry_envelope_unchanged']
              assert band['print_band_width_1_100_mm']==1.5
              assert all('pbrMetallicRoughness' in mat for mat in data['materials'] if mat.get('name','').startswith('CANON_FINISH/'))
              assigned=[v for v in meshes if v['extras'].get('finish_status')=='CANON_FINISH']
              assert len(assigned)==len(meshes)==st['gltf_extras']['exterior_pbr_meshes']
              assert st['gltf_extras']['all_visible_meshes_CANON_FINISH']
              assert st['gltf_extras']['rendered_meshes_total']==len(meshes)
              assert st['gltf_extras']['missing_visible_finish_meshes']==[]
              assert st['gltf_extras']['pressure_vessel_finish']=='interior_pressure_structure'
              assert st['gltf_extras']['service_shield_finish']=='shadow_shield'
              assert st['gltf_extras']['bay_corner_finish']=='external_fixtures'
              assert st['gltf_extras']['pale_accent_linear_scale']==.6
              assert all(p.get('material') is not None and
                         data['materials'][p['material']].get('name','').startswith('CANON_FINISH/')
                         for v in meshes for p in data['meshes'][v['mesh']]['primitives'])
              assert next(v for v in meshes if v['name']=='dry:pressure_vessel')['extras']['finish_role']=='interior_pressure_structure'
              assert len([v for v in meshes if v['name'].startswith('dry:service_shield_band_') and
                          v['extras']['finish_role']=='shadow_shield'])==8
              assert len([v for v in meshes if v['name'].startswith('dry:bay_corner_') and
                          v['extras']['finish_role']=='external_fixtures'])==4
              assert all(data['meshes'][v['mesh']]['primitives'][0]['material'] ==
                         v['extras']['pbr_material_index'] for v in assigned)
              glowing=[v for v in assigned if v['extras'].get('thermal_emissive_state')]
              if mode=='stowed':assert not glowing
              if mode=='metric_hard':
                  assert glowing and all('strake_' in v['name'] for v in glowing)
              if mode=='torch':
                  assert any('hotfin_' in v['name'] and 'HOTFIN_1750K' in
                             v['extras']['thermal_emissive_state'] for v in glowing)
                  assert any('strake_' in v['name'] and 'STRAKE_1300K' in
                             v['extras']['thermal_emissive_state'] for v in glowing)
              assert len(meshes)==st['part_count']
              assert st['gltf_extras']['source_palette_preserved_meshes']==0
              assert st['gltf_extras']['explicit_finish_meshes']==st['part_count']
              assert all(v['extras']['finish_role'] in km['rows'] for v in meshes)
              assert all(not any('source_palette_preserved' in data['materials'][p['material']].get('name','') for p in data['meshes'][v['mesh']]['primitives']) for v in meshes)
              assert all(all(f in v['extras'] and v['extras'][f] is not None
                             for f in ('zone','deck','material','print_group','mass'))
                         for v in meshes)
              assert sum(v['name'].startswith('dry:crown_spare_') for v in meshes)==7
              cameras=[v for v in meshes if v['name'].startswith('dry:docking_camera_')]
              assert len(cameras)==2 and all(v['extras']['material']=='sensor' for v in cameras)
              doors=[v for v in meshes if v['name'].startswith('dry:hold_existing_door_')]
              assert len(doors)==2
              assert sum(v['extras']['mass'] for v in doors)==2.0
              assert all(v['extras']['mass']==1.0 and
                         v['extras']['source_mass_owner_id']=='courier_systems' and
                         v['extras']['node_mass_rebooking_t']==0 and
                         v['extras']['mass_rebooking_t']==0 and
                         v['extras']['source_parent_booking_t']==19.450370894400045
                         for v in doors)
              print('F3_STATE_VERIFIED',mode,pose,st['part_count'])
          print('F3_ALL_SIX_STATES_D9_CONTAINMENT_ENVELOPE_EXTRAS_PASS')
          PY
      - name: Commit validated F3 before-after and six hierarchical GLBs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- wayfarer/render/out/wayfarer_exterior_detail_88ce19fc_*.glb \
                     wayfarer/render/out/wayfarer_exterior_detail_88ce19fc_report.json \
                     wayfarer/render/out/wayfarer_exterior_detail_88ce19fc_F3_before_after.png
          test "$(git ls-files --cached 'wayfarer/render/out/wayfarer_exterior_detail_88ce19fc_*.glb' | wc -l)" -eq 6
          git commit -m 'class:engineering: v2.5.11 approved dark interior and graphite fixtures six-state pass'
          git restore --worktree -- .
          git fetch origin "${{ github.head_ref }}"
          git rebase "origin/${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"
  release_tag_v2511:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact v2.5.11 committed six-state geometry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('wayfarer/render/out')
          r=json.loads((root/'wayfarer_exterior_detail_88ce19fc_report.json').read_text())
          assert r['status']=='F3_EXTERIOR_DETAIL_SIX_STATE_D9_CONTAINMENT_PASS'
          assert r['all_six_state_D9_and_containment']=='PASS'
          assert r['source_dry_t']==868.1922552640087 and r['dry_mass_change_t']==0
          assert r['ECON_dv_km_s']==707.845
          assert all(s['gltf_extras']['source_palette_preserved_meshes']==0 for poses in r['six_states'].values() for s in poses.values())
          assert sum(len(p) for p in r['six_states'].values())==6
          for poses in r['six_states'].values():
              for s in poses.values():
                  assert s['category_d_count']==0 and s['pressure_containment_pass']
                  assert (Path('wayfarer')/s['glb']).is_file()
                  b=s['gltf_extras']['nozzle_coil_band_faces']
                  assert b['band_edges_split_exactly'] and b['relative_area_error']<=1e-6
                  assert b['nozzle_geometry_envelope_unchanged']
                  assert s['gltf_extras']['missing_visible_finish_meshes']==[]
          print('CANON_V2511_RELEASE_SIX_STATE_PASS')
          PY
      - name: Annotate exact geometry merge commit canon-v2.5.11
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --tags origin
          if git rev-parse -q --verify refs/tags/canon-v2.5.11 >/dev/null; then
            echo 'STOP: canon-v2.5.11 already exists'; exit 1
          fi
          git tag -a canon-v2.5.11 "$GITHUB_SHA" -m 'Wayfarer canon-v2.5.11: five clean nozzle groove rings, six-state D9 containment and 1e-6 surface conservation; no mass or ECON delta'
          git push origin refs/tags/canon-v2.5.11
          echo "TAG_OBJECT_SHA=$(git rev-parse 'canon-v2.5.11^{tag}')"
          echo "TAG_COMMIT_SHA=$(git rev-parse 'canon-v2.5.11^{}')"
