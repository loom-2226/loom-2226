name: Wayfarer F3 exterior detail six-state BRep/GLB
on:
  pull_request:
    paths:
      - wayfarer/lab/exterior_detail_f3_20261110.py
      - wayfarer/lab/shuttle/shuttle_v1_fullship_integrate_20261110.py
      - wayfarer/lab/shuttle/shuttle_v1_full_docked_G8.py
      - wayfarer/config/courier_option_c_ledger_20261110.json
      - .github/workflows/wayfarer-exterior-detail-f3.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wayfarer-exterior-detail-f3
  cancel-in-progress: true
jobs:
  integrate:
    if: github.event_name == 'pull_request' && github.head_ref != 'engineering/wayfarer-hotfin-folded-stack-v255-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin certified source and OCC version
        run: |
          set -euo pipefail
          python -m pip install build123d==0.13.0 matplotlib==3.10.7
          python -m py_compile wayfarer/lab/exterior_detail_f3_20261110.py
          echo '88ce19fc8bc4c487b1ad96e2edb1bed17f36188a445070af238afdffada181c1  wayfarer/results/out/wayfarer_v05_geometry.json' | sha256sum -c -
          cp wayfarer/lab/packing_phase1b/frozen_research_3p8_forward.step.gz \
             wayfarer/lab/packing_phase1b/current_g3_3p8_forward.step.gz
          python - <<'PY'
          import json
          from pathlib import Path
          lab=Path('wayfarer/lab/packing_phase1b')
          frozen=json.loads((lab/'frozen_research_3p8_forward.json').read_text())
          assert frozen['candidate_pass']
          g6=frozen['G6']
          assert g6['candidate_changed_BRep_g_cm2']>=53.29035
          # Preserve exactly the three released v2.5.3 G6 fit fields
          # required by crown_geom_v253; the superseded report GLB
          # bundle is deleted, not regenerated or rebooked.
          g6.update(g6_runs_for_v253=1,
              kT_v253_min_53p39_with_0p1_tolerance_pass=True,
              v253_band_fit={'fitted_volume_m3':4.896996543367485})
          (lab/'current_g3_rebuild_report.json').write_text(json.dumps(frozen)+'\n')
          print('IMMUTABLE_V253_CERTIFIED_STEP_REUSED')
          PY
      - name: Actual OCC G8 on nozzle ring and every DOCKED source viewer part
        run: |
          set -euo pipefail
          python -u wayfarer/lab/shuttle/shuttle_v1_docked_G8_gate.py
          python -u wayfarer/lab/shuttle/shuttle_v1_full_docked_G8.py
      - name: F3 engrave inside source BReps, six-state D9, containment and before-after render
        run: |
          set -euo pipefail
          python -u wayfarer/lab/exterior_detail_f3_20261110.py | tee f3-exterior.log
      - name: Verify all six exterior GLBs, source-envelope F1, extras and F3
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,struct
          from pathlib import Path
          root=Path('wayfarer/render/out')
          prefix='wayfarer_exterior_detail_88ce19fc'
          r=json.loads((root/(prefix+'_report.json')).read_text())
          # The #488 release is superseded and must not be resurrected.
          assert not list(root.glob('wayfarer_shuttle_hold_fullship_88ce19fc*'))
          assert r['status']=='F3_EXTERIOR_DETAIL_SIX_STATE_D9_CONTAINMENT_PASS'
          assert r['all_six_state_D9_and_containment']=='PASS'
          assert r['source_dry_t']==868.1922552640087
          assert r['dry_mass_change_t']==0 and r['ECON_dv_km_s']==707.845
          assert r['spare_panes_unchanged'] and not r['no_hull_cuts']
          assert r['shuttle_hull_spine_groove_cut']
          d=r['exterior_detail']
          assert d['RCS_F1_approved'] and d['shuttle_spine_groove']
          assert d['no_pressure_vessel_cuts'] and d['no_crown_change']
          assert not d['no_hull_protrusion']
          assert d['laser_terminals_source_station_m']==33.3
          q=d['RCS_pitch_yaw_authority_quick_screen']
          assert q['aft_station_m']==34.15 and q['nominal_ratio']>=1
          assert q['degraded_ratio']>=1 and q['source_states_evaluated']==7
          assert d['no_new_source_mass'] and d['no_performance_claims']
          assert d['print_minimum_modelled_feature_m']==.1
          fix=d['metadata_only_fixes']
          assert fix['docking_camera_material']=='sensor'
          assert fix['hold_door_display_share_t']==1.0
          assert fix['hold_hardware_and_door_interface_allowance_t']==2.0
          assert fix['courier_parent_booking_unchanged_t']==19.450370894400045
          assert fix['no_rebooking']
          png=root/(prefix+'_F3_before_after.png')
          assert png.read_bytes()[:4]==bytes([137,80,78,71]) and png.stat().st_size>5000
          assert set(r['six_states'])==set(d['modes'])=={'stowed','metric_hard','torch'}
          for mode,poses in r['six_states'].items():
            assert set(poses)=={'stowed','closed'}
            e=d['modes'][mode]
            assert e['edited_nodes']==(45 if mode=='torch' else 49)
            assert not e['all_detail_subtractions'] and not e['source_envelope_violations']
            assert e['F1_approved_rcs_additions']==8
            assert e['source_mass_rebooking_t']==0
            folds=[v['folded_stack'] for v in e['parts'].values()
                   if v['role']=='folded_fin']
            assert len(folds)==(0 if mode=='torch' else 4)
            assert all(v==dict(pleats=14,folded_pleat_length_m=2,
                               tangential_stack_thickness_m=.6,radial_root_m=4.75,
                               radial_outer_m=6.75,x_range_m=[34.3,53.3],
                               visible_edge_engravings=14) for v in folds)
            assert all(
                (v['F1_approved_housing_and_nozzles'] and
                 v['bell_count']==4 and v['radial_bells']==3 and
                 v['axial_bells']==1 and v['axial_cant_deg']==10 and
                 v['print_bell_diameter_1_100_mm']>=2 and
                 v['source_mass_rebooking_t']==0 and
                 not v['same_source_envelope'] and v['external_added_m3']>0)
                if v['role']=='rcs' else
                (v['same_source_envelope'] and v['external_added_m3']<1e-8
                 and v['engraved_m3']>0)
                for v in e['parts'].values())
            assert all(v['booked_mass_t']>0 for v in e['parts'].values())
            assert sorted(v['station_m'] for v in e['parts'].values()
                          if v['role']=='rcs')==[3.0]*4+[34.15]*4
            assert len([v for v in e['parts'].values()
                        if v['role']=='laser_terminal' and v['source_station_m']==33.3])==2
            for pose,st in poses.items():
              assert st['category_d_count']==0 and st['boolean_errors']==0
              assert st['pressure_containment_pass'] and st['semantic_hierarchy']['hierarchy_valid']
              raw=(Path('wayfarer')/st['glb']).read_bytes()
              assert raw[:4]==b'glTF' and hashlib.sha256(raw).hexdigest()==st['gltf_extras']['raw_glb_sha256']
              n,k=struct.unpack_from('<II',raw,12)
              assert k==0x4e4f534a
              meshes=[v for v in json.loads(raw[20:20+n])['nodes'] if 'mesh' in v]
              assert len(meshes)==st['part_count']
              assert all(all(f in v['extras'] and v['extras'][f] is not None
                             for f in ('zone','deck','material','print_group','mass'))
                         for v in meshes)
              assert sum(v['name'].startswith('dry:crown_spare_') for v in meshes)==7
              cameras=[v for v in meshes if v['name'].startswith('dry:docking_camera_')]
              assert len(cameras)==2 and all(v['extras']['material']=='sensor' for v in cameras)
              doors=[v for v in meshes if v['name'].startswith('dry:hold_existing_door_')]
              assert len(doors)==2
              assert sum(v['extras']['mass'] for v in doors)==2.0
              assert all(v['extras']['mass']==1.0 and
                         v['extras']['source_mass_owner_id']=='courier_systems' and
                         v['extras']['node_mass_rebooking_t']==0 and
                         v['extras']['mass_rebooking_t']==0 and
                         v['extras']['source_parent_booking_t']==19.450370894400045
                         for v in doors)
              print('F3_STATE_VERIFIED',mode,pose,st['part_count'])
          print('F3_ALL_SIX_STATES_D9_CONTAINMENT_ENVELOPE_EXTRAS_PASS')
          PY
      - name: Commit validated F3 before-after and six hierarchical GLBs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- wayfarer/render/out/wayfarer_exterior_detail_88ce19fc_*.glb \
                     wayfarer/render/out/wayfarer_exterior_detail_88ce19fc_report.json \
                     wayfarer/render/out/wayfarer_exterior_detail_88ce19fc_F3_before_after.png
          test "$(git ls-files --cached 'wayfarer/render/out/wayfarer_exterior_detail_88ce19fc_*.glb' | wc -l)" -eq 6
          git commit -m 'class:engineering: F3 detailed BReps six-state D9/containment and before-after render'
          git restore --worktree -- .
          git fetch origin "${{ github.head_ref }}"
          git rebase "origin/${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"
