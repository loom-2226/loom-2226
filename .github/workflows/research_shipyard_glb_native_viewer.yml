name: LOOM Shipyard GLB Native Viewer

on:
  pull_request:
    paths:
      - 'src/shipyard_glb_viewer.py'
      - 'src/shipyard_glb_viewer_compat.py'
      - 'src/shipyard_visual_artifact_store.py'
      - 'src/shipyard_visual_library.py'
      - 'deploy/android/LOOM_Shipyard_GLB_Viewer.py'
      - 'deploy/android/LOOM_Shipyard_GLB_Library.py'
      - 'qualification/synthesis/semantic_glb.py'
      - 'src/qualification/synthesis/semantic_glb.py'
      - 'tests/test_shipyard_glb_viewer.py'
      - 'tests/test_shipyard_visual_artifact_store.py'
      - 'tests/test_shipyard_visual_library.py'
      - '.github/workflows/research_shipyard_glb_native_viewer.yml'
  workflow_dispatch:

jobs:
  glb-native-viewer:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/qualification/synthesis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile GLB viewer and library path
        run: |
          python -m py_compile \
            src/shipyard_glb_viewer.py \
            src/shipyard_glb_viewer_compat.py \
            src/shipyard_visual_artifact_store.py \
            src/shipyard_visual_library.py \
            deploy/android/LOOM_Shipyard_GLB_Viewer.py \
            deploy/android/LOOM_Shipyard_GLB_Library.py \
            qualification/synthesis/semantic_glb.py \
            src/qualification/synthesis/semantic_glb.py
      - name: Run GLB and SQLite artifact/library regression
        run: python -m unittest tests.test_shipyard_glb_viewer tests.test_shipyard_visual_artifact_store tests.test_shipyard_visual_library -v
      - name: Generate governed GLB, store in ledger, read back and inspect through Pixel launcher
        run: |
          DB="$(mktemp --suffix=.sqlite3)"
          rm -f "$DB"
          python - <<PY
          from design_ledger import DesignLedger
          with DesignLedger("$DB"):
              pass
          PY
          python deploy/android/LOOM_Shipyard_GLB_Viewer.py --db "$DB" --status | tee /tmp/glb-status.txt
          grep -q 'source=SQLITE_BLOB' /tmp/glb-status.txt
          grep -q 'artifact_id=VISUAL::GLB::' /tmp/glb-status.txt
          python - <<PY
          import sqlite3
          con=sqlite3.connect("$DB")
          row=con.execute('SELECT artifact_sha256,length(payload),authority_status FROM visual_artifact_blob').fetchone()
          assert row is not None and row[1] > 0
          assert row[2] == 'DERIVED_VISUAL_ARTIFACT_STORAGE_ONLY'
          print('SQLITE GLB BLOB:', row)
          PY
      - name: Populate and list SQLite GLB visual library
        run: |
          DB="$(mktemp --suffix=.sqlite3)"
          rm -f "$DB"
          python - <<PY
          from design_ledger import DesignLedger
          with DesignLedger("$DB"):
              pass
          PY
          python deploy/android/LOOM_Shipyard_GLB_Library.py --db "$DB" --list | tee /tmp/glb-library.txt
          grep -q 'GOVERNED_SEMANTIC' /tmp/glb-library.txt
          python - <<PY
          import sqlite3
          con=sqlite3.connect("$DB")
          row=con.execute('SELECT display_name,artifact_class,length(payload) FROM visual_library_asset').fetchone()
          assert row is not None and row[0] == 'Wayfarer — Governed Semantic'
          assert row[1] == 'GOVERNED_SEMANTIC' and row[2] > 0
          print('GLB LIBRARY:', row)
          PY
      - name: Validate compatibility viewer JavaScript syntax and uint32 path
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          sys.path.insert(0, 'deploy/android')
          from shipyard_glb_viewer_compat import viewer_html
          from LOOM_Shipyard_GLB_Library import _library_html
          compat = viewer_html()
          assert 'OES_element_index_uint' in compat
          assert "getContext('webgl2'" in compat
          for name, html in [('viewer', compat), ('library', _library_html())]:
              scripts=[]
              rest=html
              while '<script>' in rest:
                  rest=rest.split('<script>',1)[1]
                  script, rest=rest.split('</script>',1)
                  scripts.append(script)
              Path(f'/tmp/loom_glb_{name}.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/loom_glb_viewer.js
          node --check /tmp/loom_glb_library.js
