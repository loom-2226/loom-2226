name: LOOM Shipyard GLB Native Viewer

on:
  pull_request:
    paths:
      - 'src/shipyard_glb_viewer.py'
      - 'src/shipyard_glb_viewer_compat.py'
      - 'src/shipyard_visual_artifact_store.py'
      - 'src/shipyard_visual_library.py'
      - 'src/shipyard_realization_handoff.py'
      - 'deploy/android/LOOM_Shipyard_GLB_Viewer.py'
      - 'deploy/android/LOOM_Shipyard_GLB_Library.py'
      - 'qualification/synthesis/semantic_glb.py'
      - 'qualification/synthesis/shipyard_visual_grammar.py'
      - 'src/qualification/synthesis/semantic_glb.py'
      - 'src/qualification/synthesis/shipyard_visual_grammar.py'
      - 'tests/test_shipyard_glb_viewer.py'
      - 'tests/test_shipyard_visual_artifact_store.py'
      - 'tests/test_shipyard_visual_library.py'
      - 'tests/test_shipyard_realization_handoff.py'
      - '.github/workflows/research_shipyard_glb_native_viewer.yml'
  workflow_dispatch:

jobs:
  glb-native-viewer:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/qualification/synthesis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile GLB viewer, library and realization handoff
        run: |
          python -m py_compile \
            src/shipyard_glb_viewer.py \
            src/shipyard_glb_viewer_compat.py \
            src/shipyard_visual_artifact_store.py \
            src/shipyard_visual_library.py \
            src/shipyard_realization_handoff.py \
            deploy/android/LOOM_Shipyard_GLB_Viewer.py \
            deploy/android/LOOM_Shipyard_GLB_Library.py \
            qualification/synthesis/semantic_glb.py \
            qualification/synthesis/shipyard_visual_grammar.py \
            src/qualification/synthesis/semantic_glb.py \
            src/qualification/synthesis/shipyard_visual_grammar.py
      - name: Run GLB, SQLite library and realization regressions
        run: python -m unittest tests.test_shipyard_glb_viewer tests.test_shipyard_visual_artifact_store tests.test_shipyard_visual_library tests.test_shipyard_realization_handoff -v
      - name: Generate governed GLB, store in ledger, read back and inspect through Pixel launcher
        run: |
          DB="$(mktemp --suffix=.sqlite3)"
          rm -f "$DB"
          python - <<PY
          from design_ledger import DesignLedger
          with DesignLedger("$DB"):
              pass
          PY
          python deploy/android/LOOM_Shipyard_GLB_Viewer.py --db "$DB" --status | tee /tmp/glb-status.txt
          grep -q 'source=SQLITE_BLOB' /tmp/glb-status.txt
          grep -q 'artifact_id=VISUAL::GLB::' /tmp/glb-status.txt
      - name: Populate SQLite GLB library and emit Asteria packet
        run: |
          DB="$(mktemp --suffix=.sqlite3)"
          rm -f "$DB"
          python - <<PY
          from design_ledger import DesignLedger
          with DesignLedger("$DB"):
              pass
          PY
          python deploy/android/LOOM_Shipyard_GLB_Library.py --db "$DB" --list | tee /tmp/glb-library.txt
          grep -q 'GOVERNED_SEMANTIC' /tmp/glb-library.txt
          ASSET=$(python - <<PY
          import sqlite3
          con=sqlite3.connect("$DB")
          print(con.execute("SELECT asset_id FROM visual_library_asset WHERE artifact_class='GOVERNED_SEMANTIC'").fetchone()[0])
          PY
          )
          python deploy/android/LOOM_Shipyard_GLB_Library.py --db "$DB" --packet-asset "$ASSET" --yard ASTERIA > /tmp/asteria-packet.json
          python - <<'PY'
          import json
          packet=json.load(open('/tmp/asteria-packet.json'))
          assert packet['yard']['yard_id']=='ASTERIA'
          assert packet['authority_status']=='NON_AUTHORITATIVE_VISUAL_REALIZATION_HANDOFF_ONLY'
          assert packet['visual_realization_authoritative'] is False
          assert len(packet['reference_views'])==7
          assert len(packet['component_map'])>0
          print('ASTERIA PACKET:', packet['packet_hash'])
          PY
      - name: Validate compatibility viewer JavaScript syntax and mobile realization controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          sys.path.insert(0, 'deploy/android')
          from shipyard_glb_viewer_compat import viewer_html
          from LOOM_Shipyard_GLB_Library import _library_html
          compat = viewer_html()
          assert 'OES_element_index_uint' in compat
          assert "getContext('webgl2'" in compat
          library=_library_html()
          assert '/api/realization' in library
          assert 'yardSelect' in library
          assert '@media(max-width:720px)' in library
          for name, html in [('viewer', compat), ('library', library)]:
              scripts=[]
              rest=html
              while '<script>' in rest:
                  rest=rest.split('<script>',1)[1]
                  script, rest=rest.split('</script>',1)
                  scripts.append(script)
              Path(f'/tmp/loom_glb_{name}.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/loom_glb_viewer.js
          node --check /tmp/loom_glb_library.js
