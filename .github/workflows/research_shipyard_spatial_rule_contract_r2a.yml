name: LOOM Shipyard Spatial Rule Contract R2A

on:
  pull_request:
  workflow_dispatch:

jobs:
  spatial-rule-contract-r2a:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/qualification/synthesis:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile R2A synthesis modules
        run: python -m compileall -q qualification/synthesis
      - name: Run R2A spatial rule contract tests
        run: >-
          python -m unittest -v
          tests.test_wayfarer_spatial_rule_contract_r2a
          tests.test_wayfarer_minimum_spatial_validation
          tests.test_wayfarer_semantic_geometry
          tests.test_wayfarer_governed_ship_synthesis
