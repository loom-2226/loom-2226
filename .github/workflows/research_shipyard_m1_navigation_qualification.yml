name: LOOM Shipyard M1 Navigation Qualification

on:
  pull_request:
    paths:
      - 'src/qualification/synthesis/vehicle_dynamics_contract.py'
      - 'src/qualification/synthesis/shipyard_campaign_binding.py'
      - 'src/loom_navigator_core.py'
      - 'tests/test_shipyard_real_navigator_leg.py'
      - '.github/workflows/research_shipyard_m1_navigation_qualification.yml'
  workflow_dispatch:

jobs:
  qualify-m1-live-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/src/qualification/synthesis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Navigator acquisition dependency
        run: python -m pip install requests
      - name: Run governed Shipyard to live Navigator M1 chain
        run: |
          python - <<'PY'
          import copy
          import json
          import tempfile
          import time
          from pathlib import Path

          import loom_navigator_core as campaign
          from qualification.synthesis.shipyard_campaign_binding import validate_campaign_binding
          from qualification.synthesis.vehicle_dynamics_contract import build_wayfarer_contract_family

          contract = build_wayfarer_contract_family(2226)[0]
          state = campaign._new_state('SHIPYARD-M1-QUALIFICATION', 'WAYFARER-M1')
          before = copy.deepcopy(state)
          binding = validate_campaign_binding(contract, state)
          assert binding['compatible_for_navigator_consumption'] is True

          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              nav = campaign._load_core(root / 'core')
              cache = root / 'cache'
              mission = {
                  'schema': nav.MISSION_SCHEMA,
                  'test_id': 'SHIPYARD_M1',
                  'epoch': {'local': '2226-08-01T00:00:00', 'timezone': 'UTC', 'fold': 0},
                  'route': ['CERES', 'NEPTUNE_SYSTEM'],
                  'ship': 'WAYFARER_BASELINE',
                  'requested_modes': {'metric': 'NORMAL', 'torch': 'CRUISE'},
              }
              normalized = nav.validate_and_normalize_mission(mission)
              normalized['_campaign_initial_state'] = {
                  'state_id': state['state_id'],
                  'state_sha256': state['state_sha256'],
                  'wet_mass_t': state['ship']['wet_mass_t'],
                  'remass_t': state['ship']['remass_t'],
              }

              # Use Navigator's own SOURCE-010 request plan/cache implementation,
              # but acquire only the BASE dependencies actually consumed by this
              # route. The generic global sweep includes unrelated local moons
              # whose Horizons coverage does not extend to 2226.
              _, _, trace = nav.acquisition_window(normalized)
              full_plan = nav.build_acquisition_plan(normalized)
              required_ids = {nav.ROUTE_OBJECTS[token]['base_id'] for token in normalized['route']}
              route_plan = [item for item in full_plan if item['scope'] == 'BASE' and item['id'] in required_ids]
              assert required_ids == {'CE', 'NE'}
              assert {item['id'] for item in route_plan} == required_ids
              assert len(route_plan) == 2

              session = nav.build_session()
              entries = []
              hits = fetched = total_cache = total_raw = 0
              t0 = time.perf_counter()
              for item in route_plan:
                  req = item['request']
                  r = nav.fetch_or_cache(req, cache, session, offline=False, refresh=False)
                  hits += int(r['status'] == 'CACHE_HIT')
                  fetched += int(r['status'] == 'FETCHED')
                  total_cache += int(r.get('cache_bytes', 0))
                  total_raw += int(r.get('raw_archive_bytes', 0))
                  entries.append({**{k: v for k, v in item.items() if k != 'request'}, 'request': req.canonical(), **r})

              acquisition = {
                  'schema': 'LOOM_NAV_EPHEMERIS_ACQUISITION_INDEX_v1',
                  'workflow_version': nav.WORKFLOW_VERSION,
                  'test_id': normalized['test_id'],
                  'epoch_utc': normalized['epoch_utc'],
                  'policy': nav.EPHEMERIS_POLICY,
                  'window_trace': trace,
                  'request_count': len(route_plan),
                  'cache_hits': hits,
                  'fetched': fetched,
                  'direct_unavailable': 0,
                  'cache_bytes_touched': total_cache,
                  'raw_archive_bytes_written': total_raw,
                  'elapsed_seconds': round(time.perf_counter() - t0, 6),
                  'entries': entries,
                  'authority': {
                      'source': 'SOURCE-010',
                      'derived_scientific_values_in_cache': False,
                      'llm_calculation_authority': 'ZERO',
                  },
              }

              canonical, axis_validation = nav.build_canonical_dependency_index(acquisition, cache)
              assert axis_validation['status'] == 'PASS'
              assert {d['id'] for d in canonical['dependencies']} == required_ids

              origin, dest = normalized['route']
              rr0 = {'request': origin, **nav.ROUTE_OBJECTS[origin]}
              rr1 = {'request': dest, **nav.ROUTE_OBJECTS[dest]}
              rows0, deps0 = nav._route_rows_from_canonical(rr0, canonical, cache)
              rows1, deps1 = nav._route_rows_from_canonical(rr1, canonical, cache)
              assert {d['id'] for d in deps0 + deps1} == required_ids

              metric_mode = 'NORMAL'
              torch_mode = 'CRUISE'
              departure = nav._dt(normalized['epoch_utc'])
              leg = nav._solve_leg(
                  origin,
                  dest,
                  departure,
                  rows0,
                  rows1,
                  canonical['time_axis'],
                  metric_mode,
                  torch_mode,
                  float(state['ship']['wet_mass_t']),
              )
              burn = leg['terminal_burn']
              used = float(burn['remass_used_t'])
              arrival_remass = float(state['ship']['remass_t']) - used

              assert leg['solver_model'] == 'NAV-V1-A'
              assert leg['solver_version'] == '1.1'
              assert leg['metric_mode'] == metric_mode
              assert leg['torch_mode'] == torch_mode
              assert used > 0.0
              assert used <= float(state['ship']['remass_t']) + 1e-9
              assert arrival_remass >= -1e-9
              assert float(burn['wet_mass_start_t']) == float(state['ship']['wet_mass_t'])
              assert abs(float(leg['root_solver']['root_residual_s'])) < 1e-6
              assert state == before

              evidence = {
                  'schema': 'LOOM_SHIPYARD_M1_NAVIGATION_QUALIFICATION_v0.3',
                  'status': 'PASS',
                  'm1_closed': True,
                  'scope': 'ONE_GOVERNED_WAYFARER_CLOSES_THROUGH_REAL_NAVIGATOR_ROUTE_DATA_AND_NAV_V1_A_PHYSICS',
                  'qualification_mode': 'EXPLICIT_REQUESTED_MODE_PAIR_NOT_FULL_MODE_SWEEP',
                  'shipyard_contract_version': contract.version,
                  'shipyard_contract_hash': contract.contract_hash,
                  'campaign_binding_hash': binding['binding_hash'],
                  'navigator_core_sha256': campaign.CORE_SHA,
                  'mission_schema': nav.MISSION_SCHEMA,
                  'route': normalized['route'],
                  'ship': normalized['ship'],
                  'ephemeris_source_authority': acquisition['authority']['source'],
                  'ephemeris_llm_calculation_authority': acquisition['authority']['llm_calculation_authority'],
                  'acquisition_scope': 'ROUTE_REQUIRED_BASE_DEPENDENCIES_ONLY',
                  'acquisition_dependency_ids': sorted(required_ids),
                  'axis_qualification': axis_validation['status'],
                  'selected_metric_mode': metric_mode,
                  'selected_torch_mode': torch_mode,
                  'solver_model': leg['solver_model'],
                  'solver_version': leg['solver_version'],
                  'campaign_wet_mass_t': state['ship']['wet_mass_t'],
                  'campaign_remass_t': state['ship']['remass_t'],
                  'terminal_remass_used_t': used,
                  'arrival_remass_t': arrival_remass,
                  'total_nav_time_s': leg['arrival']['total_nav_time_s'],
                  'arrival_epoch_utc': leg['arrival']['epoch_utc'],
                  'root_residual_s': leg['root_solver']['root_residual_s'],
                  'campaign_state_mutated': False,
                  'flight_dynamics_authority_changed': False,
                  'canon_changed': False,
                  'production_shipclasses_changed': False,
                  'm2_candidate_differentiation_closed': False,
                  'note': 'M1 qualifies one governed Wayfarer mission using Navigator-native SOURCE-010 route acquisition, canonical axis validation, authoritative route-row loading, and the real NAV-V1-A solver. The exhaustive mode sweep is a planner-performance concern, not required to establish this one-ship physics closure.'
              }
              Path('shipyard_m1_navigation_qualification.json').write_text(
                  json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8'
              )
              print(json.dumps(evidence, indent=2, sort_keys=True))
          PY
      - name: Preserve M1 qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: shipyard-m1-navigation-qualification
          path: shipyard_m1_navigation_qualification.json
          if-no-files-found: error
