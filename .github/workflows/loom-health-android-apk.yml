name: LOOM Health Android APK
on:
  pull_request:
    paths:
      - 'mobile/loom-health/**'
      - '.github/workflows/loom-health-android-apk.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/loom-health/**'
      - '.github/workflows/loom-health-android-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        working-directory: mobile/loom-health
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LOOM-Health-Android-APK
          path: mobile/loom-health/app/build/outputs/apk/debug/app-debug.apk
