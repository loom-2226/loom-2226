name: LOOM Research Shipyard Phase 3 Discipline Gates

on:
  pull_request:
    branches:
      - research/computational-shipyard-android-oneclick-v0.1-2026-09-08
    paths:
      - 'src/shipyard_phase3.py'
      - 'src/shipyard_migrate.py'
      - 'deploy/android/loom_update_shipyard.py'
      - 'manifests/shipyard_overlay_manifest.json'
      - 'tests/test_wayfarer_shipyard_phase3_discipline_gates.py'
      - '.github/workflows/research_shipyard_phase3.yml'

jobs:
  validate-phase3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile production Python
        run: python -m compileall -q src deploy qualification
      - name: Run Phase-3 focused tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/qualification/synthesis
        run: python tests/test_wayfarer_shipyard_phase3_discipline_gates.py
      - name: Verify Shipyard overlay manifest digests
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.')
          m=json.loads((root/'manifests/shipyard_overlay_manifest.json').read_text())
          assert m['source_ref'] == 'research/computational-shipyard-phase3-discipline-gates-v0.1-2026-09-08'
          for row in m['artifacts']:
              data=(root/row['path']).read_bytes()
              actual=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert actual == row['git_blob_sha1'], (row['path'], actual, row['git_blob_sha1'])
          print('PHASE3_OVERLAY_ARTIFACTS', len(m['artifacts']))
          PY
