name: LOOM Generative Shipyard Foundation

on:
  pull_request:
    paths:
      - 'src/qualification/synthesis/generative_shipyard_foundation.py'
      - 'src/qualification/synthesis/generative_candidate_compiler.py'
      - 'src/qualification/synthesis/vehicle_dynamics_contract.py'
      - 'src/qualification/synthesis/physical_design_core.py'
      - 'src/qualification/synthesis/physical_design_search.py'
      - 'qualification/synthesis/physical_design_core.py'
      - 'qualification/synthesis/physical_design_search.py'
      - 'tests/test_generative_shipyard_foundation.py'
      - 'tests/test_generative_candidate_compiler.py'
      - 'tests/test_vehicle_dynamics_contract.py'
      - '.github/workflows/research_generative_shipyard_foundation.yml'
  workflow_dispatch:

jobs:
  generative-shipyard-foundation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/src/qualification/synthesis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile foundation, candidate compiler and vehicle handoff
        run: |
          python -m py_compile \
            src/qualification/synthesis/generative_shipyard_foundation.py \
            src/qualification/synthesis/generative_candidate_compiler.py \
            src/qualification/synthesis/vehicle_dynamics_contract.py
      - name: Run generative and vehicle-handoff regression
        run: |
          python -m unittest \
            tests.test_generative_shipyard_foundation \
            tests.test_generative_candidate_compiler \
            tests.test_vehicle_dynamics_contract -v
      - name: Execute first bounded Wayfarer candidate family
        run: |
          python src/qualification/synthesis/generative_shipyard_foundation.py > /tmp/wayfarer-generative-v01.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/wayfarer-generative-v01.json'))
          outcomes=p['outcomes']
          legal=[x for x in outcomes if x['status']=='SURVIVED_SCREEN']
          rejected=[x for x in outcomes if x['status']=='REJECTED_BY_ADEQUATE_MODEL']
          assert len(outcomes)==10
          assert len(legal)>=2
          assert len(rejected)>=2
          assert p['pareto_frontier']
          assert p['flight_dynamics_authority'] is False
          assert p['canon_changed'] is False
          assert p['production_shipclasses_changed'] is False
          assert p['adequacy']['adequate_for_selection'] is False
          print('WAYFARER GENERATIVE FAMILY:', len(legal), 'survived,', len(rejected), 'rejected,', len(p['pareto_frontier']), 'Pareto')
          print('EXPERIMENT HASH:', p['experiment_hash'])
          PY
      - name: Compile surviving candidates to distinct governed semantic GLBs
        run: |
          python src/qualification/synthesis/generative_candidate_compiler.py > /tmp/wayfarer-compiled-family.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/wayfarer-compiled-family.json'))
          assert p['candidate_count'] >= 2
          assert p['distinct_glb_count'] >= 2
          assert p['distinct_governed_package_count'] >= 2
          assert p['flight_dynamics_authority'] is False
          assert p['canon_changed'] is False
          assert p['production_shipclasses_changed'] is False
          print('COMPILED SURVIVORS:', p['candidate_count'])
          print('DISTINCT GLBS:', p['distinct_glb_count'])
          PY
      - name: Compile vehicle dynamics contracts and test current mission differentiation
        run: |
          python src/qualification/synthesis/vehicle_dynamics_contract.py > /tmp/wayfarer-vehicle-family.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/wayfarer-vehicle-family.json'))
          assert p['candidate_count'] >= 2
          assert p['distinct_design_state_count'] >= 2
          assert p['distinct_semantic_glb_count'] >= 2
          assert p['distinct_translational_signature_count'] == 1
          assert p['translational_mission_behavior_differentiated'] is False
          assert p['flight_dynamics_authority'] is False
          print('VEHICLE CONTRACTS:', p['candidate_count'])
          print('TRANSLATIONAL SIGNATURES:', p['distinct_translational_signature_count'])
          print('WHY NOT YET DIFFERENT:', p['reason_if_not_differentiated'])
          PY
