name: Wayfarer Step 1 committed six-state GLB validation
on:
  pull_request:
    paths:
      - .github/workflows/wayfarer-step1-recover.yml
      - wayfarer/render/out/wayfarer_full_radiator_states_88ce19fc_*.glb
      - wayfarer/render/out/wayfarer_full_radiator_states_88ce19fc_report.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify six committed full-ship GLBs, D9/containment and glTF node extras
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, struct
          from pathlib import Path
          root=Path("wayfarer/render/out")
          r=json.loads((root/"wayfarer_full_radiator_states_88ce19fc_report.json").read_text())
          assert r["governing_canon_tag"]=="canon-v2.5.3"
          assert r["governing_merge_commit"]=="03479ea035a9207e3f7b91402ec387237b5c66e6"
          assert r["source_geometry_sha256"]=="88ce19fc8bc4c487b1ad96e2edb1bed17f36188a445070af238afdffada181c1"
          assert r["source_dry_mass_t"]==868.1922552640087
          assert r["econ_dv_km_s"]==707.845
          assert r["source_mass_ledger_changed_t"]==0
          assert r["no_print_only_edits"]
          assert set(r["modes"])=={"stowed","metric_hard","torch"}
          all_modes={"stowed":457,"metric_hard":461,"torch":517}
          for mode,m in r["modes"].items():
              assert m["replacing_exactly_12_original_solids"]
              assert m["mass_credit_t"]==0 and m["containment"]["pass_containment"]
              assert set(m["gores"])=={"stowed","closed"}
              for pose,scan in m["gores"].items():
                  assert scan["part_count"]==all_modes[mode]
                  assert scan["category_d_count"]==0
                  assert scan["boolean_errors"]==0 and scan["containment_pass"]
                  assert scan["pair_count"]==scan["part_count"]*(scan["part_count"]-1)//2
                  path=Path("wayfarer")/scan["glb"]
                  raw=path.read_bytes()
                  assert hashlib.sha256(raw).hexdigest()==scan["gltf_extras"]["raw_glb_sha256"]
                  assert raw[:4]==b"glTF" and struct.unpack_from("<I",raw,8)[0]==len(raw)
                  n,typ=struct.unpack_from("<II",raw,12)
                  assert typ==0x4e4f534a
                  data=json.loads(raw[20:20+n])
                  nodes=data["nodes"]
                  assert all("extras" in node for node in nodes)
                  meshes=[node for node in nodes if "mesh" in node]
                  assert len(meshes)==scan["part_count"]==scan["gltf_extras"]["mesh_nodes_with_extras"]
                  assert len(nodes)==scan["gltf_extras"]["all_scene_nodes_with_extras"]
                  assert all(node["extras"]["node_mass_rebooking_t"]==0 for node in meshes)
                  assert all(node["extras"]["canon_tag"]=="canon-v2.5.3" for node in meshes)
                  print("VERIFIED",mode,pose,len(meshes),scan["pair_count"])
          print("SIX_COMMITTED_FULL_SHIP_GLBS_VERIFIED_NO_ARTIFACT_ZIP")
          PY
