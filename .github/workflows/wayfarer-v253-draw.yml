name: Wayfarer canon GLB pointer integrity (no geometry exports)
on:
  pull_request:
    paths:
      - wayfarer/render/out/canon_glb.json
      - .github/workflows/wayfarer-v253-draw.yml
  push:
    branches: [main]
    paths:
      - wayfarer/render/out/canon_glb.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tagged v2.5.9 finish coverage, nozzle, D9 and six GLB hashes
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path("wayfarer/render/out")
          p=json.loads((root/"canon_glb.json").read_text())
          r=json.loads((root/"wayfarer_exterior_detail_88ce19fc_report.json").read_text())
          target="c7d29e17f5f9b346db7df129d617b24ad59a2bf7"
          assert p["schema"]=="wayfarer/canon-glb-pointer/v1"
          assert p["tag"]=="canon-v2.5.9" and p["status"]=="RELEASED"
          assert p["release_commit"]==target
          subprocess.run(["git","cat-file","-e",target+"^{commit}"],check=True)
          assert p["source_geometry_sha256"]==r["source_geometry_sha256"]=="88ce19fc8bc4c487b1ad96e2edb1bed17f36188a445070af238afdffada181c1"
          assert p["dry_mass_t"]==r["source_dry_t"]==868.1922552640087
          assert p["delta_v_ECON_km_s"]==r["ECON_dv_km_s"]==707.845
          assert r["dry_mass_change_t"]==0 and r["all_six_state_D9_and_containment"]=="PASS"
          assert r["status"]=="F3_EXTERIOR_DETAIL_SIX_STATE_D9_CONTAINMENT_PASS"
          assert r["exterior_detail"]["no_new_source_mass"]
          assert r["exterior_detail"]["no_crown_change"] and not r["exterior_detail"]["no_hull_protrusion"]
          d=r["exterior_detail"]
          assert d["RCS_F1_approved"] and d["no_pressure_vessel_cuts"]
          assert r["shuttle_hull_spine_groove_cut"] and d["shuttle_spine_groove"]
          assert d["laser_terminals_source_station_m"]==33.3
          assert r["no_hull_cuts"] is False
          q=d["RCS_pitch_yaw_authority_quick_screen"]
          assert q["aft_station_m"]==34.15 and q["nominal_ratio"]>=1
          assert q["degraded_ratio"]>=2.076 and q["nominal_ratio"]>=2.336
          assert q["source_direction_screen"] and q["zero_net_lateral_force"]
          assert q["radial_bells_per_cluster"]==1 and q["tangential_bells_per_cluster"]==2
          assert q["source_states_evaluated"]==7
          assert d["PBR_finish_gate"].startswith("CANON_FINISH")
          assert d["hull_surface_seam_scheme"]=="hull_seam_scheme_2026_11_09"
          assert d["hull_seam_width_m"]==.05 and d["thin_shell_actual_blind_mark_m"]==.006
          finish=json.loads(Path("wayfarer/config/kt_decisions.json").read_text())["canon_finish_2026_11_11"]
          assert finish["decision"]=="kT APPROVED" and finish["status"]=="CANON_FINISH"
          assert all(v["status"]=="CANON_FINISH" for v in finish["rows"].values())
          assert finish["rows"]["midship_skin_bay_doors"]["base_srgb_hex"]=="#3A3D42"
          assert finish["rows"]["magnetic_nozzle_bronze"]["base_srgb_hex"]=="#AD8052"
          assert finish["rows"]["nozzle_coil_bands"]["base_srgb_hex"]=="#30373D"
          assert finish["rows"]["service_band_aft_thrust_cone"]["base_srgb_hex"]=="#B9BFBC"
          assert len(finish["rows"])==24
          assert finish["rows"]["interior_pressure_structure"]["status"]=="CANON_FINISH"
          assert finish["rows"]["service_band_aft_thrust_cone"]["linear_base_scale"]==0.8
          assert all(finish["rows"][name]["base_srgb_hex"]=="#3A3D42"
                     for name in ("bow_strata","midship_skin_bay_doors","strata_gores_shutters"))
          assert finish["nozzle_coil_band"]["stations_x_m"]==[47.2,48.5,49.8,51.1,52.4]
          assert finish["nozzle_coil_band"]["width_m"]==.15
          assert finish["nozzle_coil_band"]["depth_m"]==.03
          assert all(len([v for v in d["modes"][mode]["parts"].values() if v["role"]=="rcs"
                          and v["bell_count"]==4 and v["axial_cant_deg"]==10
                          and v["print_bell_diameter_1_100_mm"]>=2])==8
                     for mode in ("stowed","metric_hard","torch"))
          for mode in ("stowed","metric_hard"):
              folds=[x["folded_stack"] for x in r["exterior_detail"]["modes"][mode]["parts"].values()
                     if x["role"]=="folded_fin"]
              assert len(folds)==4
              assert all(x["pleats"]==14 and x["folded_pleat_length_m"]==2
                         and x["tangential_stack_thickness_m"]==.6
                         and x["radial_outer_m"]==6.75
                         and x["x_range_m"]==[34.3,53.3]
                         and x["visible_edge_engravings"]==14 for x in folds)
          assert not any(x["role"]=="folded_fin" for x in r["exterior_detail"]["modes"]["torch"]["parts"].values())
          assert p["path"]=="wayfarer/render/out/wayfarer_exterior_detail_88ce19fc_stowed_closed.glb"
          assert p["glb_nodes"]==498 and len(p["other_states"])==5
          states=[{"mode":"stowed","crown_pose":"closed","path":p["path"],
                   "glb_nodes":p["glb_nodes"],"hash":p["hash"]}]+p["other_states"]
          assert len({(s["mode"],s["crown_pose"]) for s in states})==6
          assert len({s["path"] for s in states})==6
          assert not list(root.glob("wayfarer_shuttle_hold_fullship_88ce19fc*"))

          for s in states:
              st=r["six_states"][s["mode"]][s["crown_pose"]]
              data=Path(s["path"]).read_bytes()
              assert data[:4]==b"glTF"
              gitblob=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              assert s["hash"]=={"algorithm":"git-blob-sha1","value":gitblob},s["path"]

              assert hashlib.sha256(data).hexdigest()==st["gltf_extras"]["raw_glb_sha256"]
              assert s["glb_nodes"]==st["part_count"]==st["gltf_extras"]["mesh_nodes_with_extras"]
              assert st["category_d_count"]==0 and st["boolean_errors"]==0
              assert st["pressure_containment_pass"]
              assert st["semantic_hierarchy"]["hierarchy_valid"]
              extra=st["gltf_extras"]
              assert extra["canon_finish"]=="CANON_FINISH"
              assert extra["exterior_pbr_meshes"]>30
              assert extra["exterior_pbr_variants"]>=15
              assert extra["hot_fin_1300K_preview_removed"]
              assert extra["srgb_to_linear_declared_roles"]==24
              assert extra["verified_linear_pbr_materials"]>=16
              assert all(abs(x-y)<1e-7 for x,y in zip(
                  extra["graphite_linear_base_rgb"],
                  [.042311410620809675,.046665086336880095,.05448027644244237]))
              assert extra["thermal_glow_diffuse_base_linear_rgb"]==[.02,.02,.02]
              b=extra["nozzle_coil_band_faces"]
              assert b["stations_x_m"]==[47.2,48.5,49.8,51.1,52.4]
              assert b["width_m"]==.15 and b["depth_m"]==.03
              assert b["face_triangles_total"]==1056
              assert len(b["face_triangles_per_station"])==5
              assert all(n>0 for n in b["face_triangles_per_station"])
              assert b["source_triangles_total"]==2348
              assert b["triangle_conservation"] and b["nozzle_geometry_envelope_unchanged"]
              if s["mode"]=="stowed":assert extra["thermal_emissive_meshes"]==0
              if s["mode"]=="metric_hard":assert extra["thermal_emissive_meshes"]==8
              if s["mode"]=="torch":assert extra["thermal_emissive_meshes"]==68
              import struct
              n,chunk=struct.unpack_from("<II",data,12)
              assert chunk==0x4e4f534a
              obj=json.loads(data[20:20+n])
              assert any(x.get("name","").startswith("CANON_FINISH/") and
                         "pbrMetallicRoughness" in x for x in obj["materials"])
              for m in obj["materials"]:
                  title=m.get("name","")
                  if not title.startswith("CANON_FINISH/"):continue
                  role=title.split("/")[1]
                  if role=="source_palette_preserved":
                      assert "pbrMetallicRoughness" in m
                      continue
                  assert role in finish["rows"]
                  hexcode=finish["rows"][role]["base_srgb_hex"]
                  rgb=[int(hexcode[i:i+2],16)/255 for i in (1,3,5)]
                  expected=[(v+.055)/1.055 for v in rgb]
                  expected=[v**2.4 if rgb[j]>.04045 else rgb[j]/12.92 for j,v in enumerate(expected)]
                  if any(m.get("emissiveFactor",[0,0,0])):
                      expected=[.02,.02,.02]
                  else:
                      expected=[v*float(finish["rows"][role].get("linear_base_scale",1.0)) for v in expected]
                  actual=m["pbrMetallicRoughness"]["baseColorFactor"][:3]
                  assert all(abs(a-b)<1e-7 for a,b in zip(actual,expected))
              nozzle=next(n for n in obj["nodes"] if n.get("name")=="dry:nozzle")
              dark=nozzle["extras"]["nozzle_coil_band_material_index"]
              assert obj["materials"][dark]["name"]=="CANON_FINISH/nozzle_coil_bands"
              assert any(pr["material"]==dark for pr in
                         obj["meshes"][nozzle["mesh"]]["primitives"])
              painted=[x for x in obj["nodes"] if
                       x.get("extras",{}).get("finish_status")=="CANON_FINISH"]
              assert len(painted)==extra["exterior_pbr_meshes"]==st["part_count"]
              assert extra["all_visible_meshes_CANON_FINISH"]
              assert extra["missing_visible_finish_meshes"]==[]
              assert next(n for n in painted if n["name"]=="dry:pressure_vessel")["extras"]["finish_role"]=="interior_pressure_structure"
              assert len([n for n in painted if n["name"].startswith("dry:service_shield_band_") and n["extras"]["finish_role"]=="shadow_shield"])==8
              assert len([n for n in painted if n["name"].startswith("dry:bay_corner_") and n["extras"]["finish_role"]=="external_fixtures"])==4
              assert all(pr.get("material") is not None and obj["materials"][pr["material"]].get("name","").startswith("CANON_FINISH/") for node in obj["nodes"] if "mesh" in node for pr in obj["meshes"][node["mesh"]]["primitives"])
              assert len([x for x in painted if
                          x["extras"].get("thermal_emissive_state")])==extra["thermal_emissive_meshes"]
              print("CANON_259_VIEWER_STATE_PASS",s["mode"],s["crown_pose"])
          print("CANON_259_POINTER_SIX_EXISTING_GLBS_PASS")
          PY
  publish_exact_tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify existing annotated canon-v2.5.9 tag pins exact geometry commit
        run: |
          set -euo pipefail
          target=c7d29e17f5f9b346db7df129d617b24ad59a2bf7
          tag=canon-v2.5.9
          git cat-file -e "$target^{commit}"
          git fetch --tags origin
          test "$(git rev-parse "$tag^{}")" = "$target"
          test "$(git cat-file -t "refs/tags/$tag")" = "tag"
          echo "CANON_259_TAG_EXACT_GEOMETRY_COMMIT_VERIFIED"
