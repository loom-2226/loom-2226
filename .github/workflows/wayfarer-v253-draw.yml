name: Wayfarer canon-v2.5.3 true drawings, D9 and containment
on:
  pull_request:
    paths:
      - wayfarer/lab/crown_geom_v253.py
      - wayfarer/lab/v253_extra.py
      - .github/workflows/wayfarer-v253-draw.yml
  push:
    branches: [main]
    paths:
      - wayfarer/lab/crown_geom_v253.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draw:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned mass-booked source and kT decisions, no G1-G12
        shell: bash
        run: |
          set -euo pipefail
          echo '88ce19fc8bc4c487b1ad96e2edb1bed17f36188a445070af238afdffada181c1  wayfarer/results/out/wayfarer_v05_geometry.json' | sha256sum -c -
          test -s wayfarer/config/kt_decisions.json
          test -s wayfarer/AGENTS.md
      - name: Pinned G3 installed STEP source regeneration, no output promoted
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build123d==0.13.0
          base=ea50354e222e77d145a6bbbf49227506d2b560fd
          source="$RUNNER_TEMP/loom156/projects/wayfarer_brep_pilot"
          mkdir -p "$source"
          git show "$base:wayfarer/results/out/wayfarer_v05_geometry.json" > "$source/geometry_base.json"
          git show "$base:wayfarer/config/wayfarer_v05_inputs.json" > "$source/inputs_base.json"
          git show "$base:wayfarer/config/cert_criteria.json" > "$source/criteria_base.json"
          cp wayfarer/lab/packing_phase1b/source_brep_pilot.py "$source/pilot.py"
          cp wayfarer/lab/packing_phase1b/source_brep_triage.py "$source/triage.py"
          pinned=wayfarer/lab/packing_phase1b/pinned_main_lab
          mkdir -p "$pinned"
          git show "$base:wayfarer/lab/build_v05.py" > "$pinned/build_v05.py"
          git show "$base:wayfarer/lab/certify.py" > "$pinned/certify.py"
          git show "$base:wayfarer/lab/torch/torch_heat_results.json" > "$pinned/torch_heat_results.json"
          python -u wayfarer/lab/packing_phase1b/source_candidate_rebuild.py \
            --source "$source" --out "$RUNNER_TEMP/rebuild" \
            --courier-forward --fuel-t 3.8 --house-reserve-t .1 \
            --g1-liquid-ullage --export | tee crown-source-rebuild.log
          python - <<'PY'
          from pathlib import Path
          import gzip, json, os, shutil
          out=Path(os.environ["RUNNER_TEMP"])/"rebuild"
          dest=Path("wayfarer/lab/packing_phase1b")
          assert json.loads((out/"candidate_report.json").read_text())["candidate_pass"]
          with (out/"candidate.step").open("rb") as r, (dest/"current_g3_3p8_forward.step.gz").open("wb") as w:
              with gzip.GzipFile(fileobj=w, mode="wb", filename="", mtime=0) as gz:
                  shutil.copyfileobj(r, gz)
          shutil.copy2(out/"candidate_report.json", dest/"current_g3_rebuild_report.json")
          print("CROWN_STEP_REBUILD_G3_READY")
          PY
      - name: Run v2.5.3 true solids, both D9 states, and pressure containment only
        shell: bash
        run: |
          set -euo pipefail
          python -u wayfarer/lab/crown_geom_v253.py | tee v253-drawing.log
      - name: Verify 61 additions, completed inventory, mass-neutral baseline, and two gore states
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path("wayfarer/results/out/wayfarer_v05_geometry.json").read_text())
          p=Path("wayfarer/render/out/wayfarer_parts_v253_88ce19fc_report.json")
          r=json.loads(p.read_text())
          assert r["drawing_revision"]=="canon-v2.5.3"
          assert r["source_geometry_sha256"]=="88ce19fc8bc4c487b1ad96e2edb1bed17f36188a445070af238afdffada181c1"
          assert r["new_true_solids_count"]==61
          assert r["approved_no_render_inventory"]["already_done_count"]==30
          assert r["approved_no_render_inventory"]["keep_as_allocation_count"]==30
          assert r["approved_no_render_inventory"]["mass_rebooked_t"]==0
          assert r["original_v252_nodes_preserved"]==373
          assert r["per_part_GLTF_nodes"]==466
          assert r["gore_state_geometry"]["gores_per_state"]==16
          assert r["gore_state_geometry"]["physically_mutually_exclusive"]
          assert r["new_interior_containment_check"]["pass_containment"]
          assert r["all_internal_parts_inside_pressure_hull"]["pass_containment"]
          assert r["full_D9_candidate_accepts"] is True
          for pose in ["closed","stowed"]:
              scan=r["gore_states_D9_scans"][pose]
              assert scan["part_count"]==450
              assert scan["pair_count"]==101025
              assert scan["category_d_count"]==0
              assert not scan["collision_errors"]
              assert Path("wayfarer/render/out/wayfarer_parts_v253_88ce19fc_"+pose+".glb").is_file()
          assert Path("wayfarer/render/out/wayfarer_parts_v253_88ce19fc.glb").is_file()
          assert src["overall_length_m"]==r["overall_length_m_unchanged"]==54.5
          assert r["canonical_source_mass_t_before_and_after"]==src["dry_t"]==868.1922552640087
          assert r["delta_v_ECON_km_s_unchanged"]==707.845
          assert r["other_geometry_changed"] is False
          print("V253_DRAW_D9_CONTAINMENT_PASS_NO_MASS_REBOOKING")
          PY
      - name: Commit three GLBs and machine report to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- wayfarer/render/out/wayfarer_parts_v253_88ce19fc.glb \
            wayfarer/render/out/wayfarer_parts_v253_88ce19fc_stowed.glb \
            wayfarer/render/out/wayfarer_parts_v253_88ce19fc_closed.glb \
            wayfarer/render/out/wayfarer_parts_v253_88ce19fc_report.json
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m 'class:engineering: preserve v2.5.3 mass-neutral 61-part and two-pose drawings'
          git restore --worktree -- .
          git fetch origin "${{ github.head_ref }}"
          git rebase "origin/${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Preserve D9 and containment evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayfarer-v253-true-drawings
          if-no-files-found: warn
          path: |
            v253-drawing.log
            wayfarer/render/out/wayfarer_parts_v253_88ce19fc.glb
            wayfarer/render/out/wayfarer_parts_v253_88ce19fc_stowed.glb
            wayfarer/render/out/wayfarer_parts_v253_88ce19fc_closed.glb
            wayfarer/render/out/wayfarer_parts_v253_88ce19fc_report.json
  tag_release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify v2.5.3 evidence and create annotated tag
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("wayfarer/render/out/wayfarer_parts_v253_88ce19fc_report.json").read_text())
          assert r["drawing_revision"]=="canon-v2.5.3"
          assert r["new_true_solids_count"]==61
          assert r["approved_no_render_inventory"]["already_done_count"]==30
          assert r["approved_no_render_inventory"]["keep_as_allocation_count"]==30
          assert r["full_D9_candidate_accepts"]
          assert r["new_interior_containment_check"]["pass_containment"]
          assert r["canonical_source_mass_t_before_and_after"]==868.1922552640087
          assert r["delta_v_ECON_km_s_unchanged"]==707.845
          for pose in ["stowed","closed"]:
              assert r["gore_states_D9_scans"][pose]["category_d_count"]==0
              assert Path("wayfarer/render/out/wayfarer_parts_v253_88ce19fc_"+pose+".glb").is_file()
          print("V253_RELEASE_EVIDENCE_PASS")
          PY
          git fetch --tags origin
          if git show-ref --verify --quiet refs/tags/canon-v2.5.3; then
            test "$(git rev-list -n 1 canon-v2.5.3)" = "$GITHUB_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a canon-v2.5.3 "$GITHUB_SHA" -m 'kT-approved Wayfarer v2.5.3: 61 booked drawings and 16 alternate gores'
            git push origin refs/tags/canon-v2.5.3
          fi
          echo CANON_V253_TAG_VERIFIED
