name: Wayfarer v2.5.3 released GLB integrity (read-only)
on:
  pull_request:
    paths:
      - wayfarer/render/out/canon_glb.json
      - wayfarer/render/out/wayfarer_parts_v253_88ce19fc_report.json
      - .github/workflows/wayfarer-v253-draw.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check immutable release pointer, GLB hash, corrected D9 header
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root=Path("wayfarer/render/out")
          p=json.loads((root/"canon_glb.json").read_text())
          r=json.loads((root/"wayfarer_parts_v253_88ce19fc_report.json").read_text())
          assert p["tag"]=="canon-v2.5.3"
          assert subprocess.check_output(
              ["git","rev-parse","canon-v2.5.3^{}"],text=True).strip()==p["release_commit"]
          glb=Path(p["path"])
          data=glb.read_bytes()
          gitblob=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\\0"+data).hexdigest()
          assert p["hash"]=={"algorithm":"git-blob-sha1","value":gitblob}
          assert r["drawing_revision"]==p["tag"]
          assert p["source_geometry_sha256"]==r["source_geometry_sha256"]
          assert p["dry_mass_t"]==r["canonical_source_mass_t_before_and_after"]==868.1922552640087
          assert p["glb_nodes"]==r["per_part_GLTF_nodes"]==473
          assert r["status"]=="D9_CONTAINMENT_PASS_HARDWARE_OPEN"
          assert r["prohibited_overlap_count"]==0
          assert r["legacy_target_contact_overlap_count"]==2
          assert r["full_D9_candidate_accepts"]
          assert r["new_interior_containment_check"]["pass_containment"]
          assert r["all_internal_parts_inside_pressure_hull"]["pass_containment"]
          for pose in ("stowed","closed"):
              assert r["gore_states_D9_scans"][pose]["category_d_count"]==0
              assert not r["gore_states_D9_scans"][pose]["collision_errors"]
          print("WAYFARER_V253_RELEASE_POINTER_PASS",glb,len(data),gitblob)
          PY
