name: Wayfarer canon GLB pointer integrity (no geometry exports)
on:
  pull_request:
    paths:
      - wayfarer/render/out/canon_glb.json
      - .github/workflows/wayfarer-v253-draw.yml
  push:
    branches: [main]
    paths:
      - wayfarer/render/out/canon_glb.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify existing v2.5.6 F1 drawing details and six GLBs
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path("wayfarer/render/out")
          p=json.loads((root/"canon_glb.json").read_text())
          r=json.loads((root/"wayfarer_exterior_detail_88ce19fc_report.json").read_text())
          target="40cf794da418a9eb29eb38d98aef6909111f2bc8"
          assert p["schema"]=="wayfarer/canon-glb-pointer/v1"
          assert p["tag"]=="canon-v2.5.6" and p["status"]=="RELEASED"
          assert p["release_commit"]==target
          subprocess.run(["git","cat-file","-e",target+"^{commit}"],check=True)
          assert p["source_geometry_sha256"]==r["source_geometry_sha256"]=="88ce19fc8bc4c487b1ad96e2edb1bed17f36188a445070af238afdffada181c1"
          assert p["dry_mass_t"]==r["source_dry_t"]==868.1922552640087
          assert p["delta_v_ECON_km_s"]==r["ECON_dv_km_s"]==707.845
          assert r["dry_mass_change_t"]==0 and r["all_six_state_D9_and_containment"]=="PASS"
          assert r["status"]=="F3_EXTERIOR_DETAIL_SIX_STATE_D9_CONTAINMENT_PASS"
          assert r["exterior_detail"]["no_new_source_mass"]
          assert r["exterior_detail"]["no_crown_change"] and not r["exterior_detail"]["no_hull_protrusion"]
          d=r["exterior_detail"]
          assert d["RCS_F1_approved"] and d["no_pressure_vessel_cuts"]
          assert r["shuttle_hull_spine_groove_cut"] and d["shuttle_spine_groove"]
          assert d["laser_terminals_source_station_m"]==33.3
          assert r["no_hull_cuts"] is False
          q=d["RCS_pitch_yaw_authority_quick_screen"]
          assert q["aft_station_m"]==34.15 and q["nominal_ratio"]>=1
          assert q["degraded_ratio"]>=1 and q["source_states_evaluated"]==7
          assert all(len([v for v in d["modes"][mode]["parts"].values() if v["role"]=="rcs"
                          and v["bell_count"]==4 and v["axial_cant_deg"]==10
                          and v["print_bell_diameter_1_100_mm"]>=2])==8
                     for mode in ("stowed","metric_hard","torch"))
          for mode in ("stowed","metric_hard"):
              folds=[x["folded_stack"] for x in r["exterior_detail"]["modes"][mode]["parts"].values()
                     if x["role"]=="folded_fin"]
              assert len(folds)==4
              assert all(x["pleats"]==14 and x["folded_pleat_length_m"]==2
                         and x["tangential_stack_thickness_m"]==.6
                         and x["radial_outer_m"]==6.75
                         and x["x_range_m"]==[34.3,53.3]
                         and x["visible_edge_engravings"]==14 for x in folds)
          assert not any(x["role"]=="folded_fin" for x in r["exterior_detail"]["modes"]["torch"]["parts"].values())
          assert p["path"]=="wayfarer/render/out/wayfarer_exterior_detail_88ce19fc_stowed_closed.glb"
          assert p["glb_nodes"]==498 and len(p["other_states"])==5
          states=[{"mode":"stowed","crown_pose":"closed","path":p["path"],
                   "glb_nodes":p["glb_nodes"],"hash":p["hash"]}]+p["other_states"]
          assert len({(s["mode"],s["crown_pose"]) for s in states})==6
          assert len({s["path"] for s in states})==6
          assert not list(root.glob("wayfarer_shuttle_hold_fullship_88ce19fc*"))

          for s in states:
              st=r["six_states"][s["mode"]][s["crown_pose"]]
              data=Path(s["path"]).read_bytes()
              assert data[:4]==b"glTF"
              gitblob=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              assert s["hash"]=={"algorithm":"git-blob-sha1","value":gitblob},s["path"]

              assert hashlib.sha256(data).hexdigest()==st["gltf_extras"]["raw_glb_sha256"]
              assert s["glb_nodes"]==st["part_count"]==st["gltf_extras"]["mesh_nodes_with_extras"]
              assert st["category_d_count"]==0 and st["boolean_errors"]==0
              assert st["pressure_containment_pass"]
              assert st["semantic_hierarchy"]["hierarchy_valid"]
              print("CANON_256_VIEWER_STATE_PASS",s["mode"],s["crown_pose"])
          print("CANON_256_POINTER_SIX_EXISTING_GLBS_PASS")
          PY
  publish_exact_tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag immutable merged PR 494 geometry commit only
        run: |
          set -euo pipefail
          target=40cf794da418a9eb29eb38d98aef6909111f2bc8
          tag=canon-v2.5.6
          git cat-file -e "$target^{commit}"
          if git ls-remote --tags --refs origin "refs/tags/$tag" | grep -q .; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-parse "$tag^{}")" = "$target"
            echo "CANON_256_TAG_ALREADY_CORRECT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" "$target" -m 'Wayfarer canon-v2.5.6 drawing-only: F1 RCS bells and relocations, exposed shuttle blades and source lasers; mass neutral'
          git push origin "refs/tags/$tag"
          git fetch origin --tags --force
          test "$(git rev-parse "$tag^{}")" = "$target"
          echo "CANON_256_TAG_PUBLISHED_EXACT_COMMIT"
