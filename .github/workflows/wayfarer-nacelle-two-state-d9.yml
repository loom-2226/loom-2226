name: "Wayfarer nacelles: two candidate STEP D9 (torch + Metric)"
on:
  pull_request:
    paths:
      - .github/workflows/wayfarer-nacelle-two-state-d9.yml
      - wayfarer/config/wayfarer_v05_inputs.json
      - wayfarer/lab/build_v05.py
      - wayfarer/lab/metric_nodes/nacelle_source_brep.py
      - wayfarer/lab/metric_nodes/nacelle_d9_pair.py
      - wayfarer/lab/metric_nodes/nacelle_pressure_stages.py
      - wayfarer/results/out/wayfarer_v05_geometry.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  A_two_steps:
    # B4-S has its own full two-state BRep D9. The historical nacelle-only
    # validator rightly rejects a changed shuttle and must not govern it.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'engineering/shuttle-b4s-')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build123d==0.13.0
      - name: Restore exact certified #559 STEP, report and source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target=wayfarer/lab/metric_nodes/nacelle_candidates
          mkdir -p "$target/approved_source" "$target/proven_d9"
          git show 7e973b3f2cfc75bf292d10aa5719d50a689d30df:wayfarer/results/out/wayfarer_v05_geometry.json > "$target/base_geometry.json"
          gh run download 44046913287 -R loom-2226/loom-2226 -n pr471-A-source -D "$target/approved_source"
          gh run download 44046913287 -R loom-2226/loom-2226 -n pr471-E-merged-D9-full-cert -D "$target/proven_d9"
          cp "$target/approved_source/"*.gz "$target/approved_source/"*.json wayfarer/lab/packing_phase1b/
          sha256sum "$target/base_geometry.json" wayfarer/lab/packing_phase1b/current_g3_3p8_forward.step.gz
      - name: Produce both actual STEP assemblies, no canon writes
        shell: bash
        run: |
          set -euo pipefail
          python -u wayfarer/lab/metric_nodes/nacelle_d9_pair.py build
          test -f wayfarer/lab/metric_nodes/nacelle_candidates/candidate_torch.step.gz
          test -f wayfarer/lab/metric_nodes/nacelle_candidates/candidate_Metric.step.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nacelle-pair-source
          path: wayfarer/lab/metric_nodes/nacelle_candidates/
          retention-days: 30
          if-no-files-found: error

  B_identity:
    needs: A_two_steps
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        state: [torch, Metric]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build123d==0.13.0
      - uses: actions/download-artifact@v4
        with:
          name: nacelle-pair-source
          path: wayfarer/lab/metric_nodes/nacelle_candidates
      - name: Restore approved #559 STEP and source
        run: cp wayfarer/lab/metric_nodes/nacelle_candidates/approved_source/* wayfarer/lab/packing_phase1b/
      - name: "#559 pressure stage source_fingerprint / ${{ matrix.state }}"
        shell: bash
        run: |
          set -euo pipefail
          python -u wayfarer/lab/metric_nodes/nacelle_pressure_stages.py source_fingerprint --state "${{ matrix.state }}"
      - name: "#559 pressure stage candidate_fingerprint / ${{ matrix.state }}"
        shell: bash
        run: |
          set -euo pipefail
          python -u wayfarer/lab/metric_nodes/nacelle_pressure_stages.py candidate_fingerprint --state "${{ matrix.state }}"
      - name: Archive BRep pressure stages with full repository paths
        if: always()
        shell: bash
        run: |
          test -f "wayfarer/results/out/nacelle_d9/${{ matrix.state }}/pressure_stages.json"
          tar -czf "nacelle-pressure-${{ matrix.state }}-identity.tar.gz" \
            wayfarer/results/out/nacelle_d9/${{ matrix.state }}/pressure_stages.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nacelle-pressure-${{ matrix.state }}-identity
          path: nacelle-pressure-${{ matrix.state }}-identity.tar.gz
          if-no-files-found: error

  B_forward:
    needs: B_identity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        state: [torch, Metric]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build123d==0.13.0
      - uses: actions/download-artifact@v4
        with:
          name: nacelle-pair-source
          path: wayfarer/lab/metric_nodes/nacelle_candidates
      - name: Restore approved #559 STEP and source
        run: cp wayfarer/lab/metric_nodes/nacelle_candidates/approved_source/* wayfarer/lab/packing_phase1b/
      - uses: actions/download-artifact@v4
        with:
          name: nacelle-pressure-${{ matrix.state }}-identity
          path: .
      - name: Restore previous pressure checkpoint at the repository root
        run: tar -xzf "nacelle-pressure-${{ matrix.state }}-identity.tar.gz"
      - name: "#559 pressure stage forward / ${{ matrix.state }}"
        shell: bash
        run: |
          set -euo pipefail
          python -u wayfarer/lab/metric_nodes/nacelle_pressure_stages.py forward --state "${{ matrix.state }}"
      - name: Archive BRep pressure stages with full repository paths
        if: always()
        shell: bash
        run: |
          test -f "wayfarer/results/out/nacelle_d9/${{ matrix.state }}/pressure_stages.json"
          tar -czf "nacelle-pressure-${{ matrix.state }}-forward.tar.gz" \
            wayfarer/results/out/nacelle_d9/${{ matrix.state }}/pressure_stages.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nacelle-pressure-${{ matrix.state }}-forward
          path: nacelle-pressure-${{ matrix.state }}-forward.tar.gz
          if-no-files-found: error

  B_reverse:
    needs: B_forward
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        state: [torch, Metric]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build123d==0.13.0
      - uses: actions/download-artifact@v4
        with:
          name: nacelle-pair-source
          path: wayfarer/lab/metric_nodes/nacelle_candidates
      - name: Restore approved #559 STEP and source
        run: cp wayfarer/lab/metric_nodes/nacelle_candidates/approved_source/* wayfarer/lab/packing_phase1b/
      - uses: actions/download-artifact@v4
        with:
          name: nacelle-pressure-${{ matrix.state }}-forward
          path: .
      - name: Restore previous pressure checkpoint at the repository root
        run: tar -xzf "nacelle-pressure-${{ matrix.state }}-forward.tar.gz"
      - name: "#559 pressure stage reverse / ${{ matrix.state }}"
        shell: bash
        run: |
          set -euo pipefail
          python -u wayfarer/lab/metric_nodes/nacelle_pressure_stages.py reverse --state "${{ matrix.state }}"
      - name: Archive BRep pressure stages with full repository paths
        if: always()
        shell: bash
        run: |
          test -f "wayfarer/results/out/nacelle_d9/${{ matrix.state }}/pressure_stages.json"
          tar -czf "nacelle-pressure-${{ matrix.state }}-reverse.tar.gz" \
            wayfarer/results/out/nacelle_d9/${{ matrix.state }}/pressure_stages.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nacelle-pressure-${{ matrix.state }}-reverse
          path: nacelle-pressure-${{ matrix.state }}-reverse.tar.gz
          if-no-files-found: error

  B_validity:
    needs: B_reverse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        state: [torch, Metric]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build123d==0.13.0
      - uses: actions/download-artifact@v4
        with:
          name: nacelle-pair-source
          path: wayfarer/lab/metric_nodes/nacelle_candidates
      - name: Restore approved #559 STEP and source
        run: cp wayfarer/lab/metric_nodes/nacelle_candidates/approved_source/* wayfarer/lab/packing_phase1b/
      - uses: actions/download-artifact@v4
        with:
          name: nacelle-pressure-${{ matrix.state }}-reverse
          path: .
      - name: Restore previous pressure checkpoint at the repository root
        run: tar -xzf "nacelle-pressure-${{ matrix.state }}-reverse.tar.gz"
      - name: "#559 pressure stage validity / ${{ matrix.state }}"
        shell: bash
        run: |
          set -euo pipefail
          python -u wayfarer/lab/metric_nodes/nacelle_pressure_stages.py validity --state "${{ matrix.state }}"
      - name: Archive BRep pressure stages with full repository paths
        if: always()
        shell: bash
        run: |
          test -f "wayfarer/results/out/nacelle_d9/${{ matrix.state }}/pressure_stages.json"
          tar -czf "nacelle-pressure-${{ matrix.state }}-validity.tar.gz" \
            wayfarer/results/out/nacelle_d9/${{ matrix.state }}/pressure_stages.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nacelle-pressure-${{ matrix.state }}-validity
          path: nacelle-pressure-${{ matrix.state }}-validity.tar.gz
          if-no-files-found: error

  B_pressure:
    needs: B_validity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        state: [torch, Metric]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build123d==0.13.0
      - uses: actions/download-artifact@v4
        with:
          name: nacelle-pair-source
          path: wayfarer/lab/metric_nodes/nacelle_candidates
      - name: Restore approved #559 STEP and source
        run: cp wayfarer/lab/metric_nodes/nacelle_candidates/approved_source/* wayfarer/lab/packing_phase1b/
      - uses: actions/download-artifact@v4
        with:
          name: nacelle-pressure-${{ matrix.state }}-validity
          path: .
      - name: Restore previous pressure checkpoint at the repository root
        run: tar -xzf "nacelle-pressure-${{ matrix.state }}-validity.tar.gz"
      - name: "#559 pressure stage boolean / ${{ matrix.state }}"
        shell: bash
        run: |
          set -euo pipefail
          python -u wayfarer/lab/metric_nodes/nacelle_pressure_stages.py boolean --state "${{ matrix.state }}"
      - name: "#559 pressure stage finalize / ${{ matrix.state }}"
        shell: bash
        run: |
          set -euo pipefail
          python -u wayfarer/lab/metric_nodes/nacelle_pressure_stages.py finalize --state "${{ matrix.state }}"
      - name: Archive BRep pressure stages with full repository paths
        if: always()
        shell: bash
        run: |
          test -f "wayfarer/results/out/nacelle_d9/${{ matrix.state }}/pressure_stages.json"
          tar -czf "nacelle-pressure-${{ matrix.state }}-final.tar.gz" \
            wayfarer/results/out/nacelle_d9/${{ matrix.state }}/pressure_stages.json \
            wayfarer/results/out/nacelle_d9/${{ matrix.state }}/pressure.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nacelle-pressure-${{ matrix.state }}-final
          path: nacelle-pressure-${{ matrix.state }}-final.tar.gz
          if-no-files-found: error

  C_primaries:
    needs: [A_two_steps, B_pressure]
    runs-on: ubuntu-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        state: [torch, Metric]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build123d==0.13.0
      - uses: actions/download-artifact@v4
        with:
          name: nacelle-pair-source
          path: wayfarer/lab/metric_nodes/nacelle_candidates
      - run: cp wayfarer/lab/metric_nodes/nacelle_candidates/approved_source/* wayfarer/lab/packing_phase1b/
      - uses: actions/download-artifact@v4
        with:
          name: nacelle-pressure-${{ matrix.state }}-final
          path: .
      - name: Restore the state pressure artifact at repo root (dc72f3e)
        run: tar -xzf "nacelle-pressure-${{ matrix.state }}-final.tar.gz"
      - name: Unchanged primary BRep audit, all 43 across four shards
        shell: bash
        run: |
          python -u wayfarer/lab/metric_nodes/nacelle_d9_pair.py primary \
            --state "${{ matrix.state }}" --shard "${{ matrix.shard }}" --shards 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nacelle-primary-${{ matrix.state }}-${{ matrix.shard }}
          path: wayfarer/results/out/nacelle_d9/
          if-no-files-found: warn

  D_pairs:
    needs: A_two_steps
    runs-on: ubuntu-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        state: [torch, Metric]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build123d==0.13.0
      - uses: actions/download-artifact@v4
        with:
          name: nacelle-pair-source
          path: wayfarer/lab/metric_nodes/nacelle_candidates
      - run: cp wayfarer/lab/metric_nodes/nacelle_candidates/approved_source/* wayfarer/lab/packing_phase1b/
      - name: Existing D9 pair scanner, 214 solids, before/after water debit
        shell: bash
        run: |
          python -u wayfarer/lab/metric_nodes/nacelle_d9_pair.py pairs \
            --state "${{ matrix.state }}" --shard "${{ matrix.shard }}" --shards 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nacelle-pairs-${{ matrix.state }}-${{ matrix.shard }}
          path: wayfarer/results/out/nacelle_d9/
          if-no-files-found: warn

  E_certify_pair:
    # B4-S has its own full installed-solid two-state BRep D9. The legacy
    # nacelle-only finaliser must not run after A_two_steps was skipped.
    if: always() && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'engineering/shuttle-b4s-'))
    needs: [A_two_steps, B_pressure, C_primaries, D_pairs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build123d==0.13.0
      - uses: actions/download-artifact@v4
        with:
          name: nacelle-pair-source
          path: wayfarer/lab/metric_nodes/nacelle_candidates
      - run: cp wayfarer/lab/metric_nodes/nacelle_candidates/approved_source/* wayfarer/lab/packing_phase1b/
      - uses: actions/download-artifact@v4
        with:
          name: nacelle-pressure-torch-final
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: nacelle-pressure-Metric-final
          path: .
      - name: Restore both state pressure artifacts at repository root
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf nacelle-pressure-torch-final.tar.gz
          tar -xzf nacelle-pressure-Metric-final.tar.gz
          python - <<'PYCHECK'
          import json
          from pathlib import Path
          for state in ('torch','Metric'):
              p=Path('wayfarer/results/out/nacelle_d9')/state/'pressure.json'
              d=json.loads(p.read_text())
              assert d['state']==state and d['pass'] is True
              assert d['check']['surface_distance']['native_to_imported']['samples']>=256
              assert d['check']['surface_distance']['imported_to_native']['samples']>=256
          PYCHECK
      - uses: actions/download-artifact@v4
        with:
          pattern: nacelle-primary-*
          merge-multiple: true
          path: wayfarer/results/out/nacelle_d9
      - uses: actions/download-artifact@v4
        with:
          pattern: nacelle-pairs-*
          merge-multiple: true
          path: wayfarer/results/out/nacelle_d9
      - name: Strict AND of 43 primaries and 22,791 pairs per STEP
        run: python -u wayfarer/lab/metric_nodes/nacelle_d9_pair.py merge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nacelle-two-state-final-D9
          path: wayfarer/results/out/D9_NACELLE_TWO_STATE_REPORT.json
          if-no-files-found: warn
