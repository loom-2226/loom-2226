name: Earth-Luna Targeted Qualification

on:
  push:
    branches:
      - feature/earth-luna-spatial-infrastructure-v0.1-2026-09-12
    paths:
      - 'src/loom/spatial/**'
      - 'src/loom/navigation/targeting.py'
      - 'geometry/earth_luna_spatial_geometry_seed.sql'
      - 'tests/test_earth_luna_spatial_geometry.py'
      - 'tests/test_spatial_targets.py'
      - 'tests/test_navigation_targeting.py'
      - '.github/workflows/earth-luna-targeted-qualification.yml'

jobs:
  targeted:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile spatial/navigation production Python
        run: python -m compileall -q src/loom/spatial src/loom/navigation
      - name: Earth-Luna geometry/runtime tests
        run: python -m unittest discover -s tests -p 'test_earth_luna_spatial_geometry.py' -v
      - name: Shared spatial target tests
        run: python -m unittest discover -s tests -p 'test_spatial_targets.py' -v
      - name: Navigator target adapter tests
        run: python -m unittest discover -s tests -p 'test_navigation_targeting.py' -v
