name: LOOM Research Shipyard Phase 2 Artifact

on:
  pull_request:
    branches:
      - research/computational-shipyard-pixel-launcher-v0.1-2026-09-08
    paths:
      - 'qualification/synthesis/phase2_functional_regions.py'
      - 'deploy/android/LOOM_Computational_Shipyard_Phase2.py'
      - 'tests/test_wayfarer_phase2_functional_regions.py'
      - '.github/workflows/research_shipyard_phase2_artifact.yml'

jobs:
  build-phase2-pixel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Phase 2 ledger and viewer
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          root=Path('.')
          synth=root/'qualification'/'synthesis'
          sys.path.insert(0,str(synth))
          from phase2_functional_regions import build_phase2_ledger
          from governed_ship_synthesis_viewer import build_wayfarer_viewer, write_viewer
          out=root/'phase2_pixel_artifact'; out.mkdir(exist_ok=True)
          result=build_phase2_ledger(out/'wayfarer_phase2_design_ledger.sqlite3')
          write_viewer(build_wayfarer_viewer(), out)
          (out/'phase2_manifest.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print('PHASE2_STATE',result['state_id'])
          print('FUNCTIONAL_REGIONS',result['functional_region_count'])
          print('REMAINING_OPEN',result['remaining_open_count'])
          print('SPATIAL_STATUS',result['spatial_status'])
          PY
          cp deploy/android/LOOM_Computational_Shipyard_Phase2.py phase2_pixel_artifact/LOOM_Computational_Shipyard.py
          cat > phase2_pixel_artifact/README_TERMUX.txt <<'EOF'
          LOOM COMPUTATIONAL SHIPYARD — PHASE 2

          cd ~/storage/downloads
          unzip -o loom-computational-shipyard-phase2-pixel-v0.1.zip -d LOOM_SHIPYARD_PHASE2
          cd LOOM_SHIPYARD_PHASE2
          python LOOM_Computational_Shipyard.py

          Choose 1 to activate the packaged Phase-2 ledger.
          Choose 5 to inspect the functional-region contracts.
          Choose 7 to launch the governed 3D viewer at localhost:2227.

          RESEARCH / NON-CANON / NON-PRODUCTION.
          Functional-region anchors are admitted from S1 point-mass centroids.
          Spatial envelopes remain OPEN; no dimensions are invented in Phase 2.
          EOF
      - name: Smoke-test packaged launcher
        run: |
          cd phase2_pixel_artifact
          LOOM_SHIPYARD_DOWNLOADS="$PWD" LOOM_SHIPYARD_HOME="$PWD/runtime" python LOOM_Computational_Shipyard.py --status
          python - <<'PY'
          import sqlite3
          con=sqlite3.connect('wayfarer_phase2_design_ledger.sqlite3')
          try:
              n=con.execute('SELECT COUNT(*) FROM functional_region_contract').fetchone()[0]
              assert n == 9, n
              state=con.execute('SELECT state_kind FROM design_state ORDER BY rowid DESC LIMIT 1').fetchone()[0]
              assert state == 'PHASE2_FUNCTIONAL_REGION_STATE', state
          finally:
              con.close()
          PY
      - name: Upload Phase 2 Pixel package
        uses: actions/upload-artifact@v4
        with:
          name: loom-computational-shipyard-phase2-pixel-v0.1
          path: phase2_pixel_artifact/
          retention-days: 90
