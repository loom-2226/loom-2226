name: LOOM Shipyard Candidate Archive

on:
  pull_request:
    paths:
      - 'src/qualification/synthesis/generative_shipyard_foundation.py'
      - 'src/qualification/synthesis/generative_candidate_compiler.py'
      - 'src/qualification/synthesis/vehicle_dynamics_contract.py'
      - 'src/qualification/synthesis/shipyard_candidate_archive.py'
      - 'src/qualification/synthesis/generative_shipyard_campaign.py'
      - 'deploy/android/LOOM_Shipyard_Build_Campaign.py'
      - 'manifests/shipyard_overlay_manifest.json'
      - 'tests/test_shipyard_candidate_archive.py'
      - '.github/workflows/research_shipyard_candidate_archive.yml'
  workflow_dispatch:

jobs:
  candidate-archive:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/qualification/synthesis:${{ github.workspace }}/src/qualification/synthesis:${{ github.workspace }}/deploy/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile candidate campaign modules and Pixel launcher
        run: |
          python -m py_compile \
            src/qualification/synthesis/shipyard_candidate_archive.py \
            src/qualification/synthesis/generative_shipyard_campaign.py \
            deploy/android/LOOM_Shipyard_Build_Campaign.py
      - name: Run archive and campaign regression
        run: python -m unittest tests.test_shipyard_candidate_archive -v
      - name: Run bounded campaign against a real Shipyard ledger
        run: |
          DB="$(mktemp --suffix=.sqlite3)"
          rm -f "$DB"
          python - <<PY
          from design_ledger import DesignLedger
          with DesignLedger("$DB"):
              pass
          PY
          python deploy/android/LOOM_Shipyard_Build_Campaign.py --db "$DB" --seed 2226 | tee /tmp/build-campaign.txt
          grep -q 'CANDIDATES: 10' /tmp/build-campaign.txt
          grep -q 'SURVIVED: 6' /tmp/build-campaign.txt
          grep -q 'REJECTED: 4' /tmp/build-campaign.txt
          grep -q 'PARETO: 4' /tmp/build-campaign.txt
          grep -q 'GLB ASSETS: 6' /tmp/build-campaign.txt
          grep -q 'NAV DIFFERENTIATED: False' /tmp/build-campaign.txt
          python - <<PY
          import sqlite3
          con=sqlite3.connect("$DB")
          assert con.execute('select count(*) from shipyard_campaign').fetchone()[0] == 1
          assert con.execute('select count(*) from shipyard_candidate').fetchone()[0] == 10
          assert con.execute("select count(*) from visual_library_asset where artifact_class='GOVERNED_SEMANTIC'").fetchone()[0] == 6
          print('SQLITE CAMPAIGN ROUND TRIP: PASS')
          PY
