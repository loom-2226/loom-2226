name: LOOM Shipyard Candidate Archive

on:
  pull_request:
    paths:
      - 'src/qualification/synthesis/generative_shipyard_foundation.py'
      - 'src/qualification/synthesis/generative_candidate_compiler.py'
      - 'src/qualification/synthesis/vehicle_dynamics_contract.py'
      - 'src/qualification/synthesis/shipyard_candidate_archive.py'
      - 'src/qualification/synthesis/generative_shipyard_campaign.py'
      - 'tests/test_shipyard_candidate_archive.py'
      - '.github/workflows/research_shipyard_candidate_archive.yml'
  workflow_dispatch:

jobs:
  candidate-archive:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/qualification/synthesis:${{ github.workspace }}/src/qualification/synthesis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile candidate campaign modules
        run: |
          python -m py_compile \
            src/qualification/synthesis/shipyard_candidate_archive.py \
            src/qualification/synthesis/generative_shipyard_campaign.py
      - name: Run archive and campaign regression
        run: python -m unittest tests.test_shipyard_candidate_archive -v
      - name: Run bounded campaign against a real Shipyard ledger
        run: |
          DB="$(mktemp --suffix=.sqlite3)"
          rm -f "$DB"
          python - <<PY
          from design_ledger import DesignLedger
          from qualification.synthesis.generative_shipyard_campaign import run_and_persist_wayfarer_campaign
          with DesignLedger("$DB"):
              pass
          r=run_and_persist_wayfarer_campaign("$DB",2226)
          assert r['candidate_count']==10
          assert r['survivor_count']==6
          assert r['rejected_count']==4
          assert r['pareto_count']==4
          assert r['visual_asset_count']==6
          assert r['interpretation']=='FIRST_BOUNDED_ITERATIVE_SHIPBUILDING_CAMPAIGN_CLOSED'
          assert r['flight_dynamics_authority'] is False
          assert r['dynamics_differentiation']['translational_mission_behavior_differentiated'] is False
          print('CAMPAIGN:',r['campaign_id'])
          print('BLOCKER:',r['next_blocker'])
          PY
