name: "Wayfarer crown kT true BRep geometry and bow clashes"
on:
  pull_request:
    paths:
      - wayfarer/lab/crown_geom_v25.py
      - wayfarer/lab/glazing_geom_v251.py
      - .github/workflows/wayfarer-crown-brep.yml
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - wayfarer/lab/crown_geom_v25.py
permissions:
  contents: write
jobs:
  crown:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm pinned geometry/source before CAD
        shell: bash
        run: |
          set -euo pipefail
          echo '88ce19fc8bc4c487b1ad96e2edb1bed17f36188a445070af238afdffada181c1  wayfarer/results/out/wayfarer_v05_geometry.json' | sha256sum -c -
          test "$(git rev-list -n 1 canon-v2.5)" = bfa7dcfb12358b119d5e63773f30ed9d251a43fc
      - name: Full existing G1-G12/D9 certification, unchanged source
        shell: bash
        run: |
          set -euo pipefail
          python -u wayfarer/lab/certify.py | tee crown-baseline-cert.log
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('wayfarer/results/out/certification_report.json').read_text())
          assert p['certified'] is True
          assert p['geometry_sha256']=='88ce19fc8bc4c487b1ad96e2edb1bed17f36188a445070af238afdffada181c1'
          print('CROWN_BASELINE_FULL_CERT_PASS_NO_NEW_CROWN_CREDIT')
          PY
      - name: Pinned G3 installed STEP source regeneration, no output promoted
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build123d==0.13.0
          base=ea50354e222e77d145a6bbbf49227506d2b560fd
          source="$RUNNER_TEMP/loom156/projects/wayfarer_brep_pilot"
          mkdir -p "$source"
          git show "$base:wayfarer/results/out/wayfarer_v05_geometry.json" > "$source/geometry_base.json"
          git show "$base:wayfarer/config/wayfarer_v05_inputs.json" > "$source/inputs_base.json"
          git show "$base:wayfarer/config/cert_criteria.json" > "$source/criteria_base.json"
          cp wayfarer/lab/packing_phase1b/source_brep_pilot.py "$source/pilot.py"
          cp wayfarer/lab/packing_phase1b/source_brep_triage.py "$source/triage.py"
          pinned=wayfarer/lab/packing_phase1b/pinned_main_lab
          mkdir -p "$pinned"
          git show "$base:wayfarer/lab/build_v05.py" > "$pinned/build_v05.py"
          git show "$base:wayfarer/lab/certify.py" > "$pinned/certify.py"
          git show "$base:wayfarer/lab/torch/torch_heat_results.json" > "$pinned/torch_heat_results.json"
          python -u wayfarer/lab/packing_phase1b/source_candidate_rebuild.py \
            --source "$source" --out "$RUNNER_TEMP/rebuild" \
            --courier-forward --fuel-t 3.8 --house-reserve-t .1 \
            --g1-liquid-ullage --export | tee crown-source-rebuild.log
          python - <<'PY'
          from pathlib import Path
          import gzip, json, os, shutil
          out=Path(os.environ["RUNNER_TEMP"])/"rebuild"
          dest=Path("wayfarer/lab/packing_phase1b")
          assert json.loads((out/"candidate_report.json").read_text())["candidate_pass"]
          with (out/"candidate.step").open("rb") as r, (dest/"current_g3_3p8_forward.step.gz").open("wb") as w:
              with gzip.GzipFile(fileobj=w, mode="wb", filename="", mtime=0) as gz:
                  shutil.copyfileobj(r, gz)
          shutil.copy2(out/"candidate_report.json", dest/"current_g3_rebuild_report.json")
          print("CROWN_STEP_REBUILD_G3_READY")
          PY
      - name: Generate true crown BRep panes, domes, AOI cavity and bow clash report
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build123d==0.13.0
          python -u wayfarer/lab/crown_geom_v25.py | tee crown-brep.log
      - name: Screen seven rigid spare panes against installed solids in two bay-wall racks
        shell: bash
        run: |
          set -euo pipefail
          python -u wayfarer/lab/crown_spares_screen.py | tee crown-spares.log
      - name: Volume times material density crown mass and all six mode delta-v
        shell: bash
        run: |
          set -euo pipefail
          python -u wayfarer/lab/crown_mass_screen.py | tee crown-mass.log
      - name: Verify candidate D9 and WWS-1 counts against fixed source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path("wayfarer/render/out/wayfarer_crown_parts_v252_88ce19fc_report.json").read_text())
          assert v["full_D9_candidate_accepts"]
          assert v["full_D9_candidate_scan"]["category_d_count"] == 0
          assert not v["full_D9_candidate_scan"]["collision_errors"]
          assert v["per_part_GLTF_nodes"] == 373
          assert v["drawing_revision"] == "canon-v2.5.2"
          assert v["overall_length_m_unchanged"] == 54.5
          assert v["all_internal_parts_inside_pressure_hull"]["pass_containment"] is True
          assert v["all_internal_parts_inside_pressure_hull"]["escaped_parts"] == []
          assert v["option_c_armour_shoulder_fairing"]["authored_gore_count"] == 16
          assert abs(v["option_c_armour_shoulder_fairing"]["seam_step_at_pane_m"]) < 1e-9
          assert abs(v["option_c_armour_shoulder_fairing"]["seam_step_at_cylinder_m"]) < 1e-9
          assert v["outfit_L1_relocation"]["mass_rebooked_t"] == 0
          assert v["exterior_crown_brow_named_solid"] is True
          assert v["osteon_dome_seat_preserved"] is True
          assert v["exterior_crown_brow"]["radial_span_m"] == [3.4, 3.75]
          assert v["glazing"]["round_assemblies"] == 21
          assert v["glazing"]["viewport_band_segments"] == 5
          assert v["glazing"]["spare_true_solids"] == 7
          assert v["glazing"]["storm_shelter_windows"] == 0
          assert v["canonical_source_mass_t_before_and_after"] == 868.1922552640087
          assert v["delta_v_ECON_km_s_unchanged"] == 707.845
          assert Path("wayfarer/render/out/crown_print_tiles/crown_brow.stl").is_file()
          assert Path("wayfarer/render/out/crown_option_c_shoulder_v252.stl").is_file()
          assert len(list(Path("wayfarer/render/out/glazing_print_parts").glob("*.stl"))) == 137
          print("OPTION_C_FAIRING_CONTAINMENT_V252_D9_PASS")
          PY
      - name: Preserve printable pane STLs and per-part GLB on draft PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- wayfarer/render/out/crown_option_c_shoulder_v252.stl \
            wayfarer/render/out/wayfarer_crown_parts_v252_88ce19fc.glb \
            wayfarer/render/out/wayfarer_crown_parts_v252_88ce19fc_report.json \
            wayfarer/results/out/crown_seven_spares_bay_options.json \
            wayfarer/results/out/crown_solid_mass_modes_screen.json \
            wayfarer/render/out/crown_print_tiles/*.stl \
            wayfarer/render/out/glazing_print_parts/*.stl
          test "$(find wayfarer/render/out/crown_print_tiles -name 'crown_pane_*.stl' | wc -l)" -eq 37
          test "$(find wayfarer/render/out/glazing_print_parts -name '*.stl' | wc -l)" -eq 137
          git diff --cached --name-only | tee crown-output-changes.txt
          test "$(git diff --cached --name-only | wc -l)" -ge 1
          git commit -m 'class:engineering: preserve crown BRep overlay and bow-fit evidence'
          # Generated source STEP/certification scratch outputs are not part of this
          # artifact commit. Discard ONLY unstaged tracked runner byproducts so
          # rebase can preserve any concurrent documentation commits.
          git restore --worktree -- .
          # Preserve unrelated documentation commits that may have advanced the
          # PR branch while this deterministic BRep job was running.
          git fetch origin "${{ github.head_ref }}"
          git rebase "origin/${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Retain evidence even when CAD fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crown-true-solids-bow-fit
          if-no-files-found: warn
          path: |
            crown-baseline-cert.log
            crown-brep.log
            crown-spares.log
            crown-mass.log
            wayfarer/results/out/crown_solid_mass_modes_screen.json
            wayfarer/results/out/crown_seven_spares_bay_options.json
            crown-source-rebuild.log
            wayfarer/render/out/wayfarer_crown_parts_v252_88ce19fc.glb
            wayfarer/render/out/crown_option_c_shoulder_v252.stl
            wayfarer/render/out/wayfarer_crown_parts_v252_88ce19fc_report.json
            wayfarer/render/out/crown_print_tiles/*.stl
            wayfarer/render/out/glazing_print_parts/*.stl

  tag_geometry_release:
    # Only a merged, fully exported v2.5.2 main commit may be tagged.
    # Tags are the two explicitly requested release refs, not a new design.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release candidate and create both missing annotated tags
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("wayfarer/render/out/wayfarer_crown_parts_v252_88ce19fc_report.json")
          r=json.loads(p.read_text())
          assert r["drawing_revision"]=="canon-v2.5.2"
          assert r["full_D9_candidate_accepts"]
          assert r["full_D9_candidate_scan"]["category_d_count"]==0
          assert not r["full_D9_candidate_scan"]["collision_errors"]
          assert r["all_internal_parts_inside_pressure_hull"]["pass_containment"]
          assert r["overall_length_m_unchanged"]==54.5
          assert r["canonical_source_mass_t_before_and_after"]==868.1922552640087
          assert r["delta_v_ECON_km_s_unchanged"]==707.845
          assert Path("wayfarer/render/out/wayfarer_crown_parts_v252_88ce19fc.glb").is_file()
          print("CANON_V252_MERGE_ARTIFACT_CHECK_PASS")
          PY
          git fetch --tags origin
          old=f42f897756a91affc6d8531bcfa94dde1e9917a9
          git merge-base --is-ancestor "$old" "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet refs/tags/canon-v2.5.1; then
            test "$(git rev-list -n 1 canon-v2.5.1)" = "$old"
          else
            git tag -a canon-v2.5.1 "$old" -m 'kT Wayfarer canon-v2.5.1: all glazing and crown brow geometry'
            git push origin refs/tags/canon-v2.5.1
          fi
          if git show-ref --verify --quiet refs/tags/canon-v2.5.2; then
            test "$(git rev-list -n 1 canon-v2.5.2)" = "$GITHUB_SHA"
          else
            git tag -a canon-v2.5.2 "$GITHUB_SHA" -m 'kT Wayfarer canon-v2.5.2: Option C fairing and internal containment'
            git push origin refs/tags/canon-v2.5.2
          fi
          echo CANON_V251_V252_TAGS_VERIFIED
