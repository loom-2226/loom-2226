name: Wayfarer L1 #520 seven-unit wall fit-out D9 containment
on:
  pull_request:
    paths:
      - wayfarer/lab/l1_wallfit_integrate.py
      - wayfarer/config/kt_decisions.json
      - .github/workflows/wayfarer-L1-wallfit.yml
permissions:
  contents: write
concurrency:
  group: wayfarer-L1-wallfit-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  import:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'engineering/wayfarer-l1-wallfit-')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source geometry and FCL dependencies
        run: python -m pip install build123d==0.13.0 python-fcl==0.7.0.11 numpy
      - name: Run exact approved generator, import seven units and D9 both poses
        run: python -u wayfarer/lab/l1_wallfit_integrate.py
      - name: Verify resulting standalone L1 GLB, mass and checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,struct
          report=json.loads(Path('wayfarer/render/out/interior_L1_report.json').read_text())
          src=Path('wayfarer/render/out/interior_L1.glb').read_bytes()
          assert src[:4]==b'glTF' and struct.unpack_from('<I',src,8)[0]==len(src)
          n,kind=struct.unpack_from('<II',src,12);assert kind==0x4e4f534a
          gl=json.loads(src[20:20+n])
          assert report['status']=='L1_B3_WALLFIT_SEVEN_D9_CONTAINMENT_PASS'
          assert report['glb_sha256']==hashlib.sha256(src).hexdigest()
          wf=report['wallfit']
          assert wf['source_pr']==520 and len(wf['units'])==7
          assert wf['mass_owner']=='outfit_L1' and wf['estimated_wallfit_t']==.358
          assert wf['outfit_L1_booked_t']>.358
          assert wf['source_mass_rebooking_t']==0 and wf['exterior_modified']==0
          assert abs(wf['room_L1_command_unchanged_t']-2.1497778356968475)<1e-8
          for mode in ('halo_closed','wings_open_centre_back'):
              p=wf['pose_checks'][mode]
              assert p['D9_category_d']==0 and not p['contacts']
              assert p['containment']=='PASS' and p['minimum_inner_shell_margin_m']>=0
              assert p['new_units']==7
          nodes=[v for v in gl['nodes'] if v.get('name','').startswith('dry:L1_wallfit_')]
          assert len(nodes)==7
          assert {v['name'] for v in nodes}==set(wf['units'])
          for node in nodes:
              e=node['extras']
              assert e['source_mass_owner_id']=='outfit_L1' and e['node_mass_rebooking_t']==0
              assert e['mass_basis']=='source_booking_reference_nonadditive'
              assert e['semantic_system']=='HABITAT' and e['semantic_subsystem']=='L1'
          seats=[v for v in gl['nodes'] if v.get('name','').startswith('dry:i4_seat_')]
          assert len(seats)==6 and len({v['mesh'] for v in seats})==1
          assert len(gl['animations'])==1 and len(gl['animations'][0]['channels'])==18
          assert report['dry_t']==868.1922552640087
          assert report['ECON_dv_km_s']==707.845
          assert not Path('wayfarer/render/out/proposal_L1_wallfit.glb').exists()
          assert gl['asset']['extras']['exterior_state_meshes_copied']==0
          assert all('mesh' not in v for v in gl['nodes'] if v.get('name') in
                     ('dry:room_L1-command','dry:outfit_L1'))
          print('WALLFIT #520 seven units, D9=0, containment PASS both poses')
          PY
          git diff --quiet -- wayfarer/render/out/wayfarer_exterior_detail_88ce19fc_*.glb
          test ! -e wayfarer/render/out/proposal_L1_wallfit.glb
      - name: Commit only L1 GLB, D9 report and 1:25 note on PASS
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- wayfarer/render/out/interior_L1.glb wayfarer/render/out/interior_L1_report.json wayfarer/docs/L1_INTERIOR_PRINT_1_25_2026_11_12.md
          if ! git diff --cached --quiet; then
            git commit -m 'class:engineering: L1 wallfit seven units D9 zero containment PASS'
            git push origin HEAD:$GITHUB_HEAD_REF
          fi
      - name: Preserve D9 STOP picture
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: WALLFIT-D9-STOP
          path: |
            wayfarer/render/out/interior_L1_wallfit_D9_STOP.svg
            wayfarer/render/out/interior_L1_wallfit_STOP_report.json
          if-no-files-found: warn
