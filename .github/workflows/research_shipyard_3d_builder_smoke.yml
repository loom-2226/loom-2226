name: LOOM Shipyard Semantic 3D Builder Smoke

on:
  pull_request:
    paths:
      - 'tools/wayfarer_semantic_3d_smoke.py'
      - 'deploy/android/LOOM_Shipyard_3D_Test.py'
      - 'deploy/android/loom_update_shipyard.py'
      - 'manifests/shipyard_overlay_manifest.json'
      - 'qualification/synthesis/governed_ship_synthesis.py'
      - 'qualification/synthesis/semantic_geometry.py'
      - 'qualification/synthesis/wayfarer_s1_solver.py'
      - 'qualification/synthesis/wayfarer_s1_adapter.py'
      - 'qualification/synthesis/physical_design_core.py'
      - 'qualification/synthesis/physical_design_search.py'
      - '.github/workflows/research_shipyard_3d_builder_smoke.yml'
  workflow_dispatch:

jobs:
  semantic-3d-builder-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile builder, Pixel bootstrap, updater, and source modules
        run: |
          python -m py_compile \
            tools/wayfarer_semantic_3d_smoke.py \
            deploy/android/LOOM_Shipyard_3D_Test.py \
            deploy/android/loom_update_shipyard.py \
            qualification/synthesis/governed_ship_synthesis.py \
            qualification/synthesis/semantic_geometry.py \
            qualification/synthesis/wayfarer_s1_solver.py \
            qualification/synthesis/wayfarer_s1_adapter.py \
            qualification/synthesis/physical_design_core.py \
            qualification/synthesis/physical_design_search.py
      - name: Validate staging overlay manifest includes Pixel 3D builder closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('manifests/shipyard_overlay_manifest.json')
          m = json.loads(p.read_text())
          assert m['source_ref'] == 'research/computational-shipyard-3d-builder-smoke-v0.1-2026-09-09'
          paths = {x['path'] for x in m['artifacts']}
          required = {
              'deploy/android/LOOM_Shipyard_3D_Test.py',
              'tools/wayfarer_semantic_3d_smoke.py',
              'qualification/synthesis/governed_ship_synthesis.py',
              'qualification/synthesis/semantic_geometry.py',
              'qualification/synthesis/wayfarer_s1_solver.py',
              'qualification/synthesis/wayfarer_s1_adapter.py',
              'qualification/synthesis/physical_design_core.py',
              'qualification/synthesis/physical_design_search.py',
              'qualification/synthesis/WAYFARER_S0_AUTHORITY_MANIFEST_v0.1.json',
              'qualification/synthesis/WAYFARER_S1_TEST_DEFINITION_v0.1.md',
          }
          assert required <= paths
          PY
      - name: Generate standalone Wayfarer semantic 3D viewer
        run: |
          mkdir -p out/wayfarer-semantic-3d-smoke
          python tools/wayfarer_semantic_3d_smoke.py out/wayfarer-semantic-3d-smoke/wayfarer_semantic_3d_smoke.html
          cp deploy/android/LOOM_Shipyard_3D_Test.py out/wayfarer-semantic-3d-smoke/LOOM_Shipyard_3D_Test.py
          test -s out/wayfarer-semantic-3d-smoke/wayfarer_semantic_3d_smoke.html
          test -s out/wayfarer-semantic-3d-smoke/LOOM_Shipyard_3D_Test.py
          grep -q 'DERIVED_SEMANTIC_3D_SMOKE_EVIDENCE_ONLY' out/wayfarer-semantic-3d-smoke/wayfarer_semantic_3d_smoke.html
          grep -q 'ADMITTED_SPATIAL_ENVELOPE' out/wayfarer-semantic-3d-smoke/wayfarer_semantic_3d_smoke.html
          grep -q 'STRUCTURAL_HYPOTHESIS' out/wayfarer-semantic-3d-smoke/wayfarer_semantic_3d_smoke.html
          grep -q '127.0.0.1' out/wayfarer-semantic-3d-smoke/LOOM_Shipyard_3D_Test.py
      - name: Pixel bootstrap builder-discovery smoke test
        run: |
          tmpdir="$(mktemp -d)"
          LOOM_SHIPYARD_DOWNLOADS="$tmpdir" python deploy/android/LOOM_Shipyard_3D_Test.py --status
      - name: Upload Pixel-ready semantic 3D test package
        uses: actions/upload-artifact@v4
        with:
          name: wayfarer-semantic-3d-smoke-pixel
          path: out/wayfarer-semantic-3d-smoke/
