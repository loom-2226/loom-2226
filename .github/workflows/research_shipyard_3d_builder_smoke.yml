name: LOOM Shipyard Semantic 3D Builder Smoke

on:
  pull_request:
    paths:
      - 'tools/wayfarer_semantic_3d_smoke.py'
      - 'deploy/android/LOOM_Shipyard_3D_Test.py'
      - 'deploy/android/wayfarer_semantic_3d_smoke.html'
      - 'deploy/android/loom_update_shipyard.py'
      - 'manifests/shipyard_overlay_manifest.json'
      - 'qualification/synthesis/governed_ship_synthesis.py'
      - 'qualification/synthesis/semantic_geometry.py'
      - 'qualification/synthesis/wayfarer_s1_solver.py'
      - 'qualification/synthesis/wayfarer_s1_adapter.py'
      - 'qualification/synthesis/physical_design_core.py'
      - 'qualification/synthesis/physical_design_search.py'
      - '.github/workflows/research_shipyard_3d_builder_smoke.yml'
  workflow_dispatch:

jobs:
  semantic-3d-builder-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile builder, Pixel bootstrap, updater, and source modules
        run: |
          python -m py_compile \
            tools/wayfarer_semantic_3d_smoke.py \
            deploy/android/LOOM_Shipyard_3D_Test.py \
            deploy/android/loom_update_shipyard.py \
            qualification/synthesis/governed_ship_synthesis.py \
            qualification/synthesis/semantic_geometry.py \
            qualification/synthesis/wayfarer_s1_solver.py \
            qualification/synthesis/wayfarer_s1_adapter.py \
            qualification/synthesis/physical_design_core.py \
            qualification/synthesis/physical_design_search.py
      - name: Validate updater-safe staging overlay manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('manifests/shipyard_overlay_manifest.json')
          m = json.loads(p.read_text())
          assert m['source_ref'] == 'research/computational-shipyard-3d-builder-smoke-v0.1-2026-09-09'
          paths = {x['path'] for x in m['artifacts']}
          assert 'deploy/android/LOOM_Shipyard_3D_Test.py' in paths
          assert 'deploy/android/wayfarer_semantic_3d_smoke.html' in paths
          assert not any(path.startswith('tools/') for path in paths)
          assert not any(path.startswith('qualification/') for path in paths)
          PY
      - name: Regenerate semantic viewer and verify installed artifact is exact
        run: |
          mkdir -p out/wayfarer-semantic-3d-smoke
          python tools/wayfarer_semantic_3d_smoke.py out/wayfarer-semantic-3d-smoke/wayfarer_semantic_3d_smoke.html
          cmp out/wayfarer-semantic-3d-smoke/wayfarer_semantic_3d_smoke.html deploy/android/wayfarer_semantic_3d_smoke.html
          cp deploy/android/LOOM_Shipyard_3D_Test.py out/wayfarer-semantic-3d-smoke/LOOM_Shipyard_3D_Test.py
          grep -q 'DERIVED_SEMANTIC_3D_SMOKE_EVIDENCE_ONLY' deploy/android/wayfarer_semantic_3d_smoke.html
          grep -q 'ADMITTED_SPATIAL_ENVELOPE' deploy/android/wayfarer_semantic_3d_smoke.html
          grep -q 'STRUCTURAL_HYPOTHESIS' deploy/android/wayfarer_semantic_3d_smoke.html
          grep -q '127.0.0.1' deploy/android/LOOM_Shipyard_3D_Test.py
      - name: Pixel bootstrap discovery smoke test
        run: |
          LOOM_SHIPYARD_DOWNLOADS="$(mktemp -d)" python deploy/android/LOOM_Shipyard_3D_Test.py --status
      - name: Upload Pixel-ready semantic 3D test package
        uses: actions/upload-artifact@v4
        with:
          name: wayfarer-semantic-3d-smoke-pixel
          path: out/wayfarer-semantic-3d-smoke/
