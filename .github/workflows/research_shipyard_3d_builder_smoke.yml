name: LOOM Shipyard Semantic 3D Builder Smoke

on:
  pull_request:
    paths:
      - 'tools/wayfarer_semantic_3d_smoke.py'
      - 'src/tools/wayfarer_semantic_3d_smoke.py'
      - 'src/tools/wayfarer_semantic_3d_smoke_android.py'
      - 'src/qualification/synthesis/**'
      - 'deploy/android/LOOM_Shipyard_3D_Test.py'
      - 'deploy/android/loom_update_shipyard.py'
      - 'manifests/shipyard_overlay_manifest.json'
      - '.github/workflows/research_shipyard_3d_builder_smoke.yml'
  workflow_dispatch:

jobs:
  semantic-3d-builder-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile updater-safe 3D runtime
        run: |
          python -m py_compile \
            src/tools/wayfarer_semantic_3d_smoke.py \
            src/tools/wayfarer_semantic_3d_smoke_android.py \
            deploy/android/LOOM_Shipyard_3D_Test.py \
            src/qualification/synthesis/governed_ship_synthesis.py \
            src/qualification/synthesis/semantic_geometry.py \
            src/qualification/synthesis/wayfarer_s1_solver.py \
            src/qualification/synthesis/wayfarer_s1_adapter.py \
            src/qualification/synthesis/physical_design_core.py \
            src/qualification/synthesis/physical_design_search.py
      - name: Validate updater-safe staging overlay manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('manifests/shipyard_overlay_manifest.json').read_text())
          paths = {x['path'] for x in m['artifacts']}
          required = {
              'deploy/android/LOOM_Shipyard_3D_Test.py',
              'src/tools/wayfarer_semantic_3d_smoke.py',
              'src/tools/wayfarer_semantic_3d_smoke_android.py',
              'src/qualification/synthesis/governed_ship_synthesis.py',
              'src/qualification/synthesis/semantic_geometry.py',
          }
          assert required <= paths
          assert all(p.startswith(('src/','deploy/')) for p in paths)
          PY
      - name: Generate Android-safe semantic viewer
        run: |
          mkdir -p out/wayfarer-semantic-3d-smoke
          python src/tools/wayfarer_semantic_3d_smoke_android.py out/wayfarer-semantic-3d-smoke/wayfarer_semantic_3d_smoke.html
          cp deploy/android/LOOM_Shipyard_3D_Test.py out/wayfarer-semantic-3d-smoke/LOOM_Shipyard_3D_Test.py
          grep -q 'DERIVED_SEMANTIC_3D_SMOKE_EVIDENCE_ONLY' out/wayfarer-semantic-3d-smoke/wayfarer_semantic_3d_smoke.html
          grep -q 'STRUCTURAL_HYPOTHESIS' out/wayfarer-semantic-3d-smoke/wayfarer_semantic_3d_smoke.html
          python - <<'PY'
          import re
          from pathlib import Path
          s = Path('out/wayfarer-semantic-3d-smoke/wayfarer_semantic_3d_smoke.html').read_text()
          scripts = re.findall(r'<script(?:[^>]*)>(.*?)</script>', s, flags=re.S)
          Path('/tmp/shipyard-viewer.js').write_text(scripts[-1])
          PY
          node --check /tmp/shipyard-viewer.js
      - name: Pixel bootstrap builder-discovery smoke test
        run: |
          LOOM_SHIPYARD_HOME="$(mktemp -d)" python deploy/android/LOOM_Shipyard_3D_Test.py --status
      - name: Upload Pixel-ready semantic 3D test package
        uses: actions/upload-artifact@v4
        with:
          name: wayfarer-semantic-3d-smoke-pixel
          path: out/wayfarer-semantic-3d-smoke/
