name: LOOM Python Regression

on:
  push:
    branches:
      - main
      - feature/gis-navigator-convergence
      - feature/runtime-observability-foundation
      - integration/runtime-devops-convergence-2026-09-06
      - planning/navigator-gis-hud-next-phase-2026-09-06
  pull_request:
  workflow_dispatch:

jobs:
  unit-regression:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile production Python
        run: python -m compileall -q src deploy
      - name: Run unit regression suite
        run: python -m unittest discover -s tests -v
