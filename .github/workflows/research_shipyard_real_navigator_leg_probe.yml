name: LOOM Shipyard Real Navigator Leg Probe

on:
  pull_request:
    paths:
      - 'src/qualification/synthesis/shipyard_campaign_binding.py'
      - 'src/loom_navigator_core.py'
      - 'tests/test_shipyard_real_navigator_leg.py'
      - '.github/workflows/research_shipyard_real_navigator_leg_probe.yml'
  workflow_dispatch:

jobs:
  probe-real-navigator-solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve canonical M1 mission tokens and acquisition helpers
        run: |
          PYTHONPATH=src python - <<'PY' > navigator_solver_probe.txt
          import inspect
          import tempfile
          from pathlib import Path
          import loom_navigator_core as campaign

          with tempfile.TemporaryDirectory() as td:
              nav = campaign._load_core(Path(td))
              print('NAV CORE SHA:', campaign.CORE_SHA)
              print('MISSION_SCHEMA:', repr(nav.MISSION_SCHEMA))
              print('VALID_SHIPS:', repr(nav.VALID_SHIPS))
              for name in ('run_acquisition','fetch_or_cache','build_canonical_dependency_index','_route_rows_from_canonical'):
                  obj = getattr(nav, name, None)
                  print('\n===', name, '===')
                  if obj is None:
                      print('MISSING')
                  else:
                      print('SIGNATURE', inspect.signature(obj))
                      try:
                          print(inspect.getsource(obj))
                      except Exception as exc:
                          print('SOURCE_UNAVAILABLE', repr(exc))
              print('\nROUTE_OBJECTS CERES/NEPTUNE:')
              for key, value in sorted(nav.ROUTE_OBJECTS.items()):
                  probe=(str(key)+' '+repr(value)).upper()
                  if 'CERES' in probe or 'NEPTUNE' in probe or '899' in probe:
                      print(key, repr(value))
              for name in ('BASE_OBJECTS','LOCAL_OBJECTS','SOURCE_ID','SOURCE_NAME','SOURCE_URL','ACQUISITION_SCHEMA'):
                  if hasattr(nav, name):
                      print('\n', name, '=', repr(getattr(nav, name)))
          PY
          cat navigator_solver_probe.txt
      - name: Preserve probe output
        uses: actions/upload-artifact@v4
        with:
          name: navigator-solver-probe
          path: navigator_solver_probe.txt
          if-no-files-found: error
