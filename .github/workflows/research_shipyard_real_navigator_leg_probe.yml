name: LOOM Shipyard Real Navigator Leg Probe

on:
  pull_request:
    paths:
      - 'src/qualification/synthesis/shipyard_campaign_binding.py'
      - 'src/loom_navigator_core.py'
      - 'tests/test_shipyard_real_navigator_leg.py'
      - '.github/workflows/research_shipyard_real_navigator_leg_probe.yml'
  workflow_dispatch:

jobs:
  probe-real-navigator-solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect embedded Navigator solver and canonical SQLite ephemeris
        run: |
          PYTHONPATH=src python - <<'PY' > navigator_solver_probe.txt
          import inspect, sqlite3, tempfile
          from pathlib import Path
          import loom_navigator_core as campaign

          with tempfile.TemporaryDirectory() as td:
              nav = campaign._load_core(Path(td))
              print('NAV CORE SHA:', campaign.CORE_SHA)
              for name in ('_solve_leg', '_state_primary', '_route_rows_from_canonical', 'build_canonical_dependency_index', 'run_acquisition'):
                  obj = getattr(nav, name, None)
                  print(f'\n=== {name} ===')
                  if obj is None:
                      print('MISSING'); continue
                  print('SIGNATURE:', inspect.signature(obj))
                  try: print(inspect.getsource(obj))
                  except (OSError, TypeError): print('SOURCE UNAVAILABLE')
              print('\n=== CANONICAL SQLITE EPHEMERIS ===')
              db=Path('data/LOOM_2226.sqlite3')
              con=sqlite3.connect(db)
              for token in ('CERES','NEPTUNE'):
                  rows=con.execute("SELECT epoch_utc,reference_frame,reference_plane,source,navigation_grade,x_au,y_au,z_au,vx_au_d,vy_au_d,vz_au_d FROM states WHERE entity_id=? ORDER BY epoch_utc",(token,)).fetchall()
                  print(token,'ROW_COUNT',len(rows))
                  if rows:
                      print('FIRST',rows[0]); print('LAST',rows[-1])
                      print('NAV_GRADE_COUNT',sum(bool(r[4]) for r in rows))
                      print('EPOCH_SAMPLE',[r[0] for r in rows[:5]])
              con.close()
          PY
          cat navigator_solver_probe.txt
      - name: Preserve probe output
        uses: actions/upload-artifact@v4
        with:
          name: navigator-solver-probe
          path: navigator_solver_probe.txt
          if-no-files-found: error
