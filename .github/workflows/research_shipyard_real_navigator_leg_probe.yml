name: LOOM Shipyard Real Navigator Leg Probe

on:
  pull_request:
    paths:
      - 'src/qualification/synthesis/shipyard_campaign_binding.py'
      - 'src/loom_navigator_core.py'
      - 'tests/test_shipyard_real_navigator_leg.py'
      - '.github/workflows/research_shipyard_real_navigator_leg_probe.yml'
  workflow_dispatch:

jobs:
  probe-real-navigator-solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve canonical M1 mission tokens
        run: |
          PYTHONPATH=src python - <<'PY' > navigator_solver_probe.txt
          import tempfile
          from pathlib import Path
          import loom_navigator_core as campaign

          with tempfile.TemporaryDirectory() as td:
              nav = campaign._load_core(Path(td))
              print('NAV CORE SHA:', campaign.CORE_SHA)
              print('MISSION_SCHEMA:', repr(nav.MISSION_SCHEMA))
              print('VALID_SHIPS:', repr(nav.VALID_SHIPS))
              print('ROUTE_OBJECTS containing NEP:')
              for key, value in sorted(nav.ROUTE_OBJECTS.items()):
                  probe=(str(key)+' '+repr(value)).upper()
                  if 'NEP' in probe or '899' in probe:
                      print(key, repr(value))
              print('ROUTE_OBJECTS containing CERES:')
              for key, value in sorted(nav.ROUTE_OBJECTS.items()):
                  if 'CERES' in (str(key)+' '+repr(value)).upper() or repr(value).find("'CE'") >= 0:
                      print(key, repr(value))
              print('ALL BASE ROUTE OBJECTS:')
              for key, value in sorted(nav.ROUTE_OBJECTS.items()):
                  if value.get('kind') == 'base':
                      print(key, repr(value))
          PY
          cat navigator_solver_probe.txt
      - name: Preserve probe output
        uses: actions/upload-artifact@v4
        with:
          name: navigator-solver-probe
          path: navigator_solver_probe.txt
          if-no-files-found: error
