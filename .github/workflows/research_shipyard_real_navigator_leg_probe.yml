name: LOOM Shipyard Real Navigator Leg Probe

on:
  pull_request:
    paths:
      - 'src/qualification/synthesis/shipyard_campaign_binding.py'
      - 'src/loom_navigator_core.py'
      - 'tests/test_shipyard_real_navigator_leg.py'
      - '.github/workflows/research_shipyard_real_navigator_leg_probe.yml'
  workflow_dispatch:

jobs:
  probe-real-navigator-solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect embedded Navigator solver boundary
        run: |
          PYTHONPATH=src python - <<'PY' > navigator_solver_probe.txt
          import inspect
          import tempfile
          from pathlib import Path
          import loom_navigator_core as campaign

          with tempfile.TemporaryDirectory() as td:
              nav = campaign._load_core(Path(td))
              print('NAV CORE SHA:', campaign.CORE_SHA)
              for name in ('_solve_leg', '_state_primary', '_pos_km', '_vel_km_s', '_torch_burn', '_burn_displacement', '_metric_time_s'):
                  obj = getattr(nav, name, None)
                  print(f'\n=== {name} ===')
                  if obj is None:
                      print('MISSING')
                      continue
                  print('SIGNATURE:', inspect.signature(obj))
                  try:
                      print(inspect.getsource(obj))
                  except (OSError, TypeError):
                      print('SOURCE UNAVAILABLE')
              print('\n=== MODES ===')
              print('METRIC_MODES:', repr(nav.METRIC_MODES))
              print('TORCH_MODES:', repr(nav.TORCH_MODES))
              print('NAV_V1_A:', repr(nav.NAV_V1_A))
          PY
          cat navigator_solver_probe.txt
      - name: Preserve probe output
        uses: actions/upload-artifact@v4
        with:
          name: navigator-solver-probe
          path: navigator_solver_probe.txt
          if-no-files-found: error
