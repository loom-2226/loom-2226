name: LOOM Ephemeris Provider Qualification

on:
  push:
    branches:
      - feature/gis-navigator-convergence
  workflow_dispatch: {}

jobs:
  horizons-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit-test provider probe
        run: python -m unittest discover -s tests -p "test_horizons_provider_probe.py" -v

      - name: Acquire JPL Horizons vectors
        run: python tools/horizons_provider_probe.py --epoch "2226-08-22 00:00" --output artifacts/horizons_provider_probe.json

      - name: Print normalized artifact
        run: cat artifacts/horizons_provider_probe.json

      - name: Upload normalized provider artifact
        uses: actions/upload-artifact@v4
        with:
          name: loom-horizons-provider-probe
          path: artifacts/horizons_provider_probe.json
          if-no-files-found: error
          retention-days: 30
