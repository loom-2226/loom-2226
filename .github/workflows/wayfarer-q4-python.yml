name: Wayfarer Q4 Python

on:
  pull_request:
    paths:
      - 'src/wayfarer_*.py'
      - 'tests/test_wayfarer_*.py'
      - 'engineering/current/wayfarer_q5_power_thermal_envelope_v0.2.json'
      - '.github/workflows/wayfarer-q4-python.yml'

permissions:
  contents: read

jobs:
  q4-python:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Q4/Q5 actuator regression
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q
          tests/test_wayfarer_q4_mass_states.py
          tests/test_wayfarer_q4_rigid_body.py
          tests/test_wayfarer_q4_hud_envelope_v04.py
          tests/test_wayfarer_rcs_placement.py
          tests/test_wayfarer_rcs_control.py
          tests/test_wayfarer_rcs_allocation.py
          tests/test_wayfarer_rcs_plume_screen.py
          tests/test_wayfarer_rcs_combined_maneuvers.py
          tests/test_wayfarer_rcs_gimbal_realizability.py
          tests/test_wayfarer_q5_rcs_duty.py
