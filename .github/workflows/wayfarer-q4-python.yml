name: Wayfarer Q4 Python

on:
  pull_request:
    paths:
      - 'src/wayfarer_*.py'
      - 'tests/test_wayfarer_*.py'
      - '.github/workflows/wayfarer-q4-python.yml'

permissions:
  contents: read

jobs:
  q4-python:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Wayfarer Python regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_wayfarer_*.py
