name: Wayfarer drone bay committed-six-state integrity check
on:
  pull_request:
    paths:
      - .github/workflows/wayfarer-bay-verify.yml
      - wayfarer/render/out/wayfarer_bay_fullship_88ce19fc_*.glb
      - wayfarer/render/out/wayfarer_bay_fullship_88ce19fc_report.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check on-branch GLB hashes, every node extras, fit and mass invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json,struct
          from pathlib import Path
          root=Path("wayfarer/render/out")
          p=root/"wayfarer_bay_fullship_88ce19fc_report.json"
          r=json.loads(p.read_text())
          b=json.loads((root/"wayfarer_drone_bay_fit_20261110.json").read_text())
          assert r["status"]=="BAY_FULL_SHIP_3X2_D9_AND_CONTAINMENT_PASS"
          assert r["chosen_layout"]=="axial_aft_fallback"==b["chosen"]
          assert not b["variants"]["tangential_radial"]["pass_BRep_fit"]
          assert b["variants"]["axial_aft_fallback"]["pass_BRep_fit"]
          assert r["source_dry_mass_t"]==868.1922552640087
          assert r["ECON_dv_km_s"]==707.845
          assert r["source_mass_ledger_changed_t"]==0
          assert r["named_unlocated_courier_systems_remainder_t"]==6.450370894400045
          assert r["spare_panes_remain_original_approved_x_m"]==[20,22.6]
          assert r["BRep_bay_parts"]==25
          assert (Path("wayfarer")/r["bay_components_step"]).stat().st_size>100
          assert set(r["modes"])=={"stowed","metric_hard","torch"}
          counts={"stowed":474,"metric_hard":478,"torch":534}
          for mode,data in r["modes"].items():
              assert data["pressure_containment"]["pass_containment"]
              assert not data["door_open_sweep_clashes"]
              assert set(data["gores"])=={"stowed","closed"}
              for pose,g in data["gores"].items():
                  assert g["part_count"]==counts[mode]
                  assert g["pair_count"]==counts[mode]*(counts[mode]-1)//2
                  assert g["category_d_count"]==0 and g["boolean_errors"]==0
                  assert g["containment_pass"] and g["door_open_sweep_pass"]
                  raw=(Path("wayfarer")/g["glb"]).read_bytes()
                  assert hashlib.sha256(raw).hexdigest()==g["gltf_extras"]["raw_glb_sha256"]
                  assert raw[:4]==b"glTF" and struct.unpack_from("<I",raw,8)[0]==len(raw)
                  n,kind=struct.unpack_from("<II",raw,12)
                  assert kind==0x4e4f534a
                  nodes=json.loads(raw[20:20+n])["nodes"]
                  assert all("extras" in v for v in nodes)
                  meshes=[v for v in nodes if "mesh" in v]
                  assert len(meshes)==g["part_count"]==g["gltf_extras"]["mesh_nodes_with_extras"]
                  assert all(v["extras"]["node_mass_rebooking_t"]==0 for v in meshes)
                  assert sum(1 for v in meshes if v["name"].startswith("dry:crown_spare_"))==7
                  print("VERIFIED_BAY_CAD",mode,pose,len(meshes),g["pair_count"])
          print("BAY_ALL_SIX_COMMITTED_GLBS_INTACT_NO_ZIP")
          PY
