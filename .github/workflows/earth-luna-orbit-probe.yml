name: Earth-Luna Orbit Probe

on:
  push:
    branches:
      - feature/earth-luna-spatial-infrastructure-v0.1-2026-09-12
    paths:
      - '.github/workflows/earth-luna-orbit-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect representative WORLD orbit rows
        run: |
          python - <<'PY'
          import json, sqlite3
          ids=('EAR-O01','EAR-O03','EAR-O05','LOR-P01')
          c=sqlite3.connect('data/LOOM_2226.sqlite3'); c.row_factory=sqlite3.Row
          for eid in ids:
              print('ENTITY',eid)
              loc=c.execute('SELECT * FROM entity_location_models WHERE entity_id=?',(eid,)).fetchone()
              orb=c.execute('SELECT * FROM orbit_geometry_models WHERE entity_id=?',(eid,)).fetchone()
              print('LOCATION',json.dumps(dict(loc),sort_keys=True,default=str))
              print('ORBIT',json.dumps(dict(orb),sort_keys=True,default=str))
          for bid in ('EA','LU'):
              print('BODY',bid)
              for table in ('celestial_properties','celestial_dynamics'):
                  row=c.execute(f'SELECT * FROM {table} WHERE entity_id=?',(bid,)).fetchone()
                  print(table,json.dumps(dict(row) if row else None,sort_keys=True,default=str))
          PY
