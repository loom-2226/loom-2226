name: Inspector Pages preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/inspector/**'
      - 'tools/build_inspector_pages.py'
      - '.github/workflows/inspector-pages-preview.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download existing immutable media release asset
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/LOOM_2226_media.sqlite3 'https://github.com/loom-2226/loom-2226/releases/download/v0.1.0-runtime-baseline/LOOM_2226_media.sqlite3'
          echo '286873428afbf30b91bdb2e71b55146ed5979873cfd6af69579c121b724eb038  /tmp/LOOM_2226_media.sqlite3' | sha256sum --check
      - name: Generate allowlisted media-only Inspector preview
        run: |
          python tools/build_inspector_pages.py --world data/LOOM_2226.sqlite3 --media /tmp/LOOM_2226_media.sqlite3 --output docs/inspector
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('docs/inspector')
          data=json.loads((root/'catalog.json').read_text())
          assert data['status']=='APPROVED_FOR_PUBLICATION'
          assert len(data['assets'])==182
          assert all((root/a['original']).is_file() and (root/a['thumbnail']).is_file() for a in data['assets'])
          assert (root/'index.html').is_file()
          print('Inspector preview validated: 182 assets and browser files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: inspector-pages-preview
          path: docs/inspector/
          retention-days: 7
