name: LOOM Shipyard Semantic GLB v0.1

on:
  pull_request:
    paths:
      - 'qualification/synthesis/semantic_glb.py'
      - 'qualification/synthesis/semantic_geometry.py'
      - 'qualification/synthesis/governed_ship_synthesis.py'
      - 'tests/test_semantic_glb.py'
      - 'tools/wayfarer_semantic_glb_export.py'
      - '.github/workflows/research_shipyard_semantic_glb.yml'
  workflow_dispatch:

jobs:
  semantic-glb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile semantic GLB path
        run: |
          python -m py_compile \
            qualification/synthesis/semantic_glb.py \
            tools/wayfarer_semantic_glb_export.py \
            tests/test_semantic_glb.py
      - name: Run semantic GLB regression
        run: python tests/test_semantic_glb.py -v
      - name: Export deterministic Wayfarer semantic GLB
        run: python tools/wayfarer_semantic_glb_export.py out/wayfarer-semantic-glb
      - name: Validate GLB header and authority manifest
        run: |
          python - <<'PY'
          import json, struct
          from pathlib import Path
          p = Path('out/wayfarer-semantic-glb/wayfarer_semantic.glb')
          data = p.read_bytes()
          magic, version, total = struct.unpack_from('<4sII', data, 0)
          assert magic == b'glTF'
          assert version == 2
          assert total == len(data)
          m = json.loads(Path('out/wayfarer-semantic-glb/wayfarer_semantic_glb_manifest.json').read_text())
          assert m['authority_status'] == 'DERIVED_ENGINEERING_TRACEABLE_GLB_ONLY'
          assert m['flight_dynamics_authority'] is False
          assert m['canon_changed'] is False
          assert m['production_shipclasses_changed'] is False
          PY
      - name: Upload semantic GLB artifact
        uses: actions/upload-artifact@v4
        with:
          name: wayfarer-semantic-glb-v0.1
          path: out/wayfarer-semantic-glb/
