name: LOOM Research Shipyard Phase 11 Remass Feed Physics Bounds

on:
  pull_request:
    branches:
      - research/computational-shipyard-phase10-remass-feed-decomposition-v0.1-2026-09-09
    paths:
      - 'src/shipyard_phase11_remass_feed_bounds.py'
      - 'deploy/android/loom_update_shipyard.py'
      - 'manifests/shipyard_overlay_manifest.json'
      - 'tests/test_wayfarer_phase11_remass_feed_bounds.py'
      - '.github/workflows/research_shipyard_phase11_remass_feed_bounds.yml'

jobs:
  validate-phase11:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Phase 11 and updater
        run: python -m py_compile src/shipyard_phase11_remass_feed_bounds.py deploy/android/loom_update_shipyard.py
      - name: Run Phase-11 focused tests
        run: python tests/test_wayfarer_phase11_remass_feed_bounds.py
      - name: Verify Shipyard overlay manifest digests
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.')
          manifest=json.loads((root/'manifests/shipyard_overlay_manifest.json').read_text())
          assert manifest['source_ref'] == 'research/computational-shipyard-phase11-remass-feed-physics-bounds-v0.1-2026-09-09'
          for row in manifest['artifacts']:
              data=(root/row['path']).read_bytes()
              actual=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert actual == row['git_blob_sha1'], (row['path'], actual, row['git_blob_sha1'])
          print('OVERLAY_ARTIFACTS', len(manifest['artifacts']))
          PY
