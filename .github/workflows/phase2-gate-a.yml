name: LOOM Phase 2 Gate A

on:
  push:
    branches:
      - feature/gis-navigator-convergence
    paths:
      - 'src/loom/navigation/**'
      - 'src/loom_navigator.py'
      - 'tools/phase2_gate_a_qualify.py'
      - '.github/workflows/phase2-gate-a.yml'
  workflow_dispatch:

jobs:
  frozen-runtime-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen Navigator provider dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Download frozen Pixel pre-clean runtime archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.1.0-runtime-baseline --pattern 'LOOM_2226_Pixel_PreClean_Runtime_Archive_2026-09-03.zip' --dir frozen
      - name: Extract frozen runtime
        run: |
          mkdir -p frozen/runtime
          unzip -q frozen/LOOM_2226_Pixel_PreClean_Runtime_Archive_2026-09-03.zip -d frozen/runtime
      - name: Run frozen legacy MVP/K1 self-tests
        env:
          LOOM_HOME: ${{ github.workspace }}/frozen/runtime
        run: |
          python src/loom_navigator.py --mvp-self-test
          python src/loom_navigator.py --k1-self-test
      - name: Run frozen CIVSTATE self-test
        env:
          LOOM_HOME: ${{ github.workspace }}/frozen/runtime
        run: |
          CIVSTATE="$(python - <<'PY'
          from pathlib import Path
          import hashlib
          expected='9ef530bdc1b8d867fe217a8c6d3a05e3926b0b09b0d66a91ce090b3e52fae560'
          for p in Path('frozen/runtime').rglob('LOOM_2226_CIVSTATE.sqlite3'):
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              print(f'CANDIDATE {got} {p}', file=__import__('sys').stderr)
              if got==expected:
                  print(p)
                  break
          PY
          )"
          test -n "$CIVSTATE"
          echo "SELECTED CIVSTATE=$CIVSTATE"
          python src/loom_navigator.py --civstate-self-test "$CIVSTATE"
      - name: Run Gate A replay and execution-state equivalence
        env:
          LOOM_HOME: ${{ github.workspace }}/frozen/runtime
        run: python tools/phase2_gate_a_qualify.py frozen/runtime
