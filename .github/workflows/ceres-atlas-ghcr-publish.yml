name: Ceres Atlas private GHCR publication

on:
  push:
    branches:
      - engineering/ceres-atlas-docker-qualification-20260919
    paths:
      - '.github/workflows/ceres-atlas-ghcr-publish.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/loom-2226/ceres-atlas
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 7a794dd236870a12f0f8f2255c99b84735784747
          persist-credentials: false
      - name: Verify qualified source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7a794dd236870a12f0f8f2255c99b84735784747
      - name: Build and publish immutable source tag
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build --pull --tag "$IMAGE:sha-7a794dd236870a12f0f8f2255c99b84735784747" .
          docker push "$IMAGE:sha-7a794dd236870a12f0f8f2255c99b84735784747" | tee "$RUNNER_TEMP/push.log"
      - name: Confirm package is private and capture registry digest
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            https://ghcr.io/v2/loom-2226/ceres-atlas/manifests/sha-7a794dd236870a12f0f8f2255c99b84735784747)"
          echo "Anonymous GHCR manifest status: $status"
          test "$status" = 401
          digest="$(awk '/ digest: sha256:/ {print $3; exit}' "$RUNNER_TEMP/push.log")"
          echo "Registry digest: $digest"
          case "$digest" in sha256:*) ;; *) echo "Invalid registry digest" >&2; exit 1 ;; esac
          printf 'REGISTRY_DIGEST=%s\n' "$digest" >> "$GITHUB_ENV"
          {
            echo "schema_version: 1"
            echo "package: $IMAGE"
            echo "visibility: private"
            echo "source_commit: 7a794dd236870a12f0f8f2255c99b84735784747"
            echo "image_tag: sha-7a794dd236870a12f0f8f2255c99b84735784747"
            echo "registry_manifest_digest: $digest"
            echo "canonical_databases_published: false"
            echo "media_blobs_published: false"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Pull by registry digest and verify container
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$REGISTRY_DIGEST"
          fixture="$RUNNER_TEMP/ceres-atlas-fixture"
          mkdir -p "$fixture"
          cp data/LOOM_2226.sqlite3 "$fixture/world.sqlite3"
          cp data/LOOM_2226_CIVSTATE.sqlite3 "$fixture/civstate.sqlite3"
          python tests/create_ceres_media_fixture.py "$fixture/media.sqlite3"
          chmod a+r "$fixture"/*.sqlite3
          docker run --detach --name ceres-atlas-ghcr-verify \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m --publish 8768:8768 \
            --volume "$fixture:/data:ro" \
            --env CERES_WORLD_DB=/data/world.sqlite3 \
            --env CERES_CIVSTATE_DB=/data/civstate.sqlite3 \
            --env CERES_MEDIA_DB=/data/media.sqlite3 \
            "$IMAGE@$REGISTRY_DIGEST"
          trap 'docker rm --force ceres-atlas-ghcr-verify || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8768/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8768/atlas-data.json | jq -e '.world.entity_id == "CER" and (.facilities | length == 5)'
          curl --fail --silent --output "$RUNNER_TEMP/hero.png" http://127.0.0.1:8768/assets/ceres-world-hero.png
          test "$(sha256sum "$RUNNER_TEMP/hero.png" | cut -d' ' -f1)" = fa5fc5876d8f66631837ce498d77e139444b9247e8b2a66ff6dd8ad611e1f08e
          echo 'Pulled registry digest passed health, Atlas projection and MEDIA HERO verification.' >> "$GITHUB_STEP_SUMMARY"
