name: LOOM Shipyard Campaign Binding

on:
  pull_request:
    paths:
      - 'src/qualification/synthesis/shipyard_campaign_binding.py'
      - 'src/qualification/synthesis/vehicle_dynamics_contract.py'
      - 'src/loom_navigator_core.py'
      - 'tests/test_shipyard_campaign_binding.py'
      - '.github/workflows/research_shipyard_campaign_binding.yml'
  workflow_dispatch:

jobs:
  shipyard-campaign-binding:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/src/qualification/synthesis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile binding gate
        run: python -m py_compile src/qualification/synthesis/shipyard_campaign_binding.py
      - name: Bind Shipyard contract to live Navigator campaign state
        run: python -m unittest tests.test_shipyard_campaign_binding -v
