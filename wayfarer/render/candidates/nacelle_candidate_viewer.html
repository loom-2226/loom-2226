<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayfarer 2226 | Nacelle Candidate</title>
<style>
body{background:#0d131c;color:#f0f3f5;font:16px system-ui,sans-serif;margin:0}
header{padding:1rem 1.3rem;display:flex;align-items:center;flex-wrap:wrap;gap:1rem}
h1{font-size:1.2rem;margin:0}
button{border:1px solid #768b99;border-radius:6px;background:#202e3c;color:white;padding:.6rem 1rem;font:inherit;cursor:pointer}
button[aria-pressed=true]{background:#216e7c;border-color:#81dde5}
model-viewer{width:100%;height:75vh;background:#182333}
p{color:#bdcad1;margin:0 1.3rem 1.2rem;font-size:.84rem}
</style>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<header>
<h1>WAYFARER 2226 · NACELLE CANDIDATE</h1>
<button id="torch" type="button" aria-pressed="true">Torch · tucked</button>
<button id="Metric" type="button" aria-pressed="false">Metric · ring locked</button>
</header>
<model-viewer id="ship" alt="Wayfarer engineering candidate with new nacelles" src="wayfarer_nacelle_torch_f173094b.glb" camera-controls auto-rotate shadow-intensity="0.5" exposure="1.1"></model-viewer>
<p>CANDIDATE ONLY. Released canon GLBs unchanged. Source physical B-reps, not this viewer, govern D9. Mid-stroke swing envelope OPEN. Serve this directory over HTTP(S); external model-viewer library requires internet.</p>
<script>
for (const name of ["torch","Metric"]) document.getElementById(name).addEventListener("click", () => {
  document.getElementById("ship").src = "wayfarer_nacelle_" + name + "_f173094b.glb";
  for (const k of ["torch","Metric"]) document.getElementById(k).setAttribute("aria-pressed",String(k===name));
});
</script>
</html>
