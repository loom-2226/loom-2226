<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LOOM · Solar Basemap</title><link rel="stylesheet" href="/design/loom-tokens.css"><link rel="stylesheet" href="/qa.css"></head>
<body><main id="app">
<canvas id="scene" aria-label="Continuous Sun-centered Solar basemap. Tap a body to select; drag to pan; pinch to zoom; drag two fingers together to tilt and orbit."></canvas><div id="labels"></div><div id="selectionRing" role="img" hidden></div>
<header class="pilot-chrome"><div class="brand"><img class="mark" src="/design/loom-mark-ion-blue.svg" alt="LOOM"><span>SOLAR BASEMAP</span></div><span class="epoch">BASEMAP EPOCH 2226-01-01 · SUN / ECLIPJ2000</span></header>
<aside id="selectionBadge" hidden></aside>
<aside id="timeControls"><button id="timeReverse" aria-label="Reverse time">REV</button><button id="timePlay" aria-label="Play or pause time">PLAY</button><select id="timeRate" aria-label="Game time rate"><option value="1">1 d/s</option><option value="10">10 d/s</option><option value="100" selected>100 d/s</option><option value="1000">1000 d/s</option></select><input id="timeScrub" type="range" min="0" max="1000" value="0" aria-label="Game epoch"><span id="timeEpoch">TEMPORAL LOADING</span></aside>
<aside id="scale" aria-label="Map scale"><span id="sceneContext">SUN-CENTERED SOLAR SCENE</span><span id="scaleText">Loading governed scale…</span><i id="scaleBar"></i></aside>
<section class="hud"><div class="hint">Tap body to focus · drag to pan · pinch to zoom · two-finger drag to tilt</div><div class="hud-controls"><button id="fit">Reset view</button><details id="details"><summary>Map details</summary><div id="status">Loading verified basemap…</div><div id="counts"></div><div class="legend"><i class="dot sun"></i> Sun <i class="dot planet"></i> Planet <i class="dot minor"></i> Minor body <i class="line"></i> Reference orbit</div><button id="diagnostics">Catalog</button></details></div></section>
<section id="catalog" class="catalog"></section><section id="report" class="report" aria-live="polite"></section></main>
<script src="/three.min.js"></script><script src="/basemap.js"></script><script src="/renderer.js"></script><script src="/temporal.js"></script><script src="/qa.js"></script></body></html>
