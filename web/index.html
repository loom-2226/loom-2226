<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>LOOM — Wayfarer Geometry Lab</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#111;color:#eee}html,body{margin:0;height:100%;overflow:hidden}#app{height:100%;display:grid;grid-template-rows:auto 1fr}header{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap;padding:.5rem .65rem;background:#181818;border-bottom:1px solid #333}header strong{margin-right:.45rem}.pill{font-size:.75rem;padding:.24rem .42rem;border:1px solid #444;border-radius:999px}button,select{background:#222;color:#eee;border:1px solid #555;border-radius:.35rem;padding:.38rem .5rem}#stage{position:relative;min-height:0}canvas{display:block;width:100%;height:100%}#panel{position:absolute;right:.6rem;top:.6rem;width:min(340px,72vw);max-height:58%;overflow:auto;background:#111e;border:1px solid #444;border-radius:.5rem;padding:.55rem;font-size:.76rem;box-shadow:0 .2rem 1rem #0008}#panel[hidden]{display:none}#panelHead{position:sticky;top:-.55rem;display:flex;justify-content:space-between;align-items:center;margin:-.55rem -.55rem .35rem;padding:.35rem .45rem;background:#111f;border-bottom:1px solid #333}#panelTitle{font-weight:700}#panelClose{font-size:1.05rem;line-height:1;padding:.25rem .48rem;border-radius:999px}#panelBody{line-height:1.45}.kv{display:grid;grid-template-columns:auto 1fr;gap:.2rem .55rem}.kv b{color:#aaa}.prov{display:inline-block;margin:.15rem 0 .4rem;padding:.15rem .35rem;border:1px solid #666;border-radius:.3rem;font-size:.7rem}#status{position:absolute;left:.6rem;bottom:.6rem;max-width:90vw;background:#111d;border:1px solid #444;border-radius:.4rem;padding:.4rem .55rem;font-size:.72rem;white-space:pre-wrap}label{display:inline-flex;gap:.28rem;align-items:center;font-size:.78rem}@media(max-width:640px){header{gap:.32rem;padding:.4rem}header strong{width:100%;font-size:.86rem}button,select{font-size:.72rem;padding:.32rem .4rem}label{font-size:.72rem}#panel{right:.45rem;top:.45rem;width:min(300px,68vw);max-height:48%;font-size:.7rem;padding:.45rem}#panelHead{top:-.45rem;margin:-.45rem -.45rem .25rem}#status{font-size:.68rem}}
</style>
</head>
<body><div id="app"><header>
<strong>WAYFARER GEOMETRY LAB v0.2</strong><span id="validation" class="pill">loading…</span>
<select id="view"><option value="iso">3/4</option><option value="side">side</option><option value="top">top</option><option value="front">front</option><option value="aft">aft</option></select>
<select id="launch"><option>DOCKED</option><option>ABSENT</option></select><select id="radiators"><option>STOWED</option><option>DEPLOYED</option></select>
<label><input id="cutaway" type="checkbox" />CUTAWAY</label><label><input id="zones" type="checkbox" />ZONES</label><label><input id="com" type="checkbox" checked />CoM</label><label><input id="openGeom" type="checkbox" />OPEN</label>
</header><div id="stage"><div id="panel" hidden><div id="panelHead"><span id="panelTitle">COMPONENT</span><button id="panelClose" type="button" aria-label="Close component details">×</button></div><div id="panelBody"></div></div><div id="status">Starting viewer…</div></div></div>
<script>(function(){function showError(label,detail){var v=document.getElementById('validation'),s=document.getElementById('status');if(v){v.textContent='STARTUP ERROR';v.style.borderColor='#a55'}if(s)s.textContent=label+'\n'+detail}window.addEventListener('error',function(e){showError('JavaScript error',[e.message,e.filename?('FILE '+e.filename):'',e.lineno?('LINE '+e.lineno+':'+e.colno):''].filter(Boolean).join('\n')||'Unknown script error')});window.addEventListener('unhandledrejection',function(e){var r=e.reason;showError('Unhandled promise rejection',r&&r.stack?r.stack:String(r))});window.__wayfarerShowError=showError})();</script>
<script src="/web/three/three.min.js?v=0.1.2"></script><script src="/web/viewer.js?v=0.2.0"></script></body></html>
