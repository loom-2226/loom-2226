<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>LOOM — Wayfarer Geometry Lab</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#111;color:#eee}
html,body{margin:0;height:100%;overflow:hidden}#app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;padding:.55rem .7rem;background:#181818;border-bottom:1px solid #333}
header strong{margin-right:.6rem}.pill{font-size:.78rem;padding:.25rem .45rem;border:1px solid #444;border-radius:999px}
button,select{background:#222;color:#eee;border:1px solid #555;border-radius:.35rem;padding:.4rem .55rem}
#stage{position:relative;min-height:0}canvas{display:block;width:100%;height:100%}
#panel{position:absolute;right:.6rem;top:.6rem;width:min(340px,72vw);max-height:58%;overflow:auto;background:#111e;border:1px solid #444;border-radius:.5rem;padding:.55rem;font-size:.76rem;box-shadow:0 .2rem 1rem #0008}
#panel[hidden]{display:none}
#panelHead{position:sticky;top:-.55rem;display:flex;justify-content:flex-end;margin:-.55rem -.55rem .2rem;padding:.25rem;background:#111f}
#panelClose{font-size:1.05rem;line-height:1;padding:.25rem .48rem;border-radius:999px}
#panelBody{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}
#status{position:absolute;left:.6rem;bottom:.6rem;max-width:88vw;background:#111d;border:1px solid #444;border-radius:.4rem;padding:.4rem .55rem;font-size:.75rem;white-space:pre-wrap}
label{display:inline-flex;gap:.3rem;align-items:center;font-size:.8rem}
@media (max-width:640px){#panel{right:.45rem;top:.45rem;width:min(300px,68vw);max-height:48%;font-size:.7rem;padding:.45rem}#panelHead{top:-.45rem;margin:-.45rem -.45rem .15rem}}
</style>
</head>
<body>
<div id="app">
<header>
<strong>WAYFARER GEOMETRY LAB v0.1</strong>
<span id="validation" class="pill">loading…</span>
<select id="view"><option value="iso">3/4</option><option value="side">side</option><option value="top">top</option><option value="front">front</option><option value="aft">aft</option></select>
<select id="launch"><option>DOCKED</option><option>ABSENT</option></select>
<select id="radiators"><option>STOWED</option><option>DEPLOYED</option></select>
<label><input id="openGeom" type="checkbox" />OPEN geometry</label>
</header>
<div id="stage">
  <div id="panel" hidden>
    <div id="panelHead"><button id="panelClose" type="button" aria-label="Close component details">×</button></div>
    <pre id="panelBody"></pre>
  </div>
  <div id="status">Starting viewer…</div>
</div>
</div>
<script>
(function(){
  function showError(label, detail){
    var v=document.getElementById('validation');
    var s=document.getElementById('status');
    if(v){v.textContent='STARTUP ERROR';v.style.borderColor='#a55'}
    if(s){s.textContent=label+'\n'+detail}
  }
  window.addEventListener('error',function(e){
    var parts=[e.message,e.filename?('FILE '+e.filename):'',e.lineno?('LINE '+e.lineno+':'+e.colno):''];
    showError('JavaScript error',parts.filter(Boolean).join('\n')||'Unknown script error');
  });
  window.addEventListener('unhandledrejection',function(e){
    var r=e.reason;
    showError('Unhandled promise rejection',r&&r.stack?r.stack:String(r));
  });
  window.__wayfarerShowError=showError;
})();
</script>
<script src="/web/three/three.min.js?v=0.1.2"></script>
<script src="/web/viewer.js?v=0.1.3"></script>
</body>
</html>
